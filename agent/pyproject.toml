[project]
name = "niu-agent"
version = "0.1.0"
description = "Niu Agent - Python agent core replacing Nanobot"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.80.0",
    "aiosqlite>=0.20.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "watchdog>=3.0.0",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # Line too long (we handle it ourselves)

[tool.pytest.ini_options]
asyncio_mode = "auto"
