# niu-natives — Niu 桌面采集/输入 native 绑定（PyO3）
# 源码移植自 oh-my-pi crates/pi-natives/src/desktop（MIT，can1357/oh-my-pi）。
#
# 【T2a 终态】T1 原样搬运 omp 源码 → T2a 手术完成：删 omp 原生绑定层/Promise
# 任务链/ax 全量，PyO3 #[pyclass] DesktopSession + macOS ax_lite 聚焦子集。
# 见 docs/superpowers/plans/2026-09-09-vision-phase1-niu-natives-plan.md。

[package]
name = "niu-natives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Niu desktop capture/input native bindings (PyO3), ported from oh-my-pi pi-natives desktop module (MIT)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# pyo3 版本 pin：crates.io 最新稳定 0.2x（maturin 1.15 配套，T3 构建链）
pyo3 = { version = "=0.29.2", features = ["extension-module"] }

# --- 公共（跨平台纯逻辑：frame/keys/error 等）---
image = { version = "0.25", default-features = false, features = ["png"] }
flume = "0.11"
parking_lot = "0.12.5"

# --- mac + win 双平台（与 omp 源 cfg(any) 组一致：win32/capture.rs 同样 use xcap）---
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { version = "=0.9.6", default-features = false }
# enigo 仅 win32 输入用；macOS 纯 CGEvent——无条件声明保跨平台可编译
enigo = { version = "=0.6.1", default-features = false }

# --- macOS ---
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-foundation = "=0.3.2"
# Processes feature: HIServices::TransformProcessType（后台降级，阻止 Dock 出现 Python 图标）
objc2-application-services = { version = "=0.3.2", features = ["Processes"] }
objc2-core-foundation = "=0.3.2"
foreign-types = "=0.5.0"
libc = "0.2"
tempfile = "=3.27.0"

# --- Windows ---
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# UIA 语义树（desktop/ax.rs 的 Uia 变体）；与上游 pi-natives 同 pin
uiautomation = "=0.25.0"

[build-dependencies]
# 与 pyo3 同版配套：macOS 扩展模块链接参数（-undefined dynamic_lookup）
pyo3-build-config = "=0.29.2"
