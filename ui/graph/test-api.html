<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Graph API Test</title>
</head>
<body>
  <h2>Graph API Test</h2>
  <pre id="result">Loading...</pre>
  <script>
    fetch('http://127.0.0.1:9876/api/kg/snapshot?limit=10')
      .then(r => r.json())
      .then(d => {
        document.getElementById('result').textContent =
          `nodes: ${d.nodes?.length}, edges: ${d.edges?.length}\n` +
          `first node: ${JSON.stringify(d.nodes?.[0], null, 2)}`;
      })
      .catch(e => {
        document.getElementById('result').textContent = 'Error: ' + e.message;
      });
  </script>
</body>
</html>
