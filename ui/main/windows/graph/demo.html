<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>force-graph Demo</title>
  <style>
    body { margin: 0; background: #1a1a2e; font-family: sans-serif; }
    #graph { width: 100vw; height: 100vh; }
    .controls { position: fixed; top: 10px; left: 10px; z-index: 10; color: #fff; font-size: 13px; }
    .controls button { margin: 4px; padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; background: #4A90D9; color: #fff; }
    .controls button:hover { background: #357ABD; }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="addNodes()">+10 节点</button>
    <button onclick="togglePerspective()">切换视角</button>
    <button onclick="fitView()">适配视口</button>
    <span id="info"></span>
  </div>
  <div id="graph"></div>
  <script src="./node_modules/force-graph/dist/force-graph.min.js"></script>
  <script>
    // Generate sample data — 5 groups, each with a hub and spokes
    const colors = ['#4A90D9', '#5CB85C', '#17BECF', '#E8A838', '#8E44AD', '#E06B9E', '#9B59B6', '#F39C12'];
    const groupNames = ['人物', '组织', '技术', '文档', '概念', '地点', '事件', '其他'];
    let nodes = [];
    let links = [];

    // Create 8 groups with hubs and spokes
    for (let g = 0; g < 8; g++) {
      const hubId = `hub-${g}`;
      nodes.push({ id: hubId, label: groupNames[g], color: colors[g], val: 8, group: g });
      for (let s = 0; s < 5; s++) {
        const nodeId = `node-${g}-${s}`;
        nodes.push({ id: nodeId, label: `${groupNames[g]}-${s+1}`, color: colors[g], val: 3, group: g });
        links.push({ source: hubId, target: nodeId });
      }
    }
    // No cross-group links — simulates real KG data where groups are disconnected

    let perspectiveGroup = null;

    const graph = ForceGraph()(document.getElementById('graph'))
      .backgroundColor('#1a1a2e')
      .nodeId('id')
      .nodeVal(d => d.val)
      .nodeColor(d => d.color)
      .nodeCanvasObjectMode(() => 'replace')
      .nodeCanvasObject((node, ctx, globalScale) => {
        const size = Math.max(2, node.val || 4);
        const fontSize = Math.max(11 / globalScale, 3);
        const opacity = (perspectiveGroup === null) ? 0.85 : (node.group === perspectiveGroup ? 1 : 0.25);

        ctx.beginPath();
        ctx.arc(node.x, node.y, size, 0, 2 * Math.PI);
        ctx.fillStyle = node.color;
        ctx.globalAlpha = opacity;
        ctx.fill();
        ctx.globalAlpha = 1;

        if (fontSize > 4) {
          ctx.font = `${fontSize}px Sans-Serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = '#ccc';
          ctx.globalAlpha = opacity;
          ctx.fillText(node.label, node.x, node.y - size - 1);
          ctx.globalAlpha = 1;
        }
      })
      .linkSource('source')
      .linkTarget('target')
      .linkColor(() => 'rgba(255,255,255,0.15)')
      .linkWidth(1)
      .linkDirectionalArrowLength(3)
      .linkDirectionalArrowRelPos(1)
      .d3AlphaDecay(0.02)
      .d3VelocityDecay(0.3)
      .warmupTicks(50)
      .cooldownTime(3000)
      .onEngineStop(() => {
        graph.zoomToFit(400, 40);
      });

    graph.graphData({ nodes, links });

    // Configure forces AFTER data is loaded (simulation must exist first)
    setTimeout(function() {
      graph.d3Force('charge').strength(-0.5);
      graph.d3Force('link').distance(30).strength(0.8);
      graph.reheatSimulation();
    }, 100);
    updateInfo();

    function addNodes() {
      const g = Math.floor(Math.random() * 8);
      const start = nodes.length;
      for (let i = 0; i < 10; i++) {
        const id = `new-${start + i}`;
        nodes.push({ id, label: `新节点${i+1}`, color: colors[g], val: 2 + Math.random() * 3, group: g });
        links.push({ source: `hub-${g}`, target: id });
      }
      graph.graphData({ nodes, links });
      updateInfo();
    }

    function togglePerspective() {
      perspectiveGroup = perspectiveGroup === null ? 0 : (perspectiveGroup + 1) % 8;
      // Re-apply opacity by refreshing data
      graph.graphData({ nodes, links });
      graph.reheatSimulation();
      updateInfo();
    }

    function fitView() {
      graph.zoomToFit(400, 40);
    }

    function updateInfo() {
      document.getElementById('info').textContent =
        ` ${nodes.length} 节点, ${links.length} 关系 | 视角: ${perspectiveGroup === null ? '全部' : groupNames[perspectiveGroup]}`;
    }
  </script>
</body>
</html>
