<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Niu 设置</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Ma Shan Zheng', 'Caveat', cursive;
      background: #faf8f0;
      min-height: 100vh;
      color: #333;
      -webkit-app-region: drag;
      /* 棉纸纹理 */
      background-image: 
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    }
    .container {
      padding: 20px;
      -webkit-app-region: no-drag;
    }
    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #e7ca4a;
      border-bottom: 2px dashed rgba(0,0,0,0.1);
    }
    .titlebar h1 { 
      font-size: 20px; 
      font-weight: normal;
      color: #333;
      text-shadow: 0.5px 0.5px 0.5px rgba(0,0,0,0.15);
    }
    .close-btn {
      background: #f8a7c8;
      border: none;
      color: #333;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Ma Shan Zheng', cursive;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { 
      transform: scale(1.1);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    
    .logo { 
      text-align: center; 
      margin: 25px 0 20px; 
    }
    .logo-icon { font-size: 56px; }
    .logo-text { 
      font-size: 28px; 
      color: #333;
      text-shadow: 0.5px 0.5px 0.5px rgba(0,0,0,0.15);
      margin-top: 10px;
    }
    .logo-sub { 
      font-size: 16px; 
      color: #666;
      margin-top: 5px;
    }
    
    /* 便签卡片 */
    .note-card {
      background: #e7ca4a;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.1);
      position: relative;
    }
    .note-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      border-radius: 4px;
      pointer-events: none;
    }
    .note-card.pink { background: #f8a7c8; }
    .note-card.blue { background: #78b2be; }
    .note-card.mint { background: #a3f0c2; }
    
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 16px; 
      color: #333;
    }
    
    select, input {
      width: 100%;
      padding: 10px 14px;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      font-size: 16px;
      font-family: 'Ma Shan Zheng', 'Caveat', cursive;
      background: rgba(255,255,255,0.7);
      color: #333;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 50 50' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    }
    select:focus, input:focus { 
      outline: none; 
      border-color: #78b2be;
      background: rgba(255,255,255,0.9);
    }
    input::placeholder { color: #999; }
    
    .advanced-toggle {
      background: none;
      border: 2px dashed rgba(0,0,0,0.15);
      color: #666;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Ma Shan Zheng', cursive;
      padding: 8px 16px;
      border-radius: 4px;
      width: 100%;
      text-align: left;
      margin-top: 10px;
    }
    .advanced-toggle:hover { 
      background: rgba(0,0,0,0.03);
      border-color: #78b2be;
    }
    .advanced-fields { 
      display: none; 
      margin-top: 15px;
      padding: 15px;
      background: rgba(0,0,0,0.02);
      border-radius: 4px;
      border: 2px dashed rgba(0,0,0,0.08);
    }
    .advanced-fields.show { display: block; }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      font-family: 'Ma Shan Zheng', cursive;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.1);
    }
    .btn-primary {
      background: #a3f0c2;
      color: #333;
    }
    .btn-primary:hover { 
      transform: translateY(-2px);
      box-shadow: 4px 4px 12px rgba(0,0,0,0.15);
    }
    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      transform: none;
    }
    
    .status { 
      text-align: center; 
      margin-top: 12px; 
      font-size: 16px;
      padding: 8px;
      border-radius: 4px;
    }
    .status.success { 
      background: #9bc295;
      color: #333;
    }
    .status.error { 
      background: #f8a7c8;
      color: #333;
    }
    .status.loading { 
      background: #78b2be;
      color: white;
    }
    
    .footer { 
      text-align: center; 
      margin-top: 20px; 
      font-size: 14px; 
      color: #999;
    }
    
    /* 铅笔字效果 */
    .pencil-text {
      text-shadow: 
        0.5px 0.5px 0.5px rgba(0,0,0,0.2),
        -0.5px -0.5px 0 rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1 class="pencil-text">🤖 妞妞设置</h1>
    <button class="close-btn">×</button>
  </div>
  
  <div class="container">
    <div class="logo">
      <div class="logo-icon">👋</div>
      <div class="logo-text pencil-text">欢迎使用妞妞</div>
      <div class="logo-sub">请配置你的大模型</div>
    </div>
    
    <div class="note-card">
      <div class="form-group">
        <label class="pencil-text">选择预设</label>
        <select id="preset">
          <option value="">自定义配置</option>
        </select>
        <div style="font-size: 12px; color: #666; margin-top: 4px;">选择预设可自动填充参考值；手动修改任何字段后自动变为"自定义配置"</div>
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label class="pencil-text">API Key</label>
        <input type="password" id="apiKey" placeholder="输入你的 API Key">
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label class="pencil-text">上下文窗口大小 (tokens)</label>
        <input type="number" id="contextWindowSize" placeholder="200000" min="32000" max="2000000" step="1000">
        <div style="font-size: 12px; color: #666; margin-top: 4px;">模型上下文窗口：128K=128000, 200K=200000, 256K=256000, 1M=1000000</div>
      </div>
    </div>
    
    <button class="advanced-toggle" onclick="toggleAdvanced()">▼ 高级选项</button>
    <div class="advanced-fields" id="advancedFields">
      <div class="form-group">
        <label class="pencil-text">API 类型</label>
        <select id="apiType">
          <option value="openai">OpenAI 兼容</option>
          <option value="anthropic">Anthropic</option>
        </select>
      </div>
      <div class="form-group" style="margin-top: 12px;">
        <label class="pencil-text">API 地址</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1">
      </div>
      <div class="form-group" style="margin-top: 12px;">
        <label class="pencil-text">模型名称</label>
        <input type="text" id="model" placeholder="gpt-4o-mini">
      </div>

      <div class="note-card mint" style="margin-top: 15px;">
        <div class="form-group">
          <label class="pencil-text">溢出警告阈值</label>
          <input type="number" id="warningThreshold" placeholder="0.8" min="0.1" max="0.99" step="0.05">
          <div style="font-size: 12px; color: #666; margin-top: 4px;">上下文使用率达到此比例时触发压缩（默认 0.8 = 80%）</div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label class="pencil-text">压缩目标 token 数</label>
          <input type="number" id="compressTargetTokens" placeholder="60000" min="10000" max="500000" step="5000">
          <div style="font-size: 12px; color: #666; margin-top: 4px;">压缩后保留的目标 token 数（默认 60000，即压到约 30%）</div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label class="pencil-text">睡眠触发时间 (分钟)</label>
          <input type="number" id="sleepTriggerMinutes" placeholder="5" min="1" max="60" step="1">
          <div style="font-size: 12px; color: #666; margin-top: 4px;">空闲多久后触发睡眠整理（默认 5 分钟）</div>
        </div>
      </div>
    </div>
    
    <button class="btn btn-primary" id="testBtn" onclick="testAndSave()">
      ✨ 测试连接并保存
    </button>
    
    <div class="status" id="status"></div>
    
    <div class="footer">
      配置完成后，妞妞就可以帮你管理知识啦！
    </div>
  </div>

  <div id="confirmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; -webkit-app-region: no-drag;">
    <div style="background:#fff; padding:20px; border-radius:8px; max-width:400px; text-align:center;">
      <p style="margin:0 0 15px 0; font-size:14px; color:#333;">模型配置尚未验证通过，确定要退出吗？退出后应用可能无法正常工作。</p>
      <button id="confirmYes" style="margin:0 5px; padding:6px 16px; background:#ff6b6b; color:#fff; border:none; border-radius:4px; cursor:pointer;">确定退出</button>
      <button id="confirmNo" style="margin:0 5px; padding:6px 16px; background:#999; color:#fff; border:none; border-radius:4px; cursor:pointer;">取消</button>
    </div>
  </div>

  <script>
    let presets = [];
    let testPassedInSession = false;
    
    async function init() {
      presets = await window.electronAPI.getPresets();
      const config = await window.electronAPI.getConfig();
      
      const presetSelect = document.getElementById('preset');
      presets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        presetSelect.appendChild(opt);
      });
      
      if (config.llm) {
        // 如果配置文件的 presetId 不在预设列表中（或为空），下拉选""（自定义配置）
        // 否则选对应预设
        const presetId = config.llm.presetId || '';
        const presetExists = presetId && presets.some(p => p.id === presetId);
        document.getElementById('preset').value = presetExists ? presetId : '';
        document.getElementById('apiKey').value = config.llm.apiKey || '';
        document.getElementById('apiBase').value = config.llm.apiBase || '';
        document.getElementById('model').value = config.llm.model || '';
        document.getElementById('apiType').value = config.llm.type || 'openai';
      }

      if (config.context) {
        document.getElementById('contextWindowSize').value = config.context.contextWindowSize || '';
        document.getElementById('warningThreshold').value = config.context.warningThreshold || '';
        document.getElementById('compressTargetTokens').value = config.context.compressTargetTokens || '';
        document.getElementById('sleepTriggerMinutes').value = config.context.sleepTriggerMinutes || '';
      }
    }
    
    function toggleAdvanced() {
      const fields = document.getElementById('advancedFields');
      const btn = document.querySelector('.advanced-toggle');
      fields.classList.toggle('show');
      btn.textContent = fields.classList.contains('show') ? '▲ 高级选项' : '▼ 高级选项';
    }
    
    document.getElementById('preset').addEventListener('change', (e) => {
      testPassedInSession = false;
      const preset = presets.find(p => p.id === e.target.value);
      if (preset) {
        document.getElementById('apiBase').value = preset.apiBase;
        document.getElementById('model').value = preset.model;
        document.getElementById('apiType').value = preset.type || 'openai';
      }
    });

    ['apiKey', 'apiBase', 'model', 'apiType'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => {
        testPassedInSession = false;
        // 用户手动修改任何字段 → 自动变为"自定义配置"（清空 presetId）
        // 因为表单值已不再匹配任何预设
        document.getElementById('preset').value = '';
      });
    });

    // 标准基础配置缺省（三处一致：本处 / main.js get-config 兜底 / config-manager 兜底）。
    // Why: 首次启动 existingConfig 是空骨架，probe/save 的缺省必须自带这些
    // 基础运行字段，保证 probe 探测环境 = 运行时环境（2026-07-27 首次启动
    // probe 失败根因：缺 thinking:disabled，探测请求与运行时实际调用不一致）。
    const DEFAULT_LLM_KWARGS = {};
    const DEFAULT_LIGHTRAG_KWARGS = { thinking: { type: "disabled" }, allowed_openai_params: [] };

    async function testAndSave() {
      const existingConfig = await window.electronAPI.getConfig();
      const presetId = document.getElementById('preset').value;
      const apiKey = document.getElementById('apiKey').value;
      const apiBase = document.getElementById('apiBase').value;
      const model = document.getElementById('model').value;
      const type = document.getElementById('apiType').value;

      if (!apiBase) { setStatus('请选择预设或填写 API 地址', 'error'); return; }
      if (!model) { setStatus('请输入模型名称', 'error'); return; }
      // Ollama 等本地模型无需 API Key（apiBase 为 localhost/127.0.0.1 时豁免）
      const isLocal = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?/.test(apiBase);
      if (!apiKey && !isLocal) { setStatus('请输入 API Key', 'error'); return; }

      setStatus('测试模型连接中...', 'loading');
      document.getElementById('testBtn').disabled = true;

      // 第一步：测试（传表单值到请求体，不保存文件）
      const config = {
        apiKey, apiBase, model, type,
        litellm_kwargs: { ...DEFAULT_LLM_KWARGS, ...(existingConfig.llm?.litellm_kwargs || {}) }
      };
      const result = await window.electronAPI.testConnection(config);

      if (result.success) {
        // 第一步半：测试通过后追加 response_format 探测（3 档递进）
        setStatus('探测格式化输出能力中（可能需要 1-5 分钟（三次采样 + 限流/超时重试））...', 'loading');
        // probe 必须用知识图谱模型的运行时基础配置（含 thinking:disabled），
        // 保证探测环境 = 运行时环境，探测档位结果对运行时才有效
        const probeConfig = {
          ...config,
          litellm_kwargs: { ...DEFAULT_LIGHTRAG_KWARGS, ...(existingConfig.lightrag_llm?.litellm_kwargs || {}) },
        };
        const probeResult = await window.electronAPI.probeResponseFormat(probeConfig);

        // probe_failed（限流/超时/基础设施错误）：不写文件，提示重试。
        // Why（用户核心原则）：测试失败不写文件，测试成功才写。失败时写文件会
        // 产生缺 response_format_mode 的不完整配置，知识图谱运行时拿不到
        // Response 格式档位。不自动关窗，让用户决定重试或放弃。
        if (probeResult.result !== 'supported') {
          setStatus('格式化输出探测失败（' + (probeResult.reason || '未知错误') + '），配置未保存。请稍后点击按钮重试。', 'error');
          document.getElementById('testBtn').disabled = false;
          return;
        }

        const responseFormatMode = probeResult.mode || 'prompt_only';
        const allowedOpenaiParams = responseFormatMode === 'prompt_only' ? [] : ['response_format'];
        const probeReason = probeResult.reason || `格式化输出档位: ${responseFormatMode}`;

        // 第二步：保存配置（仅连通性测试 + probe 探测都成功才执行到这里）
        setStatus('保存配置中...（' + probeReason + '）', 'loading');
        const existingLightragLlm = existingConfig.lightrag_llm || {};
        const existingLightragKwargs = existingLightragLlm.litellm_kwargs || {};
        // 基础配置（thinking:disabled 等）无条件写入 + 探测结果覆盖
        const newLitellmKwargs = {
          ...DEFAULT_LIGHTRAG_KWARGS,
          ...existingLightragKwargs,
          response_format_mode: responseFormatMode,
          allowed_openai_params: allowedOpenaiParams,
        };
        const lightragLlmConfig = {
          presetId: existingLightragLlm.presetId || "",
          apiKey: existingLightragLlm.apiKey || "",
          apiBase: existingLightragLlm.apiBase || "",
          model: existingLightragLlm.model || "",
          type: existingLightragLlm.type || "openai",
          // 思维深度 High 是知识图谱基础配置（用户确认），缺省不是 "none"
          reasoning_effort: existingLightragLlm.reasoning_effort || "high",
          temperature: existingLightragLlm.temperature ?? 0.2,
          litellm_kwargs: newLitellmKwargs,
        };

        const saveResult = await window.electronAPI.saveConfig({
          llm: { ...config, presetId: presetId, reasoning_effort: existingConfig.llm?.reasoning_effort || "" },
          lightrag_llm: lightragLlmConfig,
          context: {
            contextWindowSize: parseInt(document.getElementById('contextWindowSize').value) || 200000,
            warningThreshold: parseFloat(document.getElementById('warningThreshold').value) || 0.8,
            compressTargetTokens: parseInt(document.getElementById('compressTargetTokens').value) || 60000,
            sleepTriggerMinutes: parseInt(document.getElementById('sleepTriggerMinutes').value) || 5
          },
          storage: existingConfig.storage || {},
          // 保留用户已有 logging 设置；首次启动用设计缺省（关日志）
          logging: existingConfig.logging || { enabled: false, level: "INFO" },
          firstRun: false
        });
        if (saveResult.success) {
          testPassedInSession = true;
          setStatus('模型测试通过，配置已保存！格式化输出: ' + probeReason, 'success');
          setTimeout(() => { window.electronAPI.closeWindow(); }, 1500);
        } else {
          setStatus('保存失败: ' + saveResult.error, 'error');
        }
      } else {
        setStatus('模型测试失败: ' + (result.message || '请检查配置'), 'error');
      }
      document.getElementById('testBtn').disabled = false;
    }
    
    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + cls;
    }
    
    // Close button handler
    document.querySelector('.close-btn').addEventListener('click', () => {
      if (!testPassedInSession) {
        const modal = document.getElementById('confirmModal');
        modal.style.display = 'flex';
        return;  // 等用户点模态层的按钮
      }
      window.electronAPI.closeWindow();
    });

    // 模态层按钮
    document.getElementById('confirmYes').addEventListener('click', () => {
      window.electronAPI.closeWindow();
    });
    document.getElementById('confirmNo').addEventListener('click', () => {
      document.getElementById('confirmModal').style.display = 'none';
    });
    
    init();
  </script>
</body>
</html>
