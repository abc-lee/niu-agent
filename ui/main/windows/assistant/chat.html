<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>妞妞聊天</title>
  <!-- Markdown 渲染 -->
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <!-- HTML 净化 — 防止 XSS (marked 不自带 sanitize) -->
  <script src="../../node_modules/dompurify/dist/purify.js"></script>
  <script>
    // 配置 marked：保留换行，启用 GFM
    if (typeof marked !== 'undefined' && marked.setOptions) {
      marked.setOptions({ breaks: true, gfm: true });
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #faf8f0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      /* 字体由动态注入脚本覆盖；无配置时用浏览器系统默认 */
      /* 铅笔笔迹效果 */
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* 主容器 - 便签风格 */
    .container {
      width: 100%;
      height: 100%;
      background: #faf8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      /* 棉纸纹理 */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    }
    
    /* 调整大小手柄 */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
      z-index: 100;
      -webkit-app-region: no-drag;
    }
    .resize-handle::before {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(0,0,0,0.2);
      border-bottom: 2px solid rgba(0,0,0,0.2);
    }
    
    /* 标题栏 - 可拖动 */
    .header {
      padding: 12px 16px;
      background: #a8d8e2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-bottom: 2px dashed rgba(0,0,0,0.1);
      -webkit-app-region: drag;
    }
    .header:active { cursor: grabbing; }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title .avatar {
      width: 28px;
      height: 42px;
      object-fit: contain;
    }
    .header-title span {
      font-size: 18px;
      font-weight: normal;
      color: #000;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.3px rgba(0,0,0,0.4);
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.25);
    }
    .close-btn {
      background: #f8a7c8;
      border: none;
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { 
      transform: scale(1.1);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    
    /* 消息区域 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: transparent;
    }
    .message {
      margin-bottom: 10px;
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      /* 保留换行符 */
      white-space: pre-wrap;
    }
    /* 时间戳气泡：hover 消息时显示 */
    .message[data-timestamp] {
      position: relative;
    }
    .timestamp-bubble {
      position: absolute;
      top: 4px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }
    .message:hover .timestamp-bubble {
      opacity: 1;
    }
    .message.user {
      background: #78b2be;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.1);
    }
    .message.assistant {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
    }
    /* subagent_msg：主↔子 Agent 对话侧边小卡片样式 */
    .message.subagent-msg {
      margin: 8px 16px;
      padding: 6px 10px;
      background: #f5f5f5;
      border-left: 3px solid #888;
      font-size: 0.85em;
      color: #555;
      border-radius: 4px;
    }
    .message.subagent-msg .subagent-direction {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 2px;
    }
    .message.subagent-msg .subagent-content {
      color: #333;
    }
    /* Markdown 渲染后的表格样式 */
    .message.assistant .message-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
    }
    .message.assistant .message-text th,
    .message.assistant .message-text td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .message.assistant .message-text th {
      background: #f5f5f5;
      font-weight: bold;
    }
    .message.assistant .message-text tr:nth-child(even) td {
      background: #fafafa;
    }
    .message.assistant .message-text code {
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 13px;
    }
    .message.assistant .message-text pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .message.assistant .message-text pre code {
      background: none;
      padding: 0;
    }
    .message.assistant .message-text ul,
    .message.assistant .message-text ol {
      padding-left: 20px;
      margin: 4px 0;
    }
    .message.assistant .message-text {
      white-space: normal;  /* markdown 渲染需要 normal，不能 pre-wrap */
    }
    .message.assistant .message-text blockquote {
      border-left: 3px solid #ccc;
      padding-left: 10px;
      color: #666;
      margin: 6px 0;
    }
    .message.system {
      background: #e9ecef;
      color: #000;
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      border-radius: 4px;
    }
    /* 定时任务消息：灰色背景，左对齐，带时钟图标 */
    .message.scheduled {
      background: #e9ecef;
      color: #555;
      font-size: 14px;
      border-radius: 4px;
      max-width: 85%;
    }
    .message.scheduled::before {
      content: '⏰ ';
      opacity: 0.7;
    }
    
    /* 正在输入动画 */
    .message.typing {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      padding: 10px 14px;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #666;
      border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    /* 输入区域 */
    .input-area {
      padding: 12px;
      background: white;
      border-top: 2px dashed rgba(0,0,0,0.08);
      display: flex;
      gap: 8px;
    }
    .input-area textarea {
      flex: 1;
      padding: 10px 14px;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      font-family: inherit;
      font-size: 16px;
      background: rgba(255,255,255,0.8);
      color: #000;
      outline: none;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
      resize: none;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-area textarea:focus { border-color: #78b2be; }
    .input-area { position: relative; }
    /* ========== 斜杠命令下拉框 ========== */
    .slash-dropdown {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 12px;
      right: 12px;
      background: #faf8f0;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
      z-index: 50;
      max-height: 300px;  /* 容纳全部 6 条命令（/setup 在最底，200px 截断需滚动——用户反馈 2026-08-18） */
      overflow-y: auto;
      font-family: inherit;
      font-size: 14px;
    }
    .slash-dropdown.visible { display: block; }
    .slash-dropdown-item {
      padding: 8px 14px;
      cursor: pointer;
      color: #000;
      border-bottom: 1px dashed rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .slash-dropdown-item:last-child { border-bottom: none; }
    .slash-dropdown-item.selected {
      background: rgba(120, 178, 190, 0.2);
    }
    .slash-dropdown-item:hover {
      background: rgba(120, 178, 190, 0.15);
    }
    .slash-dropdown-item .cmd-name {
      font-weight: bold;
      white-space: nowrap;
    }
    .slash-dropdown-item .cmd-desc {
      color: #999;
      font-size: 12px;
      text-align: right;
    }
    .input-area button {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .input-area button:hover { 
      transform: translateY(-1px);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .stop-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-btn:hover {
      background: #c0392b;
    }
    
    /* 状态栏 */
    .status-bar {
      padding: 8px 16px;
      background: #faf8f0;
      border-top: 2px dashed rgba(0,0,0,0.05);
      font-size: 14px;
      color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .stats {
      display: flex;
      gap: 16px;
    }
    .status-bar .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .context-usage {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: default;
    }
    .context-usage svg {
      flex-shrink: 0;
    }
    .context-usage span {
      font-size: 11px;
      font-weight: 600;
      min-width: 28px;
    }
    .status-bar .graph-btn {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .status-bar .status-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .status-bar .version-label {
      color: #999;
      font-size: 11px;
      padding: 4px 8px;
      font-family: inherit;
    }
    .status-bar .graph-btn:hover {
      background: #8de0a8;
    }
    
    /* 进度条 - 简洁不占地方 */
    .progress-bar {
      display: none;
      padding: 4px 12px;
      background: white;
      border-top: 1px dashed rgba(0,0,0,0.08);
      font-size: 13px;
      color: #000;
    }
    .progress-bar.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar .progress-track {
      flex: 1;
      height: 4px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .progress-fill {
      height: 100%;
      background: #78b2be;
      transition: width 0.3s ease;
    }
    .progress-bar .progress-text {
      min-width: 40px;
      text-align: right;
    }
    
    /* ========== 图片显示 ========== */
    .chat-image {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      cursor: pointer;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .chat-image:hover {
      transform: scale(1.02);
    }
    /* 本地文件链接样式 */
    .local-file-link {
      color: #1890ff;
      text-decoration: underline;
      cursor: pointer;
    }
    .local-file-link:hover {
      color: #40a9ff;
    }
    .local-file-link::before {
      content: '📎 ';
    }

    /* ========== 拖放上传 ========== */
    .container.drag-over {
      background-color: rgba(120, 178, 190, 0.1);
      outline: 2px dashed #78b2be;
    }
    /* ========== 状态气泡（工具调用实时显示） ========== */
    .status-bubble {
      background: white;
      color: #666;
      font-style: italic;
      padding: 10px 14px;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      animation: status-pulse 1.5s ease-in-out infinite;
      max-width: 80%;
      word-break: break-word;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    /* ===== 脑区状态侧滑面板 ===== */
    /* F001 修复：确保面板和触发区相对于 .messages 定位，而非 .container */
    .messages {
      position: relative;
    }
    .brain-trigger-zone {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 5;
      /* F2-001 修复：默认不可交互，由 JS 初始化时定位到 .messages 区域 */
      pointer-events: none;
    }
    .brain-overlay {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 175px;
      background: rgba(120, 80, 20, 0);
      transition: background 0.3s;
      z-index: 8;
      pointer-events: none;
    }
    .brain-overlay.visible {
      background: rgba(120, 80, 20, 0.15);
      pointer-events: auto;
    }
    .brain-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 175px;
      background: #fff8e1;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 200;
      box-shadow: -3px 0 10px rgba(180, 150, 50, 0.2);
      border-left: 2px dashed rgba(180, 150, 50, 0.3);
      font-size: 11px;
      color: #000;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseB'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseB)' opacity='0.06'/%3E%3C/svg%3E");
    }
    .brain-panel.visible {
      transform: translateX(0);
    }
    .brain-title {
      padding: 10px 12px 6px;
      border-bottom: 1px dashed rgba(180, 150, 50, 0.3);
      font-weight: bold;
      font-size: 11px;
      color: #8B6914;
      position: sticky;
      top: 0;
      background: #fff8e1;
      z-index: 1;
    }
    .brain-group-label {
      padding: 6px 12px 3px;
      font-size: 9px;
      color: #999;
      letter-spacing: 0.5px;
    }
    .brain-item {
      padding: 5px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .brain-item:hover {
      background: rgba(231, 202, 74, 0.15);
    }
    .brain-item .dot {
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1;
    }
    .brain-item .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brain-item.off {
      opacity: 0.45;
    }
    .brain-empty {
      padding: 20px 12px;
      text-align: center;
      color: #999;
      font-size: 11px;
    }
    /* ========== 脑区鬼火动画（点亮/熄灭） ========== */
    .brain-spark-container {
      position: absolute;
      /* top 由 JS positionBrainElements() 动态设置 */
      right: 12px;
      z-index: 250;  /* 高于 brain-panel z-index:200，防止面板打开时遮挡动画 */
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .spark-light-zone {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .spark-extinguish-zone {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .brain-spark {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      background: rgba(10, 30, 40, 0.75);
      border: 1px solid rgba(64, 224, 208, 0.35);
      border-radius: 16px;
      box-shadow: 0 0 6px 1px rgba(64, 224, 208, 0.2), 1px 1px 4px rgba(0,0,0,0.15);
      transform: translateZ(0);
    }
    .brain-spark .spark-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0fffe, #40e0d0 40%, #1a9b8a);
      box-shadow: 0 0 4px 1px rgba(64, 224, 208, 0.5);
      transform: translateZ(0);
    }
    .brain-spark .spark-label {
      font-size: 12px;
      font-weight: 600;
      color: #7ff0e0;
      text-shadow: 0 0 4px rgba(64, 224, 208, 0.3);
    }
    /* 点亮动画：从右侧弹出（过冲回弹）→ 停留 → 上飘淡出 */
    .spark-light {
      animation: spark-light-rise 2.5s linear forwards;
    }
    .spark-light::before {
      content: '';
      position: absolute;
      top: 50%; left: 7px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(64, 224, 208, 0.25), transparent 70%);
      transform: translateZ(0);
      animation: spark-light-halo 2.5s linear forwards;
    }
    @keyframes spark-light-rise {
      0%   { opacity: 0; transform: translateZ(0) translateX(60px) scale(0.7); }
      8%   { opacity: 0.5; transform: translateZ(0) translateX(30px) scale(0.85); }
      16%  { opacity: 1; transform: translateZ(0) translateX(-4px) scale(1.05); }
      24%  { transform: translateZ(0) translateX(0) scale(1); }
      68%  { opacity: 1; transform: translateZ(0) translateX(0) scale(1); }
      80%  { opacity: 0.5; transform: translateZ(0) translateY(-3px) scale(0.97); }
      100% { opacity: 0; transform: translateZ(0) translateY(-10px) scale(0.9); }
    }
    @keyframes spark-light-halo {
      0%   { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(0.5); }
      15%  { opacity: 0.5; transform: translateZ(0) translate(0, -50%) scale(1.5); }
      40%  { opacity: 0.2; transform: translateZ(0) translate(0, -50%) scale(2.5); }
      100% { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(3.5); }
    }
    /* 熄灭动画：从右侧弹出（过冲回弹）→ 下坠消散 */
    .spark-extinguish {
      animation: spark-extinguish-fall 2.5s linear forwards;
    }
    .spark-extinguish::before {
      content: '';
      position: absolute;
      top: 50%; left: 7px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(64, 224, 208, 0.25), transparent 70%);
      transform: translateZ(0);
      animation: spark-extinguish-halo 2.5s linear forwards;
    }
    @keyframes spark-extinguish-fall {
      0%   { opacity: 0; transform: translateZ(0) translateX(60px) scale(0.7); }
      8%   { opacity: 0.5; transform: translateZ(0) translateX(30px) scale(0.85); }
      16%  { opacity: 1; transform: translateZ(0) translateX(-4px) scale(1.05); }
      24%  { transform: translateZ(0) translateX(0) scale(1); }
      30%  { opacity: 0.8; transform: translateZ(0) translateY(5px) scale(0.98); }
      50%  { opacity: 0.35; transform: translateZ(0) translateY(22px) scale(0.92); }
      70%  { opacity: 0.15; transform: translateZ(0) translateY(36px) scale(0.87); }
      100% { opacity: 0; transform: translateZ(0) translateY(60px) scale(0.8); }
    }
    @keyframes spark-extinguish-halo {
      0%   { opacity: 0.5; transform: translateZ(0) translate(0, -50%) scale(1); }
      30%  { opacity: 0.2; transform: translateZ(0) translate(0, -50%) scale(0.5); }
      100% { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(0); }
    }

    /* ===== 子 Agent Tab 样式 ===== */
    /* Tab 栏：位于 .header 和 .messages 之间，横向滚动处理溢出 */
    .tab-bar {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      overflow-x: auto;
      padding: 4px 8px 0 8px;
      border-bottom: 1px dashed rgba(180, 150, 50, 0.3);
      background: rgba(255, 255, 255, 0.35);
      scrollbar-width: thin;
    }
    /* 单个 tab：3D 悬浮 + 名称截断 max-width:120px + ellipsis */
    .tab {
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      color: #999;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
      user-select: none;
      background: rgba(245, 240, 230, 0.6);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      margin-right: 2px;
    }
    .tab:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      color: #666;
    }
    /* 活跃 tab：白底 + 底部 2px 青色边框 + 抬高阴影（3D 悬浮） */
    .tab.active {
      background: #fff;
      border-bottom: 2px solid #40a0a0;
      color: #333;
      font-weight: 500;
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.1);
      z-index: 1;
    }
    /* 子 Agent 已完成：半透明 */
    .tab.completed {
      opacity: 0.5;
    }
    /* 子 Agent 异常终止：红色文字 */
    .tab.error {
      color: #e53935;
    }
    /* 未读红点 badge：右上角 6px 圆形，opacity+transition 实现淡入淡出 */
    .tab .badge {
      opacity: 0;
      transition: opacity 200ms ease;
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e53935;
    }
    /* @user 提问等待：闪烁/脉动动画 + 红点 */
    .tab.waiting {
      animation: tab-pulse 1s infinite;
    }
    .tab.waiting .badge {
      opacity: 1;
    }
    @keyframes tab-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }
    /* SSE 建立中：标题后 loading spinner */
    .tab.loading::after {
      content: '⏳';
      margin-left: 4px;
    }
    /* 新 tab 创建：从右滑入 */
    @keyframes tab-slide-in {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .tab.new-tab {
      animation: tab-slide-in 200ms ease;
    }
    /* 子 Agent 消息容器：与主 #messages 同级，默认隐藏 */
    .messages-subagent {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: none;
      background: transparent;
      position: relative;
    }
    .messages-subagent.active {
      display: block;
    }
    /* Tab 切换：消息区淡入 */
    @keyframes tab-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .messages-subagent.fading {
      animation: tab-fade-in 200ms ease;
    }
    /* thinking chain 折叠块：12px 灰字，左侧 2px 灰边框，max-height 200px + 渐变遮罩 */
    .message.thinking {
      font-size: 12px;
      color: #888;
      border-left: 2px solid #ccc;
      padding-left: 8px;
      margin: 4px 0;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      position: relative;
    }
    .message.thinking.expanded {
      max-height: none;
    }
    /* 展开按钮：作为 thinking div 的兄弟元素，不受 overflow-y:auto 裁剪 */
    .thinking-expand-btn {
      display: block;
      width: 100%;
      padding: 4px 0;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #40a0a0;
      text-align: center;
      background: linear-gradient(transparent, #faf8f0 70%);
      margin-top: -4px;
    }
    /* 展开后按钮去掉渐变遮罩 */
    .message.thinking.expanded + .thinking-expand-btn {
      background: none;
    }
    /* @user 提问高亮卡片：黄色 */
    .message.question {
      background: rgba(255, 193, 7, 0.15);
      border: 1px solid rgba(255, 193, 7, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 4px 0;
    }
    /* 子 Agent tab 空状态：居中占位文案 */
    .tab-empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      font-size: 13px;
      padding: 40px;
      text-align: center;
    }
    /* @user 等待时输入栏：黄色 2px 边框脉冲 */
    .input-area.waiting {
      border: 2px solid rgba(255, 193, 7, 0.6);
      animation: input-pulse 1s infinite;
    }
    @keyframes input-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4); }
      50%      { box-shadow: 0 0 8px 2px rgba(255, 193, 7, 0.4); }
    }
    /* ===== 子 Agent Tab 样式结束 ===== */

    /* ===== 迷你模式（2026-09-15，plan: docs/superpowers/plans/2026-09-15-chat-mini-mode.md） ===== */
    /* 玻璃幕墙（甲路线 I8）：纯 CSS rgba 半透明，禁 backdrop-filter（它模糊不到系统桌面）。
       构件尺寸/透明度用 CSS 变量定义 = 单一真源，供 JS 测量与 hover 切换共用。
       --mini-pill-h / --mini-panel-min-h 锚定 main.js 的 MINI_PILL_HEIGHT=46 / MINI_PANEL_MIN_HEIGHT=90
       （缺省高度两常数），改这两个构件尺寸时必须同步 main.js。 */
    #mini-bar {
      --mini-pill-h: 46px;
      --mini-panel-min-h: 90px;
      /* 透明留白带（2026-09-15）：玻璃构件阴影被透明窗口 bounds 裁切 → 窗口四周加留白、内容居中/底部贴齐。
         单一真源 = 本变量，锚定 main.js MINI_MARGIN=40；改它须同步双端（与 56/90 同款）。阴影最大外延 8+28=36px + 余量 */
      --mini-margin: 40px;
      --mini-idle-opacity: 0.4;   /* 缺省兜底；enter 时 JS 用 window-config.json chatMini 值覆盖 */
      --mini-hover-opacity: 0.6;
      --mini-glass-alpha: var(--mini-idle-opacity);
      /* 文字跟随透明（2026-09-15 用户口径）：idle 时整个构件含文字/描边/控件淡到该值，hover 恒 1.0 */
      --mini-idle-content-opacity: 0.35;
      --mini-content-opacity: var(--mini-idle-content-opacity);
      display: none;
      position: fixed;
      inset: 0;
      padding: var(--mini-margin);   /* 透明留白带：阴影不被窗口边界裁切 */
      overflow: hidden;
      flex-direction: column;
      justify-content: flex-end;     /* 底部贴齐：构件底边 = 窗口底 − M（圆柱底边锚定） */
      /* 水平：默认 stretch——圆柱/面板填满内容盒（窗口宽−2M=构件宽，main.js 窗口宽=mini.width+2M 保证；
         不用 align-items:center——那会让无显式宽的 flex 子项收缩到内容宽而非撑满） */
      z-index: 9999;
      user-select: none;   /* 原型 #mini 逐字 */
      /* D2：系统默认字体，不继承 Chat 页可变字体（用户拍板） */
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1a1a1a;
      /* I10 修订（2026-09-15）：摘除 -webkit-app-region: drag。官方文档 tutorial/custom-window-interactions.md（v33.4.11）：
         "draggable areas ignore all pointer events. For example, a button element that overlaps a draggable region will not
         emit mouse clicks or mouse enter/exit events" → inset:0 整窗 drag 区吞掉全部指针事件，渲染端收不到 enter/move，
         hover 点亮/点击穿透都无法驱动（"只有输入框才点亮"的根因：全窗无事件，仅 no-drag 构件有事件）。
         窗口移动 = 渲染端 JS 拖动：mousedown on #mini-panel ∪ #mini-pill（排除 input/button/#mini-resize-handle）
         → 屏幕增量经 chat-mini-move IPC 移窗（setBounds）；
         下方各 no-drag 标记保留，无副作用。 */
    }
    body.mini #mini-bar { display: flex; }
    /* 文字跟随透明（2026-09-15 用户口径）：idle 时整个构件含文字/描边/控件一起淡（--mini-content-opacity），
       hover 恒完全清晰；背景 alpha 仍只由 --mini-glass-alpha 管（idleOpacity/hoverOpacity 键不变） */
    #mini-bar.mini-hover { --mini-glass-alpha: var(--mini-hover-opacity); --mini-content-opacity: 1; }

    /* I3：body.mini 清页面层背景（html 背景由 JS 成对清除/还原；此处清 body + .container 整页背景） */
    body.mini { background: transparent !important; }
    body.mini .container { display: none; background: transparent !important; background-image: none !important; }

    /* 消息块 = 原型 #msgPanel 逐字移植（/tmp/mini-proto.html，2026-09-15 用户铁律）：
       padding/圆角/边框/阴影/内缩全部跟原型；仅 4 处适配：①id 用契约名 ②透明度走 CSS 变量
       ③不搬 backdrop-filter（甲路线无模糊）④下两角=0（用户口径：帘子从底部长出、接触面平，上角跟原型 18px）。
       原型 --panelH（内联高）→ 契约：窗高由主进程管，构件 flex + min-height。 */
    #mini-panel {
      position: relative;
      flex: 1 1 auto;
      min-height: var(--mini-panel-min-h);
      margin: 0 calc(var(--mini-pill-h) / 2);   /* 几何（2026-09-15 用户口径）：内缩=胶囊半径 R=pill高/2，
         面板侧边垂线恰好落在胶囊圆弧起点（直线段边缘），不落在圆弧上；跟随 --mini-pill-h 不写死 */
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, calc(var(--mini-glass-alpha) * var(--mini-content-opacity)));
      border: 1px solid rgba(255, 255, 255, calc(var(--mini-glass-alpha) * 0.9 * var(--mini-content-opacity)));
      border-radius: 18px 18px 0 0;   /* 例外④：底边锚定接触面平 */
      border-bottom: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, calc(var(--mini-glass-alpha) * 0.18 * var(--mini-content-opacity)));
      padding: 12px 14px 10px;
      font-size: 13px; line-height: 1.65; color: #222;
      overflow-y: auto;   /* 高度上限（主进程半屏封顶）超出部分内部滚动 */
      cursor: move;   /* 全域拖动面（2026-09-16）：幕墙空白区可拖窗口；input/按钮/调高把手保持原光标 */
      /* 幕墙收起态（2026-09-16，plan 2026-09-16-chat-mini-curtain §2.2）：底边锚定（胶囊上沿）、顶边向上生长（clip-path inset 揭示），
         无位移无变形；透明 + 不可见 + 不收指针事件；展开态见下方 .mini-curtain-open 覆盖。
         opacity 专供幕墙动画；内容透明度已下移到 background/border/box-shadow 的 alpha
         与 #mini-message / #mini-resize-handle 的子级 opacity（同乘 --mini-content-opacity）。
         visibility 延迟 .2s = 淡出完成后再隐藏；展开态覆盖 transition-delay:0s（visibility 立即生效）。 */
      clip-path: inset(100% 0 0 0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: background .25s, box-shadow .25s, border-color .25s,
                  clip-path .2s cubic-bezier(.22, .61, .36, 1), opacity .18s ease-out, visibility 0s linear .2s;
    }
    /* 幕墙展开态（2026-09-16 T2）：class 仅由 miniCurtainApply() 切换（单一求值入口），
       且是目标命中盒的唯一真源（open = 胶囊 ∪ 幕墙 / 收起 = 仅胶囊） */
    #mini-bar.mini-curtain-open #mini-panel {
      clip-path: inset(0 0 0 0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }
    /* 上沿拖拽条 = 原型 #dragHandle 逐字（顶部中央小横条，absolute 不占布局）；I7 调高走迷你专用新 IPC；I10 no-drag */
    #mini-resize-handle {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
      width: 56px; height: 5px; border-radius: 3px;
      background: rgba(0, 0, 0, .18); cursor: ns-resize;
      -webkit-app-region: no-drag;
      z-index: 2;   /* 高于幕墙内容：顶部中央重叠区拖拽调高优先于拖动窗口 */
      opacity: var(--mini-content-opacity);   /* 内容透明度下移（2026-09-16）：面板 opacity 专供幕墙动画 */
      transition: opacity .25s;
    }
    #mini-resize-handle:hover { background: rgba(0, 0, 0, .35); }
    /* 输入条 = 原型 #pill 逐字：真胶囊（圆角=高度一半）。
       适配：①高度用契约常数 56px（main.js 锚定，原型 52）→ radius=28px 保持"真胶囊"
       ②margin-top:0——原型的 -6px 叠合按用户口径去掉（面板与圆柱不重合，2026-09-15） */
    #mini-pill {
      flex: none;
      height: var(--mini-pill-h);
      margin-top: 0;
      display: flex;
      align-items: center;
      padding: 0 8px 0 18px;
      gap: 8px;
      background: rgba(255, 255, 255, var(--mini-glass-alpha));
      border: 1px solid rgba(255, 255, 255, calc(var(--mini-glass-alpha) * 0.9));
      border-radius: calc(var(--mini-pill-h) / 2);   /* 胶囊圆角 = 高度一半（走变量，消除衍生常量漂移） */
      box-shadow: 0 8px 28px rgba(0, 0, 0, calc(var(--mini-glass-alpha) * 0.22));
      cursor: move;   /* 全域拖动面（2026-09-16）：胶囊空白区可拖窗口；输入框/按钮保持原光标 */
      transition: background .25s, box-shadow .25s, opacity .25s;
      opacity: var(--mini-content-opacity);   /* 文字跟随透明 */
    }

    #mini-message {   /* padding/font-size/line-height/color 跟原型挂 #mini-panel；纯色无描边（2026-09-15 用户口径：取消全部 text-shadow）。
       不设 flex-grow（原型 #msgText 就是普通块级子元素）：flex:1 会把消息盒撑到面板高，scrollHeight 随之报"窗口尺寸"而非内容高，
       measureMiniHeight 陷入固定点、窗高永远收敛不到内容高（2026-09-15 真窗口 harness 实证）。 */
      word-wrap: break-word;
      white-space: normal;
      opacity: var(--mini-content-opacity);   /* 内容透明度下移（2026-09-16）：面板 opacity 专供幕墙动画，内容淡出在子级 */
      transition: opacity .25s;
    }
    /* 三态：处理中状态文本 / 空闲占位（斜体灰） */
    #mini-message.mini-state { color: #444; font-style: italic; }
    #mini-message p { margin: 0 0 6px; }
    #mini-message pre,
    #mini-message code { background: rgba(0, 0, 0, 0.08); border-radius: 3px; font-size: 12px; }
    #mini-message pre { padding: 6px 8px; overflow-x: auto; }
    #mini-message a { color: #1a5276; }

    /* 输入框 = 原型 #pill input 逐字：透明（无内嵌白盒） */
    #mini-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #111;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    #mini-input::placeholder { color: rgba(0, 0, 0, .4); }
    /* 圆形图标按钮 = 原型 .icon-btn 逐字（↑ 发送 / ⤢ 还原大窗 / ✕ 关闭，无"发送"文字按钮） */
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(0, 0, 0, .07); color: #333; font-size: 15px;
      display: flex; align-items: center; justify-content: center; flex: none;
      -webkit-app-region: no-drag;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, .16); }

    /* 标题栏右侧按钮组：迷你+关闭包一层，加迷你按钮后关闭不被挤到左缘 */
    .header-actions { display: flex; align-items: center; gap: 8px; }
    /* 标题栏迷你按钮（正常模式入口）：CSS 画白底黑框小方块——系统字体下 ▫ 字符太小/可能缺字形，画出来最可靠 */
    .mini-btn {
      background: #ffe3a3;
      border: none;
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-btn::before {
      content: '';
      width: 9px;
      height: 9px;
      border: 2px solid #000;
      border-radius: 2px;
    }
    .mini-btn:hover {
      transform: scale(1.1);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }

    <!-- 字体配置动态注入：无配置时不注入（用浏览器系统默认字体），有配置时注入 @font-face + 覆盖 font-family -->

<body>
  <div class="container">
    <div class="header" id="header">
      <div class="header-title">
        <img src="icons/icon-32.png" class="avatar" />
        <span>妞妞</span>

    <div class="tab-bar" id="tabBar">

    <div class="brain-spark-container" id="brainSparkContainer">
      <div class="spark-light-zone" id="sparkLightZone"></div>
      <div class="spark-extinguish-zone" id="sparkExtinguishZone"></div>
    </div>
    
    <!-- 简洁进度条 -->
    <div class="progress-bar" id="progress-bar">
      <span id="progress-text">处理中...</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-text" id="progress-percent">0%</span>
    </div>
    
    <div class="input-area">
      <textarea id="user-input" placeholder="说点什么..." rows="1"></textarea>
      <button id="send-btn">发送</button>
      <button class="stop-btn" id="stop-btn" style="display:none;" title="停止生成 (/stop)">■</button>
      <div class="slash-dropdown" id="slash-dropdown">
        <div class="slash-dropdown-item" data-cmd="/new">
          <span class="cmd-name">/new</span>
          <span class="cmd-desc">新会话</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/stop">
          <span class="cmd-name">/stop</span>
          <span class="cmd-desc">停止任务（也可按 ESC）</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/compact">
          <span class="cmd-name">/compact</span>
          <span class="cmd-desc">快速压缩：立即释放上下文空间</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/sleep">
          <span class="cmd-name">/sleep</span>
          <span class="cmd-desc">让精灵进入睡眠，自动整理对话</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/setup">
          <span class="cmd-name">/setup</span>
          <span class="cmd-desc">打开设置页面</span>
        </div>
      </div>
    </div>
    
    <div class="status-bar" id="status-bar">
      <div class="stats">
        <span class="stat context-usage" id="context-usage" title="上下文使用率">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="none" stroke="#333" stroke-width="2.5"/>
            <circle cx="10" cy="10" r="8" fill="none" stroke="#4CAF50" stroke-width="2.5"
              stroke-dasharray="50.27" stroke-dashoffset="50.27" stroke-linecap="round"
              transform="rotate(-90 10 10)" id="context-usage-arc">
              <animateTransform attributeName="transform" type="rotate"
                    from="-90 10 10" to="270 10 10"
                    dur="2s" repeatCount="indefinite"
                    begin="indefinite"/>
            </circle>
          </svg>
          <span id="context-usage-text">0%</span>
          <span id="context-cache-hit" style="font-size:11px;opacity:0.75;margin-left:2px;"></span>
        </span>
        <span class="stat">📁 <span id="file-count">0</span></span>
        <span class="stat">👤 <span id="person-count">0</span></span>
        <span class="stat">📝 <span id="note-count">0</span></span>
      </div>
      <div class="status-actions">
        <span class="version-label"></span>
        <button class="graph-btn" id="graph-btn">图谱 →</button>
      </div>
    </div>
    <div class="resize-handle" id="resize-handle"></div>
  </div>

  <!-- 迷你模式玻璃幕墙（2026-09-15，plan: docs/superpowers/plans/2026-09-15-chat-mini-mode.md）：
       仅 body.mini 下显示；底边锚定、窗高由主进程管；消息块稍窄于输入条（像从输入条向上抽出）。
       幕墙（#mini-panel）默认收起在胶囊后方，点亮/窗口聚焦/新消息 3s 自动弹出时从胶囊后面抽出
       （2026-09-16，plan: docs/superpowers/plans/2026-09-16-chat-mini-curtain.md） -->
  <div id="mini-bar">
    <div id="mini-panel">
      <div id="mini-resize-handle" title="拖拽调高度 / 双击恢复自动"></div>
      <div id="mini-message" class="mini-state">暂无新消息</div>
    </div>
    <div id="mini-pill">
      <input id="mini-input" type="text" placeholder="说点什么..." />
      <button class="icon-btn" id="mini-send-btn" title="发送">↑</button>
      <button class="icon-btn" id="mini-restore-btn" title="还原大窗">⤢</button>
      <button class="icon-btn" id="mini-close-btn" title="关闭">✕</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    window._compacting = false;  // 压缩中标志，由 compact_status 事件切换
    const closeBtn = document.getElementById('close-btn');
    const header = document.getElementById('header');
    const statusBar = document.getElementById('status-bar');
    const resizeHandle = document.getElementById('resize-handle');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const fileCount = document.getElementById('file-count');
    const personCount = document.getElementById('person-count');
    const noteCount = document.getElementById('note-count');
    const graphBtn = document.getElementById('graph-btn');

    // 版本号填充：单一真相源=仓库根 VERSION 文件（preload-chat.js 读入暴露为 APP_VERSION；读失败兜底 dev）
    // 锚点钉死在 body 尾部主脚本——head 内字体 IIFE 执行时 body 未解析，querySelector 会 null
    document.querySelector('.version-label').textContent = 'v' + (window.electronAPI.APP_VERSION || 'dev');

    // ========== 斜杠命令下拉框 ==========
    const slashDropdown = document.getElementById('slash-dropdown');
    const slashItems = slashDropdown.querySelectorAll('.slash-dropdown-item');
    let slashSelectedIndex = -1;  // 当前高亮项（-1 = 无）
    let slashJustSelected = false;  // 哨兵：刚选中填入，防止 input 事件重新弹出

    function showSlashDropdown() {
      const value = userInput.value;
      // 仅行首 / 时显示
      if (!value.startsWith('/')) {
        hideSlashDropdown();
        return;
      }
      // 刚选中填入的命令，不重新弹出
      if (slashJustSelected) {
        slashJustSelected = false;
        hideSlashDropdown();
        return;
      }
      // 过滤匹配项
      const query = value.split(/\s/)[0]; // 取第一个词（如 /c）
      let matchCount = 0;
      let firstMatchIndex = -1;
      slashItems.forEach((item, i) => {
        const cmd = item.dataset.cmd;
        if (cmd.startsWith(query)) {
          item.style.display = 'flex';
          matchCount++;
          if (firstMatchIndex === -1) firstMatchIndex = i;
        } else {
          item.style.display = 'none';
        }
      });
      if (matchCount === 0) {
        hideSlashDropdown();
        return;
      }
      // 重置高亮到第一个匹配项
      slashSelectedIndex = firstMatchIndex;
      updateSlashSelection();
      slashDropdown.classList.add('visible');
    }

    function hideSlashDropdown() {
      slashDropdown.classList.remove('visible');
      slashSelectedIndex = -1;
    }

    function updateSlashSelection() {
      slashItems.forEach((item, i) => {
        if (i === slashSelectedIndex) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
      // 滚动选中项到可见区域
      const selected = slashItems[slashSelectedIndex];
      if (selected && selected.style.display !== 'none') {
        selected.scrollIntoView({ block: 'nearest' });
      }
    }
    // 鼠标点击选择命令
    slashItems.forEach(item => {
      item.addEventListener('click', () => {
        const cmd = item.dataset.cmd;
        userInput.value = cmd;
        userInput.setSelectionRange(cmd.length, cmd.length);
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        slashJustSelected = true;
        hideSlashDropdown();
        userInput.focus();
      });

      // 鼠标悬停时更新高亮
      item.addEventListener('mouseenter', () => {
        const visibleItems = Array.from(slashItems).filter(
          it => it.style.display !== 'none'
        );
        const idx = visibleItems.indexOf(item);
        if (idx >= 0) {
          slashSelectedIndex = Array.from(slashItems).indexOf(item);
          updateSlashSelection();
        }
      });
    });

    // 点击外部关闭下拉框
    document.addEventListener('click', (e) => {
      if (slashDropdown.classList.contains('visible') &&
          !slashDropdown.contains(e.target) &&
          e.target !== userInput) {
        hideSlashDropdown();
      }
    });
    let isProcessing = false;

    // ========== 拖拽窗口 ==========
    // 拦截消息区域中的链接点击，用系统默认浏览器打开
    messages.addEventListener('click', (e) => {
      const link = e.target.closest('a[href]');
      if (link) {
        const href = link.getAttribute('href');
        if (!href) return;
        const lowerHref = href.toLowerCase();
        if (lowerHref.startsWith('#')) return; // 锚点链接，浏览器自行处理
        // 仅允许 http/https 协议，阻止 javascript:/data:/vbscript: 等危险协议
        if (!lowerHref.startsWith('http://') && !lowerHref.startsWith('https://')) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        window.electronAPI.openExternal(href);
      }
    });

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    
    header.addEventListener('mousedown', (e) => {
      if (e.target === closeBtn) return;
      isDragging = true;
      dragOffset.x = e.screenX - window.screenX;
      dragOffset.y = e.screenY - window.screenY;
      e.preventDefault();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        window.electronAPI.setPosition(e.screenX - dragOffset.x, e.screenY - dragOffset.y);
      }
    });
    
    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // ========== 调整窗口大小 ==========
    let isResizing = false;
    let resizeStart = { x: 0, y: 0, width: 0, height: 0 };
    
    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStart.x = e.screenX;
      resizeStart.y = e.screenY;
      resizeStart.width = window.outerWidth;
      resizeStart.height = window.outerHeight;
      e.preventDefault();
      e.stopPropagation();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dx = e.screenX - resizeStart.x;
      const dy = e.screenY - resizeStart.y;
      const newWidth = Math.max(300, resizeStart.width + dx);
      const newHeight = Math.max(400, resizeStart.height + dy);
      window.electronAPI.resizeWindow(newWidth, newHeight);
    });
    
    document.addEventListener('mouseup', () => {
      isResizing = false;
    });
    
    // ========== 关闭窗口 ==========
    closeBtn.addEventListener('click', () => {
      window.electronAPI.close();
    });
    
    // ========== 图谱按钮 ==========
    graphBtn.addEventListener('click', () => {
      window.electronAPI.openGraph();
    });
    
    // ========== 发送消息 ==========
    sendBtn.addEventListener('click', sendMessage);

    // === 双击停止按钮逻辑 ===
    // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
    // 单击：只停主 Agent + 检查子 Agent 状态（Task 13 补 checkRunningSubagents）
    let stopClickTimer = null;
    let stopClickFired = false;  // 哨兵：双击已触发，400ms 内后续点击忽略
    const STOP_DOUBLE_CLICK_WINDOW = 400; // ms

    stopBtn.addEventListener('click', () => {
      if (stopClickFired) {
        // 双击刚触发，400ms 内的后续点击忽略
        return;
      }
      if (stopClickTimer) {
        // 第二次点击（双击）
        clearTimeout(stopClickTimer);
        stopClickTimer = null;
        stopClickFired = true;
        setTimeout(() => { stopClickFired = false; }, STOP_DOUBLE_CLICK_WINDOW);
        // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
        fetch('/api/stop_all', { method: 'POST' }).catch(e => console.error('stop_all 请求失败', e));
        window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
      } else {
        // 第一次点击（单击）
        stopClickTimer = setTimeout(() => {
          stopClickTimer = null;
          // 子 Agent tab：单击停当前子 Agent（§12；双击仍走上面的批量停止语义，不受影响）
          if (_activeTab !== 'main') {
            if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
              window.electronAPI.sendSubagentMessage(_activeTab, '/stop');
            }
            return;
          }
          // 单击超时：只停主 Agent
          window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
          // 提示用户还有子 Agent 在跑（如果有）—— Task 13 实现
          checkRunningSubagents();
        }, STOP_DOUBLE_CLICK_WINDOW);
      }
    });

    async function checkRunningSubagents() {
      try {
        const resp = await fetch('/api/subagents/running');
        const data = await resp.json();
        if (data.count > 0) {
          const names = data.subagents.map(s => s.unique_name).join(', ');
          alert(`已停主 Agent。${data.count} 个子 Agent 仍在运行：${names}\n双击停止按钮可全部终止。`);
        }
      } catch (e) {
        console.error('查询子 Agent 状态失败', e);
      }
    }

    // 自动调整 textarea 高度
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      showSlashDropdown();
    });

    userInput.addEventListener('keydown', (e) => {
      // 通知 spirit 用户正在活动（重置空闲计时器）
      window.electronAPI.notifyActivity();

      // 下拉框可见时优先处理导航
      if (slashDropdown.classList.contains('visible')) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          // 找下一个可见项
          for (let i = slashSelectedIndex + 1; i < slashItems.length; i++) {
            if (slashItems[i].style.display !== 'none') {
              slashSelectedIndex = i;
              updateSlashSelection();
              break;
            }
          }
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          // 找上一个可见项
          for (let i = slashSelectedIndex - 1; i >= 0; i--) {
            if (slashItems[i].style.display !== 'none') {
              slashSelectedIndex = i;
              updateSlashSelection();
              break;
            }
          }
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey && slashSelectedIndex >= 0) {
          e.preventDefault();
          // 选中项：填入输入框，关闭下拉框
          const cmd = slashItems[slashSelectedIndex].dataset.cmd;
          userInput.value = cmd;
          userInput.setSelectionRange(cmd.length, cmd.length);
          // 触发 input 事件调整高度
          userInput.style.height = 'auto';
          userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
          slashJustSelected = true;
          hideSlashDropdown();
          userInput.focus();
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();  // 阻止冒泡到 document 的 ESC 监听器，避免同时触发 /stop
          hideSlashDropdown();
          return;
        }
        if (e.key === 'Tab' && slashSelectedIndex >= 0) {
          e.preventDefault();
          // Tab 也能选中
          const cmd = slashItems[slashSelectedIndex].dataset.cmd;
          userInput.value = cmd;
          userInput.setSelectionRange(cmd.length, cmd.length);
          userInput.style.height = 'auto';
          userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
          slashJustSelected = true;
          hideSlashDropdown();
          userInput.focus();
          return;
        }
      }

      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      // Shift+Enter 允许换行（默认行为）
    });
    
    // 显示状态气泡（替代 typing 动画，可被工具状态更新）
    // text 可选：默认"正在思考..."，同步子 Agent 时传"子 Agent 工作中..."（§11）
    function showTyping(text) {
      let bubble = document.getElementById('status-bubble');
      if (!bubble) {
        bubble = document.createElement('div');
        bubble.id = 'status-bubble';
        bubble.className = 'message assistant status-bubble';
        messages.appendChild(bubble);
      }
      bubble.textContent = text || '正在思考...';
      messages.scrollTop = messages.scrollHeight;
      scheduleMiniUpdate();  // 迷你三态：typing 气泡出现 → 处理中状态文本
    }

    function hideTyping() {
      const bubble = document.getElementById('status-bubble');
      if (bubble) bubble.remove();
      scheduleMiniUpdate();  // 迷你三态：typing 气泡消失 → 回显最后一条 Agent 消息
    }

    // 便捷函数：添加系统消息
    function addSystemMessage(text) {
      addMessage('system', text);
    }

    // 更新状态气泡内容（工具调用状态推送时调用）
    function updateStatusBubble(data) {
      let bubble = document.getElementById('status-bubble');
      if (!bubble) {
        bubble = document.createElement('div');
        bubble.id = 'status-bubble';
        bubble.className = 'message assistant status-bubble';
        messages.appendChild(bubble);
      }
      if (data.status === 'start') {
        bubble.textContent = '🔧 正在调用 ' + data.tool_name + '...';
      } else if (data.status === 'end') {
        bubble.textContent = '✅ ' + data.tool_name + ' 完成，正在思考...';
      }
      messages.scrollTop = messages.scrollHeight;
      scheduleMiniUpdate();  // 迷你三态：工具状态文本同步镜像
    }
    
    // 重试发送消息（自动重连）
    async function sendMessageWithRetry(text, source, maxRetries = 10, delay = 2000) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const result = await window.electronAPI.sendMessage(text, source);
          
          // 检查返回的错误是否是连接错误
          if (result && result.error) {
            const isConnectionError = result.error.includes('ECONNREFUSED') ||
              result.error.includes('connect') ||
              result.error.includes('ENOTFOUND');
              // 注意：不重试 ECONNRESET（服务器已收到请求，重试会导致重复消息）
            
            if (isConnectionError && i < maxRetries - 1) {
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
          }
          
          return result;
        } catch (err) {
          const errMsg = err.message || String(err);
          const isConnectionError = errMsg.includes('ECONNREFUSED') ||
            errMsg.includes('connect') ||
            errMsg.includes('ENOTFOUND');
          
          if (isConnectionError && i < maxRetries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
          } else {
            throw err;
          }
        }
      }
      return null;
    }

    // 把文本插入到输入框末尾，自动补换行让路径独占一行：
    // - 已有内容为空或末尾是换行/空格 → 直接追加路径
    // - 已有内容末尾不是换行/空格 → 补换行再追加路径
    // - 路径末尾自动补换行，光标停在新行行首，用户补充文字在新行输入
    // 这样主 Agent 能识别"行首是绝对路径"，避免路径含空格时与用户补充文字混淆
    // 最后聚焦+触发 input 事件让 textarea 自适应高度
    function insertTextToInput(text) {
      const current = userInput.value;
      if (current && !current.endsWith('\n') && !current.endsWith(' ')) {
        userInput.value = current + '\n' + text + '\n';
      } else {
        userInput.value = current + text + '\n';
      }
      userInput.focus();
      // 光标定位到末尾（新行行首）
      userInput.setSelectionRange(userInput.value.length, userInput.value.length);
      userInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    async function sendMessage() {
      slashJustSelected = false;  // 重置哨兵：选中后回车执行，防止下次输入 / 时不弹出
      const text = userInput.value.trim();
      if (!text) { userInput.style.height = 'auto'; return; }
      sendBtn.disabled = true;

      // ===== 子 Agent tab 分支（§5.6）：必须在 addMessage('user') / showTyping() 之前 early return =====
      if (_activeTab !== 'main') {
        userInput.value = '';
        userInput.style.height = 'auto';
        // /clear、/new、/compact、/sleep、/setup 只对主对话有效（§5.5）
        if (text === '/clear' || text === '/new' || text === '/compact' || text === '/sleep' || text === '/setup') {
          addSubagentMessageToTab(_activeTab, 'system', '请切回主对话使用此命令');
          sendBtn.disabled = false;
          return;
        }
        // /stop：终止当前子 Agent（不渲染为用户消息，与主对话 /stop 行为一致）
        if (text === '/stop') {
          if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
            window.electronAPI.sendSubagentMessage(_activeTab, '/stop');
          }
          sendBtn.disabled = false;
          return;
        }
        // 普通消息：作为补充信息（supplement）发给子 Agent（§5.3）
        const container = document.getElementById('messages-' + _activeTab);
        if (container) {
          addSubagentMessageToTab(_activeTab, 'user', text);
          // 发送到子 Agent API（后端就位后生效）
          if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
            window.electronAPI.sendSubagentMessage(_activeTab, text);
          }
          // 发送后等待态（§22）：placeholder 变更 + 发送按钮 disabled，下一条事件到达时恢复
          _setSubagentInputWaiting(true);
        } else {
          sendBtn.disabled = false;
        }
        return;  // early return：不走主对话逻辑
      }

      // I9（plan 2026-09-15-chat-mini-mode）：取值/清空/focus 留在调用点——主输入框在此清空，
      // 再整体复用主对话路径；迷你模式传自有文本、自管清空与 focus
      userInput.value = '';
      userInput.style.height = 'auto';
      await sendMainMessage(text, () => userInput.focus());  // focus 走普通路径 finally（含抛错路径）——与原版等价；命令路径不 focus
    }

    // I9：抽出单元 = 子 tab 早退之后的主对话路径整体（命令路由 + 普通消息尾段）。
    // 以 text 为参；迷你模式传自有文本直接调用本函数即强制 main 路由（跳过子 tab 早退段）。
    // 第二参 focusFn：在普通路径 finally 内执行的 focus 回调（含 sendMessageWithRetry 抛错路径——
    // 与原版 9b03dcf3 的 finally 恒 focus 语义等价）；命令分支不触发。
    // 取值/清空/focus 等 DOM 副作用一律留在各调用点——防迷你发送抹掉大窗未发草稿、
    // 防 focus 拉回已隐藏的主输入框。
    async function sendMainMessage(text, focusFn = null) {
      // /stop 指令 - 停止当前 Agent 工作（允许在 isProcessing=true 时执行）
      if (text === '/stop') {
        sendBtn.disabled = false;
        try {
          await window.electronAPI.sendMessage('/stop');
        } catch (e) {
          console.error('停止失败:', e);
          addSystemMessage('停止失败: ' + (e.message || e));
        }
        return false;
      }

      // /clear 指令 - 已随压缩体系退役（T6）：等价 /new，直接清空不再先整理
      // /new 指令 - 清空聊天记录
      if (text === '/clear' || text === '/new') {
        stopBtn.style.display = 'none';
        sendBtn.disabled = false;
        await clearChat();
        return false;
      }

      // /setup 指令 - 打开设置页面
      if (text === '/setup') {
        if (window.electronAPI && window.electronAPI.openSettings) {
          window.electronAPI.openSettings();
        }
        sendBtn.disabled = false;
        return false;
      }

      // /sleep 指令 - 让精灵进入睡眠（触发睡眠整理流程）
      if (text === '/sleep') {
        sendBtn.disabled = false;
        // isProcessing 检查（P2-1 主防线）：Agent 忙碌时精灵处于 BUSY 状态，
        // 此时进入睡眠会导致 Agent 完成后 chat_idle 把精灵从 SLEEP 强制唤醒回 IDLE
        // 的状态冲突（整理还在后端跑但精灵已显示 IDLE）。忙碌时提示用户，不发 IPC。
        // spirit.html 侧的 BUSY 守卫是兜底（防御直接 IPC 调用）。
        if (isProcessing) {
          addSystemMessage('⚠️ 精灵忙碌中，请先 /stop 停止当前任务再让它睡觉');
          return false;
        }
        addSystemMessage('💤 精灵已进入睡眠，开始整理…');
        window.electronAPI.enterSleep();
        return false;
      }

      // /compact 指令 - 统一压缩入口：压缩 = 一条消息，后端拦截（spec 2026-09-06）
      // 不 /stop、不走独立 HTTP——复用正常消息通道 sendMessage('/compact')，
      // 后端 chat_session 落库前拦截置意图；忙时任务间隙执行、闲时立即执行。
      if (text === '/compact') {
        addSystemMessage('压缩指令已发送…');
        try {
          await window.electronAPI.sendMessage('/compact');
        } catch (e) {
          console.error('发送压缩指令失败:', e);
          addSystemMessage('压缩指令发送失败: ' + (e.message || e));
        }
        return false;
      }

      // 铁律1：用户触发的 → 先刷新页面（即时反馈）
      const userMsg = addMessage('user', text);
      if (!userMsg) { return false; }  // addMessage 返回 null（如 tool 消息被过滤），跳过后续

      _miniBusySince = Date.now();  // 迷你三态：本轮处理开始标记（新 assistant 消息到达前状态文本优先于旧消息）
      showTyping();
      window.electronAPI.notifyBusy(true, 'chat');

      try {
        // 提交用户手动修改的脑区状态（在发送消息前）
        await submitBrainChanges();
        const result = await sendMessageWithRetry(text);
      } finally {
        // chat 窗口 UI 状态（hideTyping/stopBtn/isProcessing）由 SSE chat_idle 驱动
        // 见缝插针场景下 HTTP 立即返回但 Agent 仍在跑，此处不能重置 chat UI 状态
        // 否则会把停止按钮误隐藏、Escape 失效、/clear 误走空闲分支
        //
        // 但 notifyBusy(false, 'chat') 必须在此处调用——它配对的是
        // chat.html:922 sendMessage 入口的 notifyBusy(true, 'chat')，属于
        // spirit 窗口 busyCount 引用计数层（非 chat UI 状态层）。
        // 见缝插针 N 次回车 = N 次 sendMessage +1，必须 N 次 finally -1 配对，
        // 否则 spirit busyCount 永远 +N 不归零，小女孩卡 busy.gif。
        // spirit 是引用计数模型（spirit.html:190 busyCount），-1 受 >0 守卫保护，
        // 重复调用不会减到负数，安全。
        window.electronAPI.notifyBusy(false, 'chat');
        sendBtn.disabled = false;
        loadStats();
        if (focusFn) focusFn();  // 原版 finally 恒 focus（含抛错路径），顺序同原版置尾
      }
      return true;  // 走了普通消息路径（命令分支均 return false）
    }
    
    // 清空聊天记录
    async function clearChat() {
      try {
        const result = await window.electronAPI.clearChat();
        if (result.success) {
          messages.innerHTML = '';
          clearSparks();
          _prevBrainState.clear();
          _brainStateInitialized = false;
          oldestMessageId = null;
          addMessage('system', '✅ 聊天记录已清空');
          // I9：/clear 同步清空迷你消息区（重填由后续 DB 刷新/历史重建的 addMessage 钩子完成）
          miniLastAssistant = null;
          _miniBusySince = null;
          scheduleMiniUpdate();
        } else {
          addMessage('system', '❌ 清空失败: ' + (result.error || '未知错误'));
        }

        addMessage('system', '❌ 清空失败: ' + err.message);
      }

    }

    // ========== 迷你模式（2026-09-15，plan: docs/superpowers/plans/2026-09-15-chat-mini-mode.md） ==========
    // 同一窗口变形：enter = 窗口级 API + body.mini；exit = 还原。零重建、不重载页面（I1）。

    //   有 Agent 消息 → 显示之；处理中 → 镜像主窗状态气泡一行文本；空闲无消息 → 占位。
    let miniActive = false;          // 渲染端模式标志（与 body.mini class 成对）
    let miniManualLocked = false;    // I7：拖过上沿后本次迷你会话自动长高停止；双击恢复 / 再 enter 复位
    let miniLastAssistant = null;    // { text, ts } 主对话最后一条 role=assistant（按源 role 捕获，非 DOM class）
    let _miniBusySince = null;       // 当前处理轮开始时间戳（新 assistant 消息到达前状态文本优先于旧消息）
    let _inSubagentRender = false;   // addSubagentMessage 渲染中（其回退路径调 addMessage('assistant')，不得被迷你捕获）
    const miniBar = document.getElementById('mini-bar');
    const miniPanel = document.getElementById('mini-panel');
    const miniPill = document.getElementById('mini-pill');
    const miniMessageEl = document.getElementById('mini-message');
    const miniInput = document.getElementById('mini-input');
    const miniSendBtn = document.getElementById('mini-send-btn');
    const miniRestoreBtn = document.getElementById('mini-restore-btn');
    const miniCloseBtn = document.getElementById('mini-close-btn');
    const miniResizeHandle = document.getElementById('mini-resize-handle');

    // 文字跟随透明（2026-09-15 用户口径）：点亮时背景 alpha 与内容透明度（--mini-content-opacity）一起切到完全清晰。
    // 修订（2026-09-16，plan 2026-09-16-chat-mini-curtain §2.3）：点亮判定 = **可见构件目标盒命中**
    // （#mini-pill ∪ #mini-panel，40px 透明留白带不计；旧"整窗 hover"判定早已废弃——drag 区无指针事件，
    // 官方 docs：draggable areas ignore all pointer events）+ 构件焦点锁 + 窗口焦点 + 幕墙机构；
    // 幕墙（面板）默认收起，命中盒按目标态（mini-curtain-open class）取值：收起 = 仅胶囊，展开 = 胶囊 ∪ 幕墙。

    // 故穿透态下鼠标一移动即按命中自动翻转回可交互。
    let pointerInBox = false;         // 最近一次指针命中判定（true = 指针在目标命中盒内）；首条 mousemove 前 = 盒外（保守）
    let miniPassThrough = false;      // 主进程当前是否处于 setIgnoreMouseEvents(true, {forward:true})
    let miniFocusLock = false;        // 构件内焦点（输入框/按钮）→ 强制保持亮态（用户口径：输入框聚焦期间不变暗）
    let windowFocused = false;        // 窗口焦点态（2026-09-16）：只认 window focus/blur 翻转；
                                      //   applyMiniDom() 复位为 false、不做 document.hasFocus() 初始化
                                      //   （enter 由点击 mini-btn 触发 ⇒ 窗口必已聚焦，初始化 true 会让幕墙进迷你即弹）
    let autoPeekUntil = 0;            // 新消息自动弹出截止时间戳（ms；now < 该值 = 自动弹出保持中）
    let peekTimer = null;             // 3s 自动收回定时器（新消息武装时重排）
    let miniPeekLastTs = 0;           // autoPeek 基线：ts > 该值的消息才算"新"（同一消息不重复武装）；
                                      //   applyMiniDom()/exitMini() 按播种规则置 miniLastAssistant ? ts : Date.now()
    let miniMouseMoveSeen = false;    // enter 后是否收到过 mousemove（600ms 兜底判定用）
    let miniHoverFallbackTimer = null;
    let lastPointerX = null, lastPointerY = null;  // 指针坐标唯一数据源（client 系 = 布局几何同原）；
                                                    //   mousemove 处理器首行（短路之前）更新；首条 mousemove 前 = 未初始化（按盒外处理）

    // 展开 = 胶囊 ∪ 幕墙（布局几何），收起 = 仅胶囊。逐元素 OR（胶囊盒 ∨ 幕墙盒），
    // 一律取布局几何（offsetLeft/offsetTop/offsetWidth/offsetHeight，offsetParent = #mini-bar fixed inset:0，
    // 与 client 系同原）；命中一律取布局几何（offset*，与 client 同原）；幕墙收折已改 clip-path（无 transform 位移），此约定仅作统一纪律保留。
    function miniPointerInside(x, y) {
      if (miniBar.classList.contains('mini-curtain-open')) {
        const pl = miniPanel.offsetLeft, pt = miniPanel.offsetTop;
        if (x >= pl && x <= pl + miniPanel.offsetWidth && y >= pt && y <= pt + miniPanel.offsetHeight) return true;
      }
      const ql = miniPill.offsetLeft, qt = miniPill.offsetTop;
      return x >= ql && x <= ql + miniPill.offsetWidth && y >= qt && y <= qt + miniPill.offsetHeight;
    }
    // 统一重判 pointerInBox：按最后指针坐标（lastPointerX/Y）+ 当前目标盒；首条 mousemove 前（未初始化）= 盒外（保守）
    function miniRejudgePointer() {
      pointerInBox = lastPointerX === null ? false : miniPointerInside(lastPointerX, lastPointerY);
    }
    // 单一求值入口（2026-09-16 幕墙）：open = 指针在目标盒内 OR 构件焦点 OR 窗口聚焦 OR 窗口移动拖动中
    // OR 上沿拖高中 OR 新消息自动弹出未到期；点亮（mini-hover）= open；只切 class、不排队、不补间。
    // 穿透 IPC 不经过本函数：miniApplyPassThrough 只在指针/焦点翻转点单独调用，
    // 且 applyMiniDom()/exitMini() 复位路径豁免（enter 帧绝不发 chat-mini-hover——白窗根因）。
    // 幕墙开合翻转后目标盒变化（收起=仅胶囊 / 展开=胶囊∪幕墙）：按新盒重判 pointerInBox 再求值一次——
    // 指针正在刚抽出的幕墙上 ⇒ 保持展开；两盒为子集关系，重判不会振荡。
    function miniCurtainApply() {
      const isOpen = () => pointerInBox || miniFocusLock || windowFocused
        || miniMoveDragging || miniDragging || Date.now() < autoPeekUntil;
      let shouldOpen = isOpen();
      const wasOpen = miniBar.classList.contains('mini-curtain-open');
      miniBar.classList.toggle('mini-curtain-open', shouldOpen);
      miniBar.classList.toggle('mini-hover', shouldOpen);
      if (shouldOpen !== wasOpen) {
        miniRejudgePointer();
        shouldOpen = isOpen();
        if (shouldOpen !== miniBar.classList.contains('mini-curtain-open')) {
          miniBar.classList.toggle('mini-curtain-open', shouldOpen);
          miniBar.classList.toggle('mini-hover', shouldOpen);
        }
      }
    }
    // 点击穿透：指针在盒内 = 可交互，盒外 = 穿透（forward 保鼠标事件回流）；仅在状态翻转时发 IPC（绝不进 enter 帧）
    function miniApplyPassThrough(inside) {
      const want = !inside;
      if (want === miniPassThrough) return;
      miniPassThrough = want;
      window.electronAPI.setMiniHover(inside);
    }
    document.addEventListener('mousemove', (e) => {
      lastPointerX = e.clientX; lastPointerY = e.clientY;  // 首行记录（短路之前）：拖动/拖高期间坐标不陈旧，供 mouseup/blur 重判
      if (!miniActive || miniMoveDragging || miniDragging) return;  // 拖拽期间不做 hover/穿透翻转（结束点 mouseup/blur 统一重判）
      miniMouseMoveSeen = true;
      const inside = miniPointerInside(lastPointerX, lastPointerY);  // 目标盒按当前幕墙态取值
      if (inside === pointerInBox) return;  // 无翻转不重复处理
      pointerInBox = inside;
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    });
    // 构件焦点锁（2026-09-16 R6 保留）：输入框（或任意图件）聚焦 → 强制保持亮态；失焦 → 按最后指针位置重判。
    // OS 级失焦不触发 focusout ⇒ miniFocusLock 的兜底清除归 window blur 状态机（见下），防残留 true 使 open 恒真。
    miniBar.addEventListener('focusin', () => {
      if (!miniActive) return;
      miniFocusLock = true;
      miniRejudgePointer();
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    });
    miniBar.addEventListener('focusout', () => {
      if (!miniActive) return;
      miniFocusLock = false;
      miniRejudgePointer();
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    });

    // I7/I10：上沿拖拽调高——走迷你专用新 IPC（setPosition/resizeWindow 主进程无 handler，是死通道，不得复用）
    let miniDragging = false;
    let miniDragStartY = 0;
    let miniDragStartH = 0;
    // 窗口最小总高 = 输入条 + 消息块最小高 + 2M 留白带（读 CSS 变量真值，防拖到输入条被裁出窗口）
    function miniMinHeight() {
      const panelMinH = parseFloat(getComputedStyle(miniBar).getPropertyValue('--mini-panel-min-h')) || 90;
      const overlap = Math.min(0, parseFloat(getComputedStyle(miniPill).marginTop) || 0);
      const m = parseFloat(getComputedStyle(miniBar).getPropertyValue('--mini-margin')) || 40;
      return (miniPill.offsetHeight || 56) + panelMinH + overlap + 2 * m;
    }
    miniResizeHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      miniDragging = true;
      miniDragStartY = e.screenY;
      miniDragStartH = window.innerHeight;
    });

      _miniReportedH = 0;  // 窗高已被手动改变，解锁重测时即使数值相同也要上报

      miniApplyPassThrough(pointerInBox);
    });

      scheduleMiniUpdate();
    });

    // → mousemove 以屏幕坐标增量发 chat-mini-move IPC → 主进程 setBounds(cur+delta)。
    // 主进程不加写盘抑制：用户真实拖动 → 既有 moved 处理器按迷你分支写 chatMini.x/y 落盘（D7 底边锚点语义）。
    // 拖拽期间 hover/穿透不翻转（上方 mousemove 处理器以 miniMoveDragging 短路）。
    let miniMoveDragging = false;
    let miniMoveLastX = 0;
    let miniMoveLastY = 0;

      if (!miniActive || e.button !== 0) return;
      if (e.target.closest('input, button, #mini-resize-handle')) return;  // 交互元素保持原行为（调高/输入/按钮）
      e.preventDefault();
      miniMoveDragging = true;
      miniMoveLastX = e.screenX;
      miniMoveLastY = e.screenY;
    };
    miniPanel.addEventListener('mousedown', startMiniMove);
    miniPill.addEventListener('mousedown', startMiniMove);
    document.addEventListener('mousemove', (e) => {
      if (!miniMoveDragging) return;
      const dx = e.screenX - miniMoveLastX;
      const dy = e.screenY - miniMoveLastY;
      miniMoveLastX = e.screenX;
      miniMoveLastY = e.screenY;

    // 首条 mousemove 之前（未初始化）= 盒外（保守）。
    function endMiniMove() {
      if (!miniMoveDragging) return;
      miniMoveDragging = false;
      miniRejudgePointer();
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    }
    document.addEventListener('mouseup', endMiniMove);
    // 窗口焦点翻转（2026-09-16 幕墙 §2.3）：focus → 弹出、点亮；blur → 写死次序复位后重判求值。
    // blur 先清状态位：OS 级失焦不触发 focusout，miniFocusLock 必须显式清除（否则残留 true 使 open 恒真，
    // "失去焦点 ⇒ 收回"失效）；两个拖动标志同理（点到别的窗口 = 拖拽必然结束）。
    window.addEventListener('focus', () => {
      if (!miniActive) return;
      windowFocused = true;
      miniRejudgePointer();
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    });
    window.addEventListener('blur', () => {
      if (!miniActive) return;
      windowFocused = false;
      miniFocusLock = false;
      miniMoveDragging = false;
      miniDragging = false;
      miniRejudgePointer();  // 按最后指针坐标 + 目标盒重判（首条 mousemove 前 = 盒外）
      miniCurtainApply();
      miniApplyPassThrough(pointerInBox);
    });

    // P1（2026-09-15 审查）：enter 时 body.mini 先在大窗旧视口宽下就位，首测按旧宽折行——大窗窄于构件时测偏高、
    // 宽于构件时测偏短（消息被裁）。主进程 setBounds 缩/放窗口后 resize 事件触发重测一次即收敛
    // （_miniReportedH 去重，几何不再变化即停）；上沿拖拽期间跳过（拖拽本身实时驱动 setMiniHeight）
    window.addEventListener('resize', () => {
      if (miniActive && !miniDragging) scheduleMiniUpdate();
    });

    // D3：窗口总高 = 构件（输入条固定 + 消息块最小高与内容高取大）+ 2M 透明留白带。
    // 尺寸一律读 CSS 变量 / 实测布局（单一真源），不写死数字；上限封顶由主进程按所在屏 workArea 处理。
    function measureMiniHeight() {
      // 构件总高 = 输入条 + max(面板最小高, 消息区实际) + 叠合量（margin-top 现为 0；若将来重引入负叠合 margin，此处自动扣减）。
      // 面板实际高含自身 padding/border（box-sizing:border-box），从 computed style 读，不硬编码。
      const panelMinH = parseFloat(getComputedStyle(miniBar).getPropertyValue('--mini-panel-min-h')) || 90;
      const pillH = miniPill.offsetHeight || 56;
      const cs = getComputedStyle(miniPanel);
      const contentH = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)
        + parseFloat(cs.borderTopWidth) + (parseFloat(cs.borderBottomWidth) || 0)
        + miniMessageEl.scrollHeight;
      const overlap = Math.min(0, parseFloat(getComputedStyle(miniPill).marginTop) || 0);
      // 返回值 = 窗口总高（含 2M 留白带；主进程底边锚定逻辑不变，圆柱底边 = 窗口底 − M）
      const m = parseFloat(getComputedStyle(miniBar).getPropertyValue('--mini-margin')) || 40;
      return Math.round(pillH + Math.max(panelMinH, contentH) + overlap + 2 * m);
    }

    // I9：迷你消息区三态渲染
    function renderMiniMarkdown(text) {
      try {
        const safeText = encodeLocalPaths(text);
        const html = typeof DOMPurify !== 'undefined'
          ? DOMPurify.sanitize(marked.parse(safeText), {
              ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|file):|\/|[A-Za-z]:\\|[a-z+.-]+(?:[^a-z+.-:]))(?:[^"<>]|$)/i
            })
          : marked.parse(safeText);
        // 迷你不做图片/链接后处理：img 直接移除；<a> 中性化为纯文本。
        // 原因：迷你没有点击拦截器（链接拦截只挂在 #messages 上），本地路径链接点击会走默认导航成 file://，
        // main.js will-navigate 放行 file:// → 整个 chat webContents 被导航走、会话 UI/SSE 全毁。完整交互请还原大窗。
        return html.replace(/<img[^>]*>/gi, '')
                   .replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1');
      } catch (e) {
        return escapeHtml(text);
      }
    }
    function updateMiniMessage() {
      if (!miniActive) return;
      const bubble = document.getElementById('status-bubble');
      const typingActive = !!bubble || isProcessing;
      if (typingActive && _miniBusySince == null) _miniBusySince = Date.now();
      if (typingActive && (!miniLastAssistant || miniLastAssistant.ts < _miniBusySince)) {
        // 处理中：镜像主窗状态气泡语义（首条流式到达即由状态切消息）
        miniMessageEl.classList.add('mini-state');

        // autoPeek 边沿触发（2026-09-16 幕墙 §2.3）：仅当本条消息 ts > 播种基线（enter/重载自愈/exit 时置）
        // 才武装并更新基线——同一消息不重复武装，scheduleMiniUpdate/轮询重入不续期。
        // 武装 = 清旧定时器 + 置 3s 截止 + 立即求值（否则指针不在窗内时无人驱动，到期时条件已过期、幕墙永不弹出）
        // + 重排 3s 自动收回定时器。
        if (miniLastAssistant.ts > miniPeekLastTs) {
          miniPeekLastTs = miniLastAssistant.ts;
          clearTimeout(peekTimer);
          autoPeekUntil = Date.now() + 3000;
          miniCurtainApply();
          peekTimer = setTimeout(() => {
            // 3s 到期 = 状态翻转点：按最后指针坐标 + 目标盒统一重判（R7）
            miniRejudgePointer();
            miniCurtainApply();
          }, 3000);
        }
        return;
      }
      // 空闲无消息：占位文本
      miniMessageEl.classList.add('mini-state');
      miniMessageEl.textContent = '暂无新消息';
    }

    let _miniUpdatePending = false;
    let _miniReportedH = 0;
    function scheduleMiniUpdate() {
      if (!miniActive || _miniUpdatePending) return;
      _miniUpdatePending = true;
      requestAnimationFrame(() => {
        _miniUpdatePending = false;
        if (!miniActive) return;
        updateMiniMessage();
        // D3：内容变化（新消息/清空）重测上报；手动锁定期间停止自动重测（I7）
        const h = measureMiniHeight();
        if (!miniManualLocked && h !== _miniReportedH) {
          _miniReportedH = h;
          window.electronAPI.setMiniHeight(h);
        }
      });
    }

    // 共享「重新应用迷你 DOM 态」路径：enter 与 mini-state-sync（重载自愈）都走它，幂等
    async function applyMiniDom() {
      try {
        const cfg = await window.electronAPI.getMiniConfig();
        miniBar.style.setProperty('--mini-idle-opacity', String(cfg.idleOpacity ?? 0.4));
        miniBar.style.setProperty('--mini-hover-opacity', String(cfg.hoverOpacity ?? 0.6));
        // 文字跟随透明（2026-09-15 用户口径）：idle 时含文字/描边/控件整体淡到该值；缺键兜底 CSS 缺省 0.35
        miniBar.style.setProperty('--mini-idle-content-opacity', String(cfg.idleContentOpacity ?? 0.35));
      } catch (e) { /* 兜底：CSS 缺省 0.4/0.6 */ }
      miniActive = true;
      miniManualLocked = false;   // I7：再 enter 恢复自动
      _miniBusySince = null;
      _miniReportedH = 0;

      // 状态位 + 指针坐标 + autoPeek（清定时器并复位 autoPeekUntil）+ 展开 class；
      // autoPeek 基线播种（必须在本函数末尾 updateMiniMessage() 调用之前）：

      // 窗口级穿透态惰性建立：enter 帧绝不发 setIgnoreMouseEvents（窗口级调用打进 enter 合成帧会破坏透明合成——白窗根因），
      // 等首次指针翻转或下方 600ms 兜底才建立；本复位段不调 miniApplyPassThrough（穿透 IPC 豁免）。
      pointerInBox = false;
      lastPointerX = null;
      lastPointerY = null;
      windowFocused = false;
      miniFocusLock = false;
      miniPassThrough = false;
      miniMouseMoveSeen = false;
      miniMoveDragging = false;
      autoPeekUntil = 0;
      clearTimeout(peekTimer);
      miniPeekLastTs = miniLastAssistant ? miniLastAssistant.ts : Date.now();
      miniBar.classList.remove('mini-curtain-open');
      clearTimeout(miniHoverFallbackTimer);
      miniHoverFallbackTimer = setTimeout(() => {
        // enter 兜底：~600ms 从未收到 mousemove（指针静止在窗外/未动过）→ 按"未命中"处理
        // （安全默认：窗口转穿透，鼠标一移动经 forward 收到 mousemove 即自动翻回可交互）
        if (!miniActive || miniMouseMoveSeen) return;
        miniApplyPassThrough(false);
      }, 600);
      document.documentElement.style.background = 'transparent';  // I3：清页面层 html 背景（exit 成对还原）
      document.body.classList.add('mini');
      updateMiniMessage();
    }

    // D3：body.mini 就位后测量构件实际总高上报（主进程先按缺省高入场，测量纠正——每次 enter 都走）
    function reportMiniHeight() {
      requestAnimationFrame(() => {
        if (!miniActive || miniManualLocked) return;
        const h = measureMiniHeight();
        _miniReportedH = h;
        window.electronAPI.setMiniHeight(h);
        // 几何未变时的强制重合成已由主进程 maybeForceRecompose 兜底（2026-09-15 白窗修复：
        // 渲染端微动 hack 退役——主进程对无几何变化路径统一做 1px 往返）
      });
    }

    async function enterMini() {
      if (miniActive) return;
      await applyMiniDom();
      // 双 rAF：确保 body.mini 的透明化已完成一帧绘制之后，主进程落位抓到的新帧才是透明内容
      // （同帧提交时 macOS 合成层仍是旧不透明帧——白窗根因；落位看门狗 2s 兜底渲染端失声）
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      window.electronAPI.enterMiniMode();
      reportMiniHeight();
    }

    // 迷你态 webContents 重载自愈（devtools reload / 崩溃自动重载）：渲染端丢 body.mini 而主进程仍 miniActive →
    // 主进程 chat-mini-enter 命中「已激活」早退时发该事件；重新应用迷你 DOM 态 + 重测上报（免用户点两次，幂等去重）
    if (window.electronAPI.onMiniStateSync) {

    }

    function exitMini() {
      if (!miniActive) return;

      miniManualLocked = false;   // 迷你态不记忆：退出再进恢复自动
      // 幕墙状态机复位（2026-09-16 plan §2.3 复位清单）：状态位 + 指针坐标 + autoPeek（清定时器并复位）
      // + 基线播种 + 展开 class。本复位段不调 miniApplyPassThrough（穿透 IPC 豁免）：
      // 穿透还原仍由下方既有 setMiniHover(true) 唯一负责。
      miniDragging = false;
      miniMoveDragging = false;
      pointerInBox = false;
      lastPointerX = null;
      lastPointerY = null;
      windowFocused = false;
      miniFocusLock = false;
      miniPassThrough = false;
      miniMouseMoveSeen = false;
      autoPeekUntil = 0;
      clearTimeout(peekTimer);
      miniPeekLastTs = miniLastAssistant ? miniLastAssistant.ts : Date.now();  // 播种（退出后 miniActive=false 已停用武装）
      clearTimeout(miniHoverFallbackTimer);
      miniBar.classList.remove('mini-hover');
      miniBar.classList.remove('mini-curtain-open');
      // exit 还原点击穿透：setIgnoreMouseEvents(false)。必须先于 exitMiniMode 发——主进程 chat-mini-hover
      // 有 miniActive 守卫，exit IPC 落地后（主进程 miniActive 翻转）再发会被守卫丢弃。
      // 主进程 chat-mini-exit handler 锁定与基线逐字一致（结构门禁）不含窗口级调用，故此为还原唯一通道。
      window.electronAPI.setMiniHover(true);
      document.body.classList.remove('mini');

    }

    // I9：迷你发送——复用主输入命令分支链（sendMainMessage），强制 main 路由；取值/清空/focus 自管
    async function miniSendMessage() {
      const text = miniInput.value.trim();
