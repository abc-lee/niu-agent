<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>妞妞聊天</title>
  <!-- Markdown 渲染 -->
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <!-- HTML 净化 — 防止 XSS (marked 不自带 sanitize) -->
  <script src="../../node_modules/dompurify/dist/purify.js"></script>
  <script>
    // 配置 marked：保留换行，启用 GFM
    if (typeof marked !== 'undefined' && marked.setOptions) {
      marked.setOptions({ breaks: true, gfm: true });
    }
  </script>
  <!-- 英文手写字体 fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 本地中文字体 - 阿朱泡泡体 */
    @font-face {
      font-family: 'AZhuPaoPaoTi';
      src: url('fonts/AZhuPaoPaoTi.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      background: transparent; 
      overflow: hidden;
      width: 100%;
      height: 100%;
      /* fallback 链：阿朱泡泡体 -> Caveat(英文) -> 系统默认 */
      font-family: 'AZhuPaoPaoTi', 'Caveat', system-ui, sans-serif;
      /* 铅笔笔迹效果 */
      color: #000;
      -webkit-font-smoothing: antialiased;
    }
    
    /* 主容器 - 便签风格 */
    .container {
      width: 100%;
      height: 100%;
      background: #faf8f0;
      border-radius: 12px;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      /* 棉纸纹理 */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    }
    
    /* 调整大小手柄 */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
      z-index: 100;
      -webkit-app-region: no-drag;
    }
    .resize-handle::before {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(0,0,0,0.2);
      border-bottom: 2px solid rgba(0,0,0,0.2);
    }
    
    /* 标题栏 - 可拖动 */
    .header {
      padding: 12px 16px;
      background: #e7ca4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-bottom: 2px dashed rgba(0,0,0,0.1);
      -webkit-app-region: drag;
    }
    .header:active { cursor: grabbing; }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title .avatar {
      width: 28px;
      height: 42px;
      object-fit: contain;
    }
    .header-title span {
      font-size: 18px;
      font-weight: normal;
      color: #000;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.3px rgba(0,0,0,0.4);
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.25);
    }
    .close-btn {
      background: #f8a7c8;
      border: none;
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      font-family: 'AZhuPaoPaoTi', cursive;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { 
      transform: scale(1.1);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    
    /* 消息区域 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: transparent;
    }
    .message {
      margin-bottom: 10px;
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      /* 保留换行符 */
      white-space: pre-wrap;
    }
    .message.user {
      background: #78b2be;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.1);
    }
    .message.assistant {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
    }
    /* subagent_msg：主↔子 Agent 对话侧边小卡片样式 */
    .message.subagent-msg {
      margin: 8px 16px;
      padding: 6px 10px;
      background: #f5f5f5;
      border-left: 3px solid #888;
      font-size: 0.85em;
      color: #555;
      border-radius: 4px;
    }
    .message.subagent-msg .subagent-direction {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 2px;
    }
    .message.subagent-msg .subagent-content {
      color: #333;
    }
    /* Markdown 渲染后的表格样式 */
    .message.assistant .message-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
    }
    .message.assistant .message-text th,
    .message.assistant .message-text td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .message.assistant .message-text th {
      background: #f5f5f5;
      font-weight: bold;
    }
    .message.assistant .message-text tr:nth-child(even) td {
      background: #fafafa;
    }
    .message.assistant .message-text code {
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 13px;
    }
    .message.assistant .message-text pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .message.assistant .message-text pre code {
      background: none;
      padding: 0;
    }
    .message.assistant .message-text ul,
    .message.assistant .message-text ol {
      padding-left: 20px;
      margin: 4px 0;
    }
    .message.assistant .message-text {
      white-space: normal;  /* markdown 渲染需要 normal，不能 pre-wrap */
    }
    .message.assistant .message-text blockquote {
      border-left: 3px solid #ccc;
      padding-left: 10px;
      color: #666;
      margin: 6px 0;
    }
    .message.system {
      background: #e9ecef;
      color: #000;
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      border-radius: 4px;
    }
    /* 定时任务消息：灰色背景，左对齐，带时钟图标 */
    .message.scheduled {
      background: #e9ecef;
      color: #555;
      font-size: 14px;
      border-radius: 4px;
      max-width: 85%;
    }
    .message.scheduled::before {
      content: '⏰ ';
      opacity: 0.7;
    }
    
    /* 正在输入动画 */
    .message.typing {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      padding: 10px 14px;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #666;
      border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    /* 输入区域 */
    .input-area {
      padding: 12px;
      background: white;
      border-top: 2px dashed rgba(0,0,0,0.08);
      display: flex;
      gap: 8px;
    }
    .input-area textarea {
      flex: 1;
      padding: 10px 14px;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      font-size: 16px;
      font-family: 'AZhuPaoPaoTi', cursive;
      background: rgba(255,255,255,0.8);
      color: #000;
      outline: none;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
      resize: none;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-area textarea:focus { border-color: #78b2be; }
    .input-area button {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'AZhuPaoPaoTi', cursive;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .input-area button:hover { 
      transform: translateY(-1px);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .stop-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-btn:hover {
      background: #c0392b;
    }
    
    /* 状态栏 */
    .status-bar {
      padding: 8px 16px;
      background: #faf8f0;
      border-top: 2px dashed rgba(0,0,0,0.05);
      font-size: 14px;
      color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .stats {
      display: flex;
      gap: 16px;
    }
    .status-bar .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .context-usage {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: default;
    }
    .context-usage svg {
      flex-shrink: 0;
    }
    .context-usage span {
      font-size: 11px;
      font-weight: 600;
      min-width: 28px;
    }
    .status-bar .graph-btn {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'AZhuPaoPaoTi', cursive;
      font-size: 14px;
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .status-bar .graph-btn:hover {
      background: #8de0a8;
    }
    
    /* 进度条 - 简洁不占地方 */
    .progress-bar {
      display: none;
      padding: 4px 12px;
      background: white;
      border-top: 1px dashed rgba(0,0,0,0.08);
      font-size: 13px;
      color: #000;
    }
    .progress-bar.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar .progress-track {
      flex: 1;
      height: 4px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .progress-fill {
      height: 100%;
      background: #78b2be;
      transition: width 0.3s ease;
    }
    .progress-bar .progress-text {
      min-width: 40px;
      text-align: right;
    }
    
    /* ========== 图片显示 ========== */
    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .chat-image {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      cursor: pointer;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .chat-image:hover {
      transform: scale(1.02);
    }
    /* 本地文件链接样式 */
    .local-file-link {
      color: #1890ff;
      text-decoration: underline;
      cursor: pointer;
    }
    .local-file-link:hover {
      color: #40a9ff;
    }
    .local-file-link::before {
      content: '📎 ';
    }

    /* ========== 人脸框显示 ========== */
    .image-container {
      position: relative;
      display: inline-block;
    }
    .face-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .face-box {
      position: absolute;
      border: 2px solid #f8a7c8;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .face-label {
      position: absolute;
      bottom: -18px;
      left: 0;
      background: #f8a7c8;
      color: white;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }
    
    /* ========== 拖放上传 ========== */
    .messages.drag-over {
      background: rgba(120, 178, 190, 0.1);
      outline: 2px dashed #78b2be;
    }
    .image-preview {
      position: relative;
      display: inline-block;
    }
    .image-preview img {
      max-width: 300px;
      max-height: 300px;
      border-radius: 8px;
    }
    .upload-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
    }
    .image-preview.error .upload-overlay {
      background: rgba(200, 50, 50, 0.7);
    }

    /* ========== 状态气泡（工具调用实时显示） ========== */
    .status-bubble {
      background: white;
      color: #666;
      font-style: italic;
      padding: 10px 14px;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      animation: status-pulse 1.5s ease-in-out infinite;
      max-width: 80%;
      word-break: break-word;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header" id="header">
      <div class="header-title">
        <img src="icons/icon-32.png" class="avatar" />
        <span>妞妞</span>
      </div>
      <button class="close-btn" id="close-btn">×</button>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <!-- 简洁进度条 -->
    <div class="progress-bar" id="progress-bar">
      <span id="progress-text">处理中...</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-text" id="progress-percent">0%</span>
    </div>
    
    <div class="input-area">
      <textarea id="user-input" placeholder="说点什么..." rows="1"></textarea>
      <button id="send-btn">发送</button>
      <button class="stop-btn" id="stop-btn" style="display:none;" title="停止生成 (/stop)">■</button>
    </div>
    
    <div class="status-bar" id="status-bar">
      <div class="stats">
        <span class="stat context-usage" id="context-usage" title="上下文使用率">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="none" stroke="#333" stroke-width="2.5"/>
            <circle cx="10" cy="10" r="8" fill="none" stroke="#4CAF50" stroke-width="2.5"
              stroke-dasharray="50.27" stroke-dashoffset="50.27" stroke-linecap="round"
              transform="rotate(-90 10 10)" id="context-usage-arc">
              <animateTransform attributeName="transform" type="rotate"
                    from="-90 10 10" to="270 10 10"
                    dur="2s" repeatCount="indefinite"
                    begin="indefinite"/>
            </circle>
          </svg>
          <span id="context-usage-text">0%</span>
        </span>
        <span class="stat">📁 <span id="file-count">0</span></span>
        <span class="stat">👤 <span id="person-count">0</span></span>
        <span class="stat">📝 <span id="note-count">0</span></span>
      </div>
      <button class="graph-btn" id="graph-btn">图谱 →</button>
    </div>
    <div class="resize-handle" id="resize-handle"></div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    let _pendingClear = false;
    let _pendingClearTimeout = null;
    window._compacting = false;  // 压缩中标志，由 compact_status 事件切换
    const closeBtn = document.getElementById('close-btn');
    const header = document.getElementById('header');
    const statusBar = document.getElementById('status-bar');
    const resizeHandle = document.getElementById('resize-handle');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const fileCount = document.getElementById('file-count');
    const personCount = document.getElementById('person-count');
    const noteCount = document.getElementById('note-count');
    const graphBtn = document.getElementById('graph-btn');
    let isProcessing = false;

    // ========== 拖拽窗口 ==========
    // 拦截消息区域中的链接点击，用系统默认浏览器打开
    messages.addEventListener('click', (e) => {
      const link = e.target.closest('a[href]');
      if (link) {
        const href = link.getAttribute('href');
        if (!href) return;
        const lowerHref = href.toLowerCase();
        if (lowerHref.startsWith('#')) return; // 锚点链接，浏览器自行处理
        // 仅允许 http/https 协议，阻止 javascript:/data:/vbscript: 等危险协议
        if (!lowerHref.startsWith('http://') && !lowerHref.startsWith('https://')) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        window.electronAPI.openExternal(href);
      }
    });

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    
    header.addEventListener('mousedown', (e) => {
      if (e.target === closeBtn) return;
      isDragging = true;
      dragOffset.x = e.screenX - window.screenX;
      dragOffset.y = e.screenY - window.screenY;
      e.preventDefault();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        window.electronAPI.setPosition(e.screenX - dragOffset.x, e.screenY - dragOffset.y);
      }
    });
    
    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // ========== 调整窗口大小 ==========
    let isResizing = false;
    let resizeStart = { x: 0, y: 0, width: 0, height: 0 };
    
    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStart.x = e.screenX;
      resizeStart.y = e.screenY;
      resizeStart.width = window.outerWidth;
      resizeStart.height = window.outerHeight;
      e.preventDefault();
      e.stopPropagation();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dx = e.screenX - resizeStart.x;
      const dy = e.screenY - resizeStart.y;
      const newWidth = Math.max(300, resizeStart.width + dx);
      const newHeight = Math.max(400, resizeStart.height + dy);
      window.electronAPI.resizeWindow(newWidth, newHeight);
    });
    
    document.addEventListener('mouseup', () => {
      isResizing = false;
    });
    
    // ========== 关闭窗口 ==========
    closeBtn.addEventListener('click', () => {
      window.electronAPI.close();
    });
    
    // ========== 图谱按钮 ==========
    graphBtn.addEventListener('click', () => {
      window.electronAPI.openGraph();
    });
    
    // ========== 发送消息 ==========
    sendBtn.addEventListener('click', sendMessage);

    // === 双击停止按钮逻辑 ===
    // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
    // 单击：只停主 Agent + 检查子 Agent 状态（Task 13 补 checkRunningSubagents）
    let stopClickTimer = null;
    let stopClickFired = false;  // 哨兵：双击已触发，400ms 内后续点击忽略
    const STOP_DOUBLE_CLICK_WINDOW = 400; // ms

    stopBtn.addEventListener('click', () => {
      if (stopClickFired) {
        // 双击刚触发，400ms 内的后续点击忽略
        return;
      }
      if (stopClickTimer) {
        // 第二次点击（双击）
        clearTimeout(stopClickTimer);
        stopClickTimer = null;
        stopClickFired = true;
        setTimeout(() => { stopClickFired = false; }, STOP_DOUBLE_CLICK_WINDOW);
        // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
        fetch('/api/stop_all', { method: 'POST' }).catch(e => console.error('stop_all 请求失败', e));
        window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
      } else {
        // 第一次点击（单击）
        stopClickTimer = setTimeout(() => {
          stopClickTimer = null;
          // 单击超时：只停主 Agent
          window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
          // 提示用户还有子 Agent 在跑（如果有）—— Task 13 实现
          checkRunningSubagents();
        }, STOP_DOUBLE_CLICK_WINDOW);
      }
    });

    async function checkRunningSubagents() {
      try {

    // 重试发送消息（自动重连）
    async function sendMessageWithRetry(text, maxRetries = 10, delay = 2000) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const result = await window.electronAPI.sendMessage(text);
          
          // 检查返回的错误是否是连接错误
          if (result && result.error) {
            const isConnectionError = result.error.includes('ECONNREFUSED') ||
              result.error.includes('connect') ||
              result.error.includes('ENOTFOUND');
              // 注意：不重试 ECONNRESET（服务器已收到请求，重试会导致重复消息）
            
            if (isConnectionError && i < maxRetries - 1) {
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
          }
          
          return result;
        } catch (err) {
          const errMsg = err.message || String(err);
          const isConnectionError = errMsg.includes('ECONNREFUSED') ||
            errMsg.includes('connect') ||
            errMsg.includes('ENOTFOUND');
          
          if (isConnectionError && i < maxRetries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
          } else {
            throw err;
          }
        }
      }
      return null;
    }

    // 把文本插入到输入框末尾，自动补换行让路径独占一行：
    // - 已有内容为空或末尾是换行 → 直接追加路径
    // - 已有内容末尾不是换行 → 补换行再追加路径
    // - 路径末尾自动补换行，光标停在新行行首，用户补充文字在新行输入
    // 这样主 Agent 能识别"行首是绝对路径"，避免路径含空格时与用户补充文字混淆
    // 最后聚焦+触发 input 事件让 textarea 自适应高度
    function insertTextToInput(text) {
      const current = userInput.value;
      if (current && !current.endsWith('\n')) {
        userInput.value = current + '\n' + text + '\n';
      } else {
        userInput.value = current + text + '\n';
      }
      userInput.focus();
      // 光标定位到末尾（新行行首）
      userInput.setSelectionRange(userInput.value.length, userInput.value.length);
      userInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) { userInput.style.height = 'auto'; return; }
      sendBtn.disabled = true;

      // /stop 指令 - 停止当前 Agent 工作（允许在 isProcessing=true 时执行）
      if (text === '/stop') {
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = false;
        try {
          await window.electronAPI.sendMessage('/stop');
        } catch (e) {
          console.error('停止失败:', e);
          addSystemMessage('停止失败: ' + (e.message || e));
        }
        return;
      }

      // /clear 指令 - 先停止再清空（允许在 isProcessing=true 时执行）
      if (text === '/clear') {
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = false;
        if (isProcessing) {
          // Agent 正在运行：先停止，等 chat_idle 事件再清空
          try {
            await window.electronAPI.sendMessage('/stop');
          } catch (e) {
            console.error('停止失败:', e);
            addSystemMessage('停止失败: ' + (e.message || e));
          }
          _pendingClear = true;
          if (_pendingClearTimeout) clearTimeout(_pendingClearTimeout);
          _pendingClearTimeout = setTimeout(() => {
            _pendingClear = false;
            _pendingClearTimeout = null;
            addSystemMessage('停止超时，清空操作已取消');
          }, 120000);
        } else {
          // Agent 空闲：直接清空，无需等 chat_idle
          await clearChat();
        }
        return;
      }

      // /new 指令 - 清空聊天记录
      if (text === '/new') {
        userInput.value = '';
        userInput.style.height = 'auto';
        stopBtn.style.display = 'none';
        sendBtn.disabled = false;
        await clearChat();
        return;
      }

      // 铁律1：用户触发的 → 先刷新页面（即时反馈）
      const userMsg = addMessage('user', text);
      if (!userMsg) { return; }  // addMessage 返回 null（如 tool 消息被过滤），跳过后续

      userInput.value = '';
      userInput.style.height = 'auto';
      showTyping();
      window.electronAPI.notifyBusy(true, 'chat');

      try {
        const result = await sendMessageWithRetry(text);
      } finally {
        // 兜底状态重置（SSE chat_idle 为主驱动，此处为防御兜底）
        hideTyping();
        window.electronAPI.notifyBusy(false, 'chat');
        stopBtn.style.display = 'none';
        isProcessing = false;
        sendBtn.disabled = false;
        loadStats();
        userInput.focus();
      }
    }

    // ========== 路径编码预处理（括号平衡算法） ==========
    // 修复：文件路径中的括号（如 硅基银行项目 (2).docx）被 Markdown 语法截断
    // 简单正则 [^)]* 遇到第一个 ) 就停止匹配，导致路径截断
    // 改用括号平衡算法，正确处理路径中嵌套的括号
    function encodeLocalPaths(text) {
      // 用括号平衡算法处理包含空格/括号/方括号/井号/百分号的本地路径
      let result = '';
      let i = 0;
      const n = text.length;
      while (i < n) {
        // 检测 [text](path) 或 ![alt](path) 模式
        let isImage = false;
        let bracketStart = -1;
        if (text.substring(i, i + 2) === '![') {
          isImage = true;
          bracketStart = i + 2;
        } else if (text[i] === '[') {
          bracketStart = i + 1;
        }
        if (bracketStart >= 0) {
          const bracketEnd = text.indexOf(']', bracketStart);
          if (bracketEnd >= 0 && bracketEnd + 1 < n && text[bracketEnd + 1] === '(') {
            // 用括号平衡找到匹配的 )
            let depth = 1;
            let j = bracketEnd + 2;
            while (j < n && depth > 0) {
              if (text[j] === '(') depth++;
              else if (text[j] === ')') depth--;
              j++;
            }
            if (depth === 0) {
              const path = text.substring(bracketEnd + 2, j - 1);
              // 只对本地路径（以/或盘符开头）且包含特殊字符的路径做 URL 编码
              if ((path.startsWith('/') || /^[A-Za-z]:[\/]/.test(path)) &&
                  (path.includes(' ') || path.includes('(') || path.includes(')') ||
                   path.includes('[') || path.includes(']') ||
                   path.includes('#') || path.includes('%'))) {
                // 注意：% 必须最后替换，因为其他替换会产生新的 % 字符（如 %20）
                const encoded = path
                  .replace(/\\/g, '/')  // Windows 反斜杠转正斜杠
                  .replace(/ /g, '%20')
                  .replace(/\(/g, '%28')
                  .replace(/\)/g, '%29')
                  .replace(/\[/g, '%5B')
                  .replace(/\]/g, '%5D')
                  .replace(/#/g, '%23')
                  .replace(/%/g, '%25');
                result += text.substring(i, bracketEnd + 2) + encoded + ')';
              } else {
                result += text.substring(i, j);
              }
              i = j;
              continue;
            }
          }
        }
        result += text[i];
        i++;
      }
      return result;
    }

    // ========== 消息显示 ==========
    function addMessage(role, text, images = [], skipAppend = false) {
      // 双管道分离：tool 消息只走 DB 管道，不渲染到对话框
      if (role === 'tool') return null;
      // === 新增：subagent_msg 特殊渲染（主↔子 Agent 对话，区别于用户↔主 Agent） ===
      if (role === 'subagent_msg') {
        return addSubagentMessage(text, skipAppend);
      }
      const div = document.createElement('div');
      div.className = `message ${role}`;
      
      // 所有消息统一走 Markdown 渲染（包括含图片的消息）
      // Markdown 图片 ![描述](路径) 由 marked.js 渲染，然后后处理添加交互
      if (text) {
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        // assistant 消息用 markdown 渲染，其他角色纯文本
        if (role === 'assistant' && typeof marked !== 'undefined') {
          try {
            // Pre-process: 用括号平衡算法编码本地路径中的空格和括号
            // 简单正则 [^)]* 遇到路径中 ) 就截断（如 硅基银行项目 (2).docx）
            const safeText = encodeLocalPaths(text);
            const htmlContent = typeof DOMPurify !== 'undefined'
              ? DOMPurify.sanitize(marked.parse(safeText), {
                  ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|file):|\/|[A-Za-z]:\\|[a-z+.-]+(?:[^a-z+.-:]))(?:[^"<>]|$)/i
                })
              : marked.parse(safeText);
            textDiv.innerHTML = htmlContent;
            // 后处理：将本地路径图片转为 file:/// URL 并添加交互
            textDiv.querySelectorAll('img').forEach(img => {
              let src = img.getAttribute('src');
              // 兼容模型输出 file:/// 前缀：去掉后统一由下面的逻辑处理
              if (src && src.startsWith('file:///')) {
                src = decodeURIComponent(src.replace('file:///', ''));
                img.setAttribute('src', src);
              } else if (src && src.startsWith('file://')) {
                src = decodeURIComponent(src.replace('file://', ''));
                img.setAttribute('src', src);
              }
              if (src && /^[A-Za-z]:[\/]/.test(src)) {
                const encodedPath = src.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
                img.setAttribute('src', 'file:///' + encodedPath);
              } else if (src && /^\//.test(src)) {
                const encodedPath = src.split('/').map(encodeURIComponent).join('/');
                img.setAttribute('src', 'file://' + encodedPath);
              }
              // 给本地路径图片添加 chat-image class（自适应缩放）
              if (src && (/^[A-Za-z]:[\/]/.test(src) || /^\//.test(src) || src.startsWith('file://'))) {
                img.classList.add('chat-image');
              }
              // 添加双击用系统查看器打开
              const imgSrc = img.getAttribute('src') || src;
              if (imgSrc) {
                // 从 file:/// URL 还原本地路径，或直接使用原始路径
                let localPath = src || '';
                if (localPath.startsWith('file:///')) {
                  localPath = decodeURIComponent(localPath.replace('file:///', ''));
                }
                if (localPath && /^[A-Za-z]:/.test(localPath)) {
                  img.dataset.filePath = localPath;
                  img.style.cursor = 'pointer';
                  img.addEventListener('dblclick', () => {
                    window.electronAPI.openWithSystemViewer(localPath);
                  });
                } else if (localPath && /^\//.test(localPath)) {
                  img.dataset.filePath = localPath;
                  img.style.cursor = 'pointer';
                  img.addEventListener('dblclick', () => {
                    window.electronAPI.openWithSystemViewer(localPath);
                  });
                }
              }
            });
            // 后处理：本地路径文件链接添加点击打开功能
            textDiv.querySelectorAll('a').forEach(a => {
              let href = a.getAttribute('href') || '';
              // 剥离 file:/// 前缀
              if (href.startsWith('file:///')) {
                href = href.replace('file:///', '');
              } else if (href.startsWith('file://')) {
                href = href.replace('file://', '');
              }
              // marked.js 会将中文路径编码为 %XX，需要解码
              try { href = decodeURIComponent(href); } catch(e) {}
              // 判断是否为本地路径（绝对路径）— macOS 以 / 开头，Windows 以 C: 开头
              if (href && (/^[A-Za-z]:[\/]/.test(href) || /^\//.test(href))) {
                a.setAttribute('data-file-path', href);
                a.setAttribute('href', '#');
                a.classList.add('local-file-link');
                a.addEventListener('click', (e) => {
                  e.preventDefault();
                  const filePath = a.getAttribute('data-file-path');
                  if (filePath && window.electronAPI && window.electronAPI.openWithSystemViewer) {
                    window.electronAPI.openWithSystemViewer(filePath);
                  }
                });
              }
            });
          } catch (e) {
            console.warn('[Chat] Markdown 渲染失败，降级为纯文本:', e);
            textDiv.textContent = text;
          }
        } else {
          textDiv.textContent = text;
        }
        div.appendChild(textDiv);
      }
      
      // 额外图片（拖入等）
      if (images && images.length > 0) {
        const imagesDiv = document.createElement('div');
        imagesDiv.className = 'message-images';
        images.forEach(img => {
          const imgEl = document.createElement('img');
          imgEl.src = img.src;
          imgEl.className = 'chat-image';
          if (img.alt) imgEl.alt = img.alt;
          if (img.photoId) imgEl.dataset.photoId = img.photoId;
          if (img.filePath) imgEl.dataset.filePath = img.filePath;
          
          // 双击用系统查看器打开
          if (img.filePath) {
            imgEl.addEventListener('dblclick', () => {
              window.electronAPI.openWithSystemViewer(img.filePath);
            });
          }
          
          imagesDiv.appendChild(imgEl);
        });
        div.appendChild(imagesDiv);
      }
      
      if (!skipAppend) {
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
      return div;
    }

    // ========== subagent_msg 渲染（主↔子 Agent 对话侧边卡片） ==========
    function addSubagentMessage(text, skipAppend = false) {
      // 解析格式：@目标 [发送者名] 内容
      const match = text.match(/^@(\S+)(?:\s+\[([^\]]+)\])?\s*(.*)$/s);
      if (!match) {
        // 解析失败，按普通 assistant 消息渲染降级
        return addMessage('assistant', text, [], skipAppend);
      }
      const target = match[1];
      const sender = match[2] || '';
      const content = match[3].trim();

      // 方向：sender → target（无 sender 时只显示 → target）
      const direction = sender ? `${sender} → ${target}` : `→ ${target}`;

      const div = document.createElement('div');
      div.className = 'message subagent-msg';
      div.innerHTML = `
        <div class="subagent-direction">${escapeHtml(direction)}</div>
        <div class="subagent-content">${escapeHtml(content)}</div>
      `;
      if (!skipAppend) {
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
      return div;
    }

    // HTML 转义辅助函数
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addMessageWithId(role, text, id, images = []) {
      // 检查是否已存在相同ID的消息，避免重复
      const existing = document.querySelector(`.message[data-id="${id}"]`);
      if (existing) {
        console.log('[Chat] 消息已存在，跳过重复:', id);
        return existing;
      }

      const div = addMessage(role, text, images);
      if (!div) return null;
      div.dataset.id = id;
      return div;
    }

    // ========== 加载统计数据 ==========
    async function loadStats() {
      try {
        const result = await window.electronAPI.getStats();
        if (result) {
          fileCount.textContent = result.files || 0;
          personCount.textContent = result.persons || 0;
          noteCount.textContent = result.notes || 0;
          // 更新上下文使用率
          const usage = result.context_usage || 0;
          const pct = Math.round(usage * 100);
          const arc = document.getElementById('context-usage-arc');
          const text = document.getElementById('context-usage-text');
          if (arc && text) {
            const circumference = 2 * Math.PI * 8; // 50.27
            arc.setAttribute('stroke-dashoffset', circumference * (1 - usage));
            // 颜色：<70% 绿色，70-80% 黄色，≥80% 红色
            let color;
            if (pct < 70) color = '#4CAF50';
            else if (pct < 80) color = '#FF9800';
            else color = '#F44336';
            // 压缩中不改 arc stroke 和 text color（由 compact_status 事件控制为红色）
            if (!window._compacting) {
              arc.setAttribute('stroke', color);
              text.textContent = pct + '%';
              text.style.color = color;
            } else {
              // 压缩中：百分比照常更新，但颜色保持红色
              text.textContent = pct + '%';
            }
          }
        }
      } catch (e) {
        console.error('加载统计失败:', e);
      }
    }

    // 监听提醒通知（scheduler 触发的定时任务，消息已通过数据库+SSE显示）
    window.electronAPI.onAlert(() => {

    window.electronAPI.onToolStatus((data) => {

    // === 压缩状态：圆环旋转 + tooltip + 文本红色 ===
    if (window.electronAPI && window.electronAPI.onCompactStatus) {

        const arc = document.getElementById('context-usage-arc');
        const animate = arc ? arc.querySelector('animateTransform') : null;

    // 监听入库进度SSE事件（由后端pipeline watcher推送）
    // ingest-started：显示进度条并开始轮询
    // ingest-completed：隐藏进度条
    let ingestPollTimer = null;
    const INGEST_POLL_INTERVAL = 3000;
    const INGEST_PROGRESS_API = 'http://127.0.0.1:9876/api/kg/pipeline_status';

    async function pollIngestProgress() {
      try {
        const resp = await fetch(INGEST_PROGRESS_API);
        const data = await resp.json();
        if (data.busy) {
          showProgress('处理中...', data.progress);
        } else {
          hideProgress();
          stopIngestPolling();
        }
      } catch (e) {
        console.debug('[Chat] ingest poll failed:', e.message);
      }
    }

    function startIngestPolling() {
      if (ingestPollTimer) return;
      pollIngestProgress();
      ingestPollTimer = setInterval(pollIngestProgress, INGEST_POLL_INTERVAL);
    }

    function stopIngestPolling() {
      if (ingestPollTimer) {
        clearInterval(ingestPollTimer);
        ingestPollTimer = null;
      }
    }

    window.electronAPI.onIngestStarted(() => {
      console.log('[Chat] ingest-started SSE event received');
      showProgress('处理中...', 0);
      startIngestPolling();
    });

    window.electronAPI.onIngestCompleted(() => {
      console.log('[Chat] ingest-completed SSE event received');
      hideProgress();
      stopIngestPolling();
      loadStats();
    });

    // ========== 数据库$视图刷新 ==========
    let _refreshFromDBRunning = false;  // 防止并发调用
    let _refreshPending = false;
    async function refreshFromDB() {
      if (_refreshFromDBRunning) {
        _refreshPending = true;
        return;
      }
      _refreshFromDBRunning = true;
      try {
        // 收集DOM中已有的消息ID
        const existingIds = new Set();
        document.querySelectorAll('.message[data-id]').forEach(div => {
          existingIds.add(div.dataset.id);
        });

        // 从数据库获取最新消息
        const result = await window.electronAPI.getHistory(50);
        const msgs = result.messages || [];

        if (existingIds.size === 0) {
          // DOM中没有带data-id的消息（可能只有临时用户消息或为空）
          // 清空DOM，用数据库消息重建（类似loadHistory的初始化逻辑）
          messages.innerHTML = '';
          msgs.forEach(msg => {
            addMessageWithId(msg.role, msg.content, msg.id);
          });
          if (msgs.length > 0) {
            oldestMessageId = msgs[0].id;
          }
          // V4: 状态机重置由SSE chat_idle事件控制，refreshFromDB不再重置状态
          messages.scrollTop = messages.scrollHeight;
          return;
        }

        // 正常去重逻辑：只添加比DOM中已有消息更新的消息
        // msgs 是按时间顺序排列（最旧在前），DOM 中已有的是中间某段
        // 找到第一条在DOM中已存在的消息位置，只处理它之后的消息
        let firstExistingIdx = -1;
        for (let i = 0; i < msgs.length; i++) {
          if (existingIds.has(msgs[i].id)) {
            firstExistingIdx = i;
            break;
          }
        }

        // 只添加已存在消息之后的消息（更新的消息）
        const startIdx = firstExistingIdx >= 0 ? firstExistingIdx : 0;

        let hasNew = false;
        for (let i = startIdx; i < msgs.length; i++) {
          const msg = msgs[i];
          if (!existingIds.has(msg.id)) {
            addMessageWithId(msg.role, msg.content, msg.id);
            hasNew = true;
          }
        }

        if (hasNew) {
          // 只删除已被数据库版本替换的临时用户消息
          const dbUserTexts = new Set(
            msgs.filter(m => m.role === 'user').map(m => m.content)
          );
          document.querySelectorAll('.message.user:not([data-id])').forEach(div => {
            const text = div.querySelector('.message-text')?.textContent;
            if (dbUserTexts.has(text)) {
              div.remove();
            }
          });
          // 状态气泡始终保持在最底部
          const bubbleEl = document.getElementById('status-bubble');
          if (bubbleEl && bubbleEl.parentNode === messages) {
            messages.appendChild(bubbleEl);
          }
          messages.scrollTop = messages.scrollHeight;
          // 只在收到 assistant 消息时才隐藏 typing（用户消息入库不应关闭 typing）
          // 只检查新添加的消息（startIdx 之后），避免旧消息误触发
          // V4: 逐条推送模式下，中间轮次的assistant(tool_calls)不应重置状态机
          // 只有纯文本assistant（无tool_calls）出现时才表示任务完成
          // V4: 状态机重置由SSE chat_idle事件控制，refreshFromDB不再重置状态
          if (!oldestMessageId && msgs.length > 0) {
            oldestMessageId = msgs[0].id;
          }
        }
      } catch (e) {
        console.error('[Chat] 刷新消息失败:', e);
      } finally {
        _refreshFromDBRunning = false;
        if (_refreshPending) {
          _refreshPending = false;
          setTimeout(() => refreshFromDB(), 0);
        }
      }
    }

    // SSE通知：有新消息 → 从数据库刷新
    // V4: chat_busy/chat_idle 事件控制状态机，普通消息触发 refreshFromDB
    window.electronAPI.onNewMessage(async (data) => {
      // 阶段二：子 Agent 触发的消息（ask_main_agent 或完成通知），主 Agent 闲置时自动触发新一轮对话
      // db_monitor 链路 A 只在主 Agent 闲置（_chat_lock.locked()==false）时推 SSE
      // 所以前端收到时 isProcessing 必为 false（状态机持久化已确认）
      // 加兜底判断避免状态机延迟导致忙时触发
      if (data && data.role === 'subagent_msg' && data.source === 'subagent') {
        if (!isProcessing) {
          // content 格式 "[子名] 内容"——作为 message 参数传给 /api/chat/session
          // 后端 compat.py 写 user 消息到 db（作为最后一条 user 消息）+ 调 LLM
          // 不调 addMessage 本地渲染（避免重复——后端写 db 后会推 role=user SSE 让前端 refreshFromDB）
          // 直接调 sendMessageWithRetry 走 HTTP 路径（复用用户发消息的现有逻辑）
          const msgContent = data.content;
          sendMessageWithRetry(msgContent).catch(err => {
            console.error('[Stage2] 自动触发主 Agent 对话失败：', err);
          });
        } else {
          // 兜底：主 Agent 忙时（理论上不应发生，db_monitor 只在闲置时推 SSE）
          // 不触发，记录日志便于排查
          console.warn('[Stage2] 收到 subagent_msg SSE 但主 Agent 忙，消息可能已从队列 pop（边界场景）');
        }
        return;
      }
      if (data && data.role === 'chat_idle') {
        // Agent循环结束：重置状态机
        hideTyping();
        isProcessing = false;
        sendBtn.disabled = false;
        stopBtn.style.display = 'none';
        window.electronAPI.notifyBusy(false, 'chat');
        // 处理 /clear 的延迟清空
        if (_pendingClear) {
          _pendingClear = false;
          if (_pendingClearTimeout) { clearTimeout(_pendingClearTimeout); _pendingClearTimeout = null; }
          try {
            await clearChat();
          } catch (e) {
            console.error('清空失败:', e);
            addSystemMessage('清空失败: ' + (e.message || e));
          }
        }
      } else if (data && data.role === 'chat_busy') {
        // Agent循环开始：通知 spirit 进入忙碌状态
        isProcessing = true;
        stopBtn.style.display = 'flex';
        window.electronAPI.notifyBusy(true, 'chat');
      } else {
        // 普通消息通知 → 从DB刷新渲染
        refreshFromDB();
      }
    });

    // 窗口恢复/获得焦点时主动查询 Agent 忙碌状态，同步停止按钮（兜底 isVisible 守卫移除后的场景）
    window.electronAPI.onSyncState(async () => {
      try {
        const status = await window.electronAPI.getChatStatus();
        if (status && status.busy) {
          stopBtn.style.display = 'flex';
          isProcessing = true;
          sendBtn.disabled = true;
        } else {
          stopBtn.style.display = 'none';
          isProcessing = false;
          sendBtn.disabled = false;
        }
      } catch (e) {
        console.error('Failed to sync chat status:', e);
      }
    });

    // Escape 键停止当前 Agent 工作（只在正在处理且停止按钮可见时响应）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isProcessing && stopBtn.style.display === 'flex') {
        e.preventDefault();
        window.electronAPI.sendMessage('/stop');
      }
    });

    // ========== 初始化 ==========
    let oldestMessageId = null;  // 用于加载更早的消息
    let isLoadingMore = false;   // 防止重复加载
    
    // 先加载历史消息
    loadHistory().then(() => {
      // 如果没有历史消息，显示欢迎语
      if (messages.children.length === 0) {
        addMessage('system', '妞妞已就绪！有什么可以帮你的？');
      }
      // 滚动到底部
      messages.scrollTop = messages.scrollHeight;
      loadStats();
      userInput.focus();
    });
    
    // ========== 拖放文件/图片处理 ==========
    // 阻止默认拖放行为
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      messages.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });
    
    // 拖入时添加视觉反馈
    messages.addEventListener('dragenter', () => {
      messages.classList.add('drag-over');
    });
    
    messages.addEventListener('dragleave', (e) => {
      // 只有离开 messages 区域时才移除高亮
      if (e.target === messages || !messages.contains(e.relatedTarget)) {
        messages.classList.remove('drag-over');
      }
    });
    
    messages.addEventListener('drop', (e) => {
      messages.classList.remove('drag-over');

      // e.dataTransfer.files 在某些场景（拖入纯文本/URL）可能为 null，需防御
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;

      // Electron 33 废弃 File.path，必须用 webUtils.getPathForFile 经 preload 暴露的 getFilePath
      // 可选链防御：如果 preload 未加载（window.electronAPI 未定义），不会抛 TypeError 而是 map 出 undefined
      const paths = Array.from(files)
        .map(f => window.electronAPI?.getFilePath?.(f))
        .filter(Boolean);

      if (paths.length === 0) {
        // 有文件但拿不到路径——通常是 preload 未生效或 webUtils 异常，便于排查
        console.warn('[Chat] drop: 未获取到任何文件路径，可能 preload 未生效或 webUtils 异常');
        return;
      }

      insertTextToInput(paths.join(', '));
    });
    
    // 监听滚动，到顶部时加载更多
    messages.addEventListener('scroll', async () => {
      // 检查是否滚动到顶部
      if (messages.scrollTop < 50 && !isLoadingMore && oldestMessageId) {
        isLoadingMore = true;
        const oldScrollHeight = messages.scrollHeight;
        
        try {
          const result = await window.electronAPI.getHistory(20, oldestMessageId);
          const history = result.messages || result;  // 兼容新旧格式
          if (history && history.length > 0) {
            // 在顶部插入消息（history 已经是正序：最旧在前）
            // 保存插入参考节点：所有新消息插入到这个节点之前，保持正序
            const refNode = messages.firstChild;
            history.forEach(msg => {
              prependMessage(msg.role, msg.content, msg.id, refNode);
            });
            // 更新最旧消息ID为刚加载的第一条（最旧的）
            oldestMessageId = history[0].id;
            // 保持滚动位置
            const newScrollHeight = messages.scrollHeight;
            messages.scrollTop = newScrollHeight - oldScrollHeight;
            console.log('[Chat] 加载了更多', history.length, '条历史消息，最旧ID:', oldestMessageId);
          } else {
            console.log('[Chat] 没有更多历史消息');
            oldestMessageId = null;  // 停止后续加载尝试
          }
        } catch (e) {
          console.error('[Chat] 加载更多失败:', e);
        }
        
        isLoadingMore = false;
      }
    });

    // 窗口获得焦点时，仅通知 spirit（不刷新消息，消息由 SSE 驱动）
    window.addEventListener('focus', async () => {
      window.electronAPI.notifyActivity();
    });

    // 加载历史消息
    async function loadHistory() {
      try {
        messages.innerHTML = '';
        oldestMessageId = null;

        const result = await window.electronAPI.getHistory(20);
        const history = result.messages || result;
        if (history && history.length > 0) {
          history.forEach(msg => {
            addMessageWithId(msg.role, msg.content, msg.id);
          });
          oldestMessageId = history[0].id;
        }
      } catch (e) {
        console.error('[Chat] 加载历史失败:', e);
        addMessage('system', '妞妞已就绪！有什么可以帮你的？');
      }
    }
    
    // 在顶部插入消息（用于加载更多历史）
    function prependMessage(role, content, id, refNode = null) {
      // 去重：检查是否已存在相同ID的消息
      const existing = document.querySelector(`.message[data-id="${id}"]`);
      if (existing) return;

      // 复用 addMessage 的渲染逻辑（Markdown 图片由 marked.js 渲染）
      const div = addMessage(role, content, [], true);  // skipAppend=true: 不做appendChild/scrollTop
      if (!div) return;
      div.dataset.id = id;
      messages.insertBefore(div, refNode || messages.firstChild);
    }
  </script>
</body>
</html>
