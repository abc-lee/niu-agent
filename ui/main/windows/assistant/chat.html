    // ========== 路径编码预处理（括号平衡算法） ==========
    // 修复：文件路径中的括号（如 硅基银行项目 (2).docx）被 Markdown 语法截断
    // 简单正则 [^)]* 遇到第一个 ) 就停止匹配，导致路径截断
    // 改用括号平衡算法，正确处理路径中嵌套的括号
    function encodeLocalPaths(text) {
      // 用括号平衡算法处理包含空格/括号/方括号/井号/百分号的本地路径
      let result = '';
      let i = 0;
      const n = text.length;
      while (i < n) {
        // 检测 [text](path) 或 ![alt](path) 模式
        let isImage = false;
        let bracketStart = -1;
        if (text.substring(i, i + 2) === '![') {
          isImage = true;
          bracketStart = i + 2;
        } else if (text[i] === '[') {
          bracketStart = i + 1;
        }
        if (bracketStart >= 0) {
          const bracketEnd = text.indexOf(']', bracketStart);
          if (bracketEnd >= 0 && bracketEnd + 1 < n && text[bracketEnd + 1] === '(') {
            // 用括号平衡找到匹配的 )
            let depth = 1;
            let j = bracketEnd + 2;
            while (j < n && depth > 0) {
              if (text[j] === '(') depth++;
              else if (text[j] === ')') depth--;
              j++;
            }
            if (depth === 0) {
              const path = text.substring(bracketEnd + 2, j - 1);
              // 只对本地路径（以/或盘符开头）且包含特殊字符的路径做 URL 编码
              if ((path.startsWith('/') || /^[A-Za-z]:[\/]/.test(path)) &&
                  (path.includes(' ') || path.includes('(') || path.includes(')') ||
                   path.includes('[') || path.includes(']') ||
                   path.includes('#') || path.includes('%'))) {
                // 注意：% 必须最后替换，因为其他替换会产生新的 % 字符（如 %20）
                const encoded = path
                  .replace(/\\/g, '/')  // Windows 反斜杠转正斜杠
                  .replace(/ /g, '%20')
                  .replace(/\(/g, '%28')
                  .replace(/\)/g, '%29')
                  .replace(/\[/g, '%5B')
                  .replace(/\]/g, '%5D')
                  .replace(/#/g, '%23')
                  .replace(/%/g, '%25');
                result += text.substring(i, bracketEnd + 2) + encoded + ')';
              } else {
                result += text.substring(i, j);
              }
              i = j;
              continue;
            }
          }
        }
        result += text[i];
        i++;
      }
      return result;
    }

    // ========== 时间戳格式化 ==========
    function formatRelativeTime(isoString) {
      if (!isoString) return null;
      const now = new Date();
      const t = new Date(isoString);
      if (isNaN(t.getTime())) return null;

      const diffMs = now - t;
      const diffMin = Math.floor(diffMs / 60000);

      if (diffMin < 1) return '刚刚';
      if (diffMin < 60) return `${diffMin}分钟前`;

      const sameDay = now.toDateString() === t.toDateString();
      if (sameDay) {
        return t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = yesterday.toDateString() === t.toDateString();
      if (isYesterday) {
        return '昨天 ' + t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      const sameYear = now.getFullYear() === t.getFullYear();
      const mm = String(t.getMonth() + 1).padStart(2, '0');
      const dd = String(t.getDate()).padStart(2, '0');
      const hh = String(t.getHours()).padStart(2, '0');
      const mi = String(t.getMinutes()).padStart(2, '0');
      if (sameYear) {
        return `${mm}-${dd} ${hh}:${mi}`;
      }
      return `${t.getFullYear()}-${mm}-${dd} ${hh}:${mi}`;
    }

    // ========== 消息显示 ==========
    function addMessage(role, text, images = [], skipAppend = false, createdAt = null) {
      // 双管道分离：tool 消息只走 DB 管道，不渲染到对话框
      if (role === 'tool') return null;
      // === 新增：subagent_msg 特殊渲染（主↔子 Agent 对话，区别于用户↔主 Agent） ===
      if (role === 'subagent_msg') {
        _inSubagentRender = true;  // I5：标记子 Agent 渲染中——其不可解析时回退 addMessage('assistant')，不得被迷你捕获
        try {
          return addSubagentMessage(text, skipAppend, createdAt);
        } finally {
          _inSubagentRender = false;
        }
      }
      const div = document.createElement('div');
      div.className = `message ${role}`;
      // 时间戳气泡：仅有 createdAt 的消息显示（DB 版本消息）
      if (createdAt) {
        div.dataset.timestamp = createdAt;
        const bubble = document.createElement('span');
        bubble.className = 'timestamp-bubble';
        bubble.textContent = formatRelativeTime(createdAt) || '';
        div.appendChild(bubble);
      }
      
      // 所有消息统一走 Markdown 渲染（包括含图片的消息）
      // Markdown 图片 ![描述](路径) 由 marked.js 渲染，然后后处理添加交互
      if (text) {
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        // assistant 消息用 markdown 渲染，其他角色纯文本
        if (role === 'assistant' && typeof marked !== 'undefined') {
          try {
            // Pre-process: 用括号平衡算法编码本地路径中的空格和括号
            // 简单正则 [^)]* 遇到路径中 ) 就截断（如 硅基银行项目 (2).docx）
            const safeText = encodeLocalPaths(text);
            const htmlContent = typeof DOMPurify !== 'undefined'
              ? DOMPurify.sanitize(marked.parse(safeText), {
                  ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|file):|\/|[A-Za-z]:\\|[a-z+.-]+(?:[^a-z+.-:]))(?:[^"<>]|$)/i
                })
              : marked.parse(safeText);
            textDiv.innerHTML = htmlContent;
            // 后处理：将本地路径图片转为 file:/// URL 并添加交互
            textDiv.querySelectorAll('img').forEach(img => {
              let src = img.getAttribute('src');
              // 兼容模型输出 file:/// 前缀：去掉后统一由下面的逻辑处理
              if (src && src.startsWith('file:///')) {
                try { src = decodeURIComponent(src.replace('file:///', '')); } catch { /* malformed %，保持原样 */ }
                img.setAttribute('src', src);
              } else if (src && src.startsWith('file://')) {
                try { src = decodeURIComponent(src.replace('file://', '')); } catch { /* 同上 */ }
                img.setAttribute('src', src);
              }
              if (src && /^[A-Za-z]:[\/]/.test(src)) {
                const decoded = (() => { try { return decodeURIComponent(src); } catch { return src; } })();
                const encodedPath = decoded.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
                img.setAttribute('src', 'file:///' + encodedPath);
              } else if (src && /^\//.test(src)) {
                // decodeURIComponent 还原 marked 已编码的中文，避免 encodeURIComponent 双重编码
                const decoded = (() => { try { return decodeURIComponent(src); } catch { return src; } })();
                const encodedPath = decoded.split('/').map(encodeURIComponent).join('/');
                img.setAttribute('src', 'file://' + encodedPath);
              }
              // 给本地路径图片添加 chat-image class（自适应缩放）
              if (src && (/^[A-Za-z]:[\/]/.test(src) || /^\//.test(src) || src.startsWith('file://'))) {
                img.classList.add('chat-image');
              }
              // 添加双击用系统查看器打开
              const imgSrc = img.getAttribute('src') || src;
              if (imgSrc) {
                // 从 file:/// URL 还原本地路径，或直接使用原始路径
                let localPath = src || '';
                if (localPath.startsWith('file:///')) {
                  try { localPath = decodeURIComponent(localPath.replace('file:///', '')); } catch { /* malformed % */ }
                }
                if (localPath && /^[A-Za-z]:/.test(localPath)) {
                  img.dataset.filePath = localPath;
                  img.style.cursor = 'pointer';
                  img.addEventListener('dblclick', () => {
                    window.electronAPI.openWithSystemViewer(localPath);
                  });
                } else if (localPath && /^\//.test(localPath)) {
                  img.dataset.filePath = localPath;
                  img.style.cursor = 'pointer';
                  img.addEventListener('dblclick', () => {
                    window.electronAPI.openWithSystemViewer(localPath);
                  });
                }
              }
            });
            // 后处理：本地路径文件链接添加点击打开功能
            textDiv.querySelectorAll('a').forEach(a => {
              let href = a.getAttribute('href') || '';
              // 剥离 file:/// 前缀
              if (href.startsWith('file:///')) {
                href = href.replace('file:///', '');
              } else if (href.startsWith('file://')) {
                href = href.replace('file://', '');
              }
              // marked.js 会将中文路径编码为 %XX，需要解码
              try { href = decodeURIComponent(href); } catch(e) {}
              // 判断是否为本地路径（绝对路径）— macOS 以 / 开头，Windows 以 C: 开头
              if (href && (/^[A-Za-z]:[\/]/.test(href) || /^\//.test(href))) {
                a.setAttribute('data-file-path', href);
                a.setAttribute('href', '#');
                a.classList.add('local-file-link');
                a.addEventListener('click', (e) => {
                  e.preventDefault();
                  const filePath = a.getAttribute('data-file-path');
                  if (filePath && window.electronAPI && window.electronAPI.openWithSystemViewer) {
                    window.electronAPI.openWithSystemViewer(filePath);
                  }
                });
              }
            });
          } catch (e) {
            console.warn('[Chat] Markdown 渲染失败，降级为纯文本:', e);
            textDiv.textContent = text;
          }
        } else {
          textDiv.textContent = text;
        }
        div.appendChild(textDiv);
      }
      
      if (!skipAppend) {
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
      // I5：迷你消息同步——按消息源 role 捕获主对话最后一条 role=assistant（钩挂在既有追加路径汇合点，
      // addMessageWithId / refreshFromDB / loadHistory 均经此）。禁止按渲染后 DOM class 过滤：
      // subagent_msg 不可解析时回退 addMessage('assistant')，按 DOM 类取数会误捞子 Agent 内容。
      if (role === 'assistant' && !_inSubagentRender && !skipAppend) {
        miniLastAssistant = { text: text || '', ts: Date.now() };
        scheduleMiniUpdate();
      }
      return div;
    }

    // ========== subagent_msg 渲染（主↔子 Agent 对话侧边卡片） ==========
    function addSubagentMessage(text, skipAppend = false, createdAt = null) {
      // 解析格式：@目标 [发送者名] 内容
      const match = text.match(/^@(\S+)(?:\s+\[([^\]]+)\])?\s*(.*)$/s);
      if (!match) {
        return addMessage('assistant', text, [], skipAppend, createdAt);
      }
      const target = match[1];
      const sender = match[2] || '';
      const content = match[3].trim();

      // 方向：sender → target（无 sender 时只显示 → target）
      const direction = sender ? `${sender} → ${target}` : `→ ${target}`;

      const div = document.createElement('div');
      div.className = 'message subagent-msg';
      div.innerHTML = `
        <div class="subagent-direction">${escapeHtml(direction)}</div>
        <div class="subagent-content">${escapeHtml(content)}</div>
      `;
      // 时间戳气泡：subagent_msg 也是 DB 消息，需要显示时间戳
      if (createdAt) {
        div.dataset.timestamp = createdAt;
        const bubble = document.createElement('span');
        bubble.className = 'timestamp-bubble';
        bubble.textContent = formatRelativeTime(createdAt) || '';
        div.appendChild(bubble);
      }
      if (!skipAppend) {
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
      return div;
    }

    // HTML 转义辅助函数
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addMessageWithId(role, text, id, images = [], createdAt = null) {
      // 检查是否已存在相同ID的消息，避免重复
      const existing = document.querySelector(`.message[data-id="${id}"]`);
      if (existing) {
        console.log('[Chat] 消息已存在，跳过重复:', id);
        return existing;
      }
      const div = addMessage(role, text, images, false, createdAt);
      if (!div) return null;
      div.dataset.id = id;
      return div;
    }
    
    // ========== 进度条 ==========
    function showProgress(text, percent) {
      progressText.textContent = text;
      progressFill.style.width = percent + '%';
      progressPercent.textContent = percent + '%';
      progressBar.classList.add('show');
    }
    
    function hideProgress() {
      progressBar.classList.remove('show');
    }
    
    // 示例：模拟进度条（实际应从后端获取）
    // showProgress('处理中...', 45);
    // setTimeout(() => hideProgress(), 2000);
    
    // ========== 脑区状态侧滑面板 ==========
    const BRAIN_STATES = [
      { activation: 0.0, dot: '⚫', group: 2 },
      { activation: 1.0, dot: '🟢', group: 0 },
      { activation: 0.5, dot: '🟡', group: 1 },
    ];
    let _brainRegions = [];           // 缓存后端返回的脑区状态
    let _pendingBrainChanges = {};   // { label: stateIdx } 用户待提交的改动
    let _prevBrainState = new Map();  // label → 'light'|'dim'|'off'，用于变化检测
    let _brainStateInitialized = false;  // 首次加载标志，true 后才触发动画
    let _brainRegionFetchPending = false;  // SSE 事件 pending 标志（Task 5 使用，必须在顶层声明供 fetchBrainRegions finally 块访问）

    const brainPanel = document.getElementById('brainPanel');
    const brainOverlay = document.getElementById('brainOverlay');
    const brainTriggerZone = document.getElementById('brainTriggerZone');
    const brainList = document.getElementById('brainList');

    // F2-003 修复：HTML 转义防止 label 中特殊字符破坏 DOM
    // 复用 chat.html:1106 已有的 escapeHtml() 函数，不重复定义

    function renderBrainList() {
      if (!_brainRegions || _brainRegions.length === 0) {
        brainList.innerHTML = '<div class="brain-empty">暂无脑区数据</div>';
        return;
      }

      // Build display list: use pending changes if any, else use cached state
      const displayList = _brainRegions.map(r => {
        const label = r.label || r.name;
        let stateIdx;
        if (label in _pendingBrainChanges) {
          stateIdx = _pendingBrainChanges[label];
        } else {
          // Map activation to state index
          if (r.activation > 0.7) stateIdx = 1;       // green
          else if (r.activation > 0.3) stateIdx = 2;   // yellow
          else stateIdx = 0;                            // black
        }
        return { label, stateIdx };
      });

      // Sort by group: green(0) → yellow(1) → black(2)
      displayList.sort((a, b) => BRAIN_STATES[a.stateIdx].group - BRAIN_STATES[b.stateIdx].group);

      // Render
      let html = '';
      let lastGroup = -1;
      const groupLabels = ['🟢 点亮', '🟡 调暗', '⚫ 关闭'];
      // R8 标注（用户 2026-08-15 澄清的正确语义）：调暗改的是真实激活值——无触发条件时保持——
      // 后续对话命中该脑区（触发条件）才重新点亮——不是"仅本回合有效"
      const groupTips = [
        '',
        '手动调暗直接修改该脑区的激活状态；若后续对话命中该脑区（触发条件），将重新点亮',
        '',
      ];
      for (const item of displayList) {
        const s = BRAIN_STATES[item.stateIdx];
        if (s.group !== lastGroup) {
          const tip = groupTips[s.group];
          html += `<div class="brain-group-label"${tip ? ` title="${tip}"` : ''}>${groupLabels[s.group]}</div>`;
          lastGroup = s.group;
        }
        const cls = s.group === 2 ? 'brain-item off' : 'brain-item';
        const escapedLabel = escapeHtml(item.label);
        html += `<div class="${cls}" data-label="${escapedLabel}">
          <span class="dot">${s.dot}</span>
          <span class="name">${escapedLabel}</span>
        </div>`;
      }
      brainList.innerHTML = html;

      // Attach click handlers
      brainList.querySelectorAll('.brain-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const label = el.dataset.label;
          // Find current state in displayList
          const item = displayList.find(d => d.label === label);
          if (!item) return;
          // Cycle: 0(black) → 1(green) → 2(yellow) → 0(black)
          const nextIdx = (item.stateIdx + 1) % 3;
          _pendingBrainChanges[label] = nextIdx;
          renderBrainList();
        });
      });
    }

    // F2-001 修复：页面初始化时定位触发区到 .messages 区域，并启用 pointer-events
    function positionBrainElements() {
      const msgEl = document.getElementById('messages');
      if (!msgEl) return;
      const rect = msgEl.getBoundingClientRect();
      const containerRect = msgEl.parentElement.getBoundingClientRect();
      const top = rect.top - containerRect.top;
      const height = rect.height;
      brainTriggerZone.style.top = top + 'px';
      brainTriggerZone.style.height = height + 'px';
      brainTriggerZone.style.bottom = 'auto';
      brainTriggerZone.style.pointerEvents = 'auto';
      brainOverlay.style.top = top + 'px';
      brainOverlay.style.height = height + 'px';
      brainOverlay.style.bottom = 'auto';
      brainPanel.style.top = top + 'px';
      brainPanel.style.height = height + 'px';
      brainPanel.style.bottom = 'auto';
      // 鬼火动画容器：对齐 .messages 顶部，偏移 16px
      const sparkContainer = document.getElementById('brainSparkContainer');
      if (sparkContainer) {
        sparkContainer.style.top = (top + 16) + 'px';
        sparkContainer.style.bottom = 'auto';
      }
    }
    // 页面加载后立即定位（不等 showBrainPanel）
    positionBrainElements();
    // 窗口 resize 时重新定位
    window.addEventListener('resize', positionBrainElements);

    function showBrainPanel() {
      // 每次显示时重新定位（.messages 高度可能因内容变化而改变）
      positionBrainElements();
      brainPanel.classList.add('visible');
      brainOverlay.classList.add('visible');
      fetchBrainRegions();  // 面板打开时拉取最新快照
      renderBrainList();
    }

    function hideBrainPanel() {
      brainPanel.classList.remove('visible');
      brainOverlay.classList.remove('visible');
    }

    // Trigger: mouse enters right edge of messages area
    brainTriggerZone.addEventListener('mouseenter', showBrainPanel);
    // Hide: mouse leaves the panel+trigger zone area
    // F004 修复：不监听 messages mouseleave（面板在 messages 外部，移到面板会触发 mouseleave）
    // 改为监听面板和触发区的 mouseleave，但给一个短暂延迟避免误触
    let _brainHideTimer = null;
    function scheduleHideBrainPanel() {
      _brainHideTimer = setTimeout(() => {
        hideBrainPanel();
        _brainHideTimer = null;
      }, 200);
    }
    function cancelHideBrainPanel() {
      if (_brainHideTimer) {
        clearTimeout(_brainHideTimer);
        _brainHideTimer = null;
      }
    }
    brainTriggerZone.addEventListener('mouseleave', scheduleHideBrainPanel);
    brainPanel.addEventListener('mouseleave', scheduleHideBrainPanel);
    brainPanel.addEventListener('mouseenter', cancelHideBrainPanel);
    brainTriggerZone.addEventListener('mouseenter', cancelHideBrainPanel);
    // Click overlay to hide
    brainOverlay.addEventListener('click', hideBrainPanel);

    let _fetchingBrainRegions = false;
    async function fetchBrainRegions() {
      // F003 修复：防并发，避免每次工具调用都触发请求
      if (_fetchingBrainRegions) return;
      _fetchingBrainRegions = true;
      try {
        // 通过 IPC 调后端（file:// 协议下不能直接 fetch 相对路径）
        const data = await window.electronAPI.getBrainRegions();
        if (data && data.status === 'ok' && data.regions) {
          // 变化检测：对比新旧状态，触发鬼火动画
          const newRegions = data.regions;
          for (const r of newRegions) {
            const label = r.label || r.name;
            // 计算新状态：light(>0.7) / dim(>0.3) / off(≤0.3)
            let newState;
            if (r.activation > 0.7) newState = 'light';
            else if (r.activation > 0.3) newState = 'dim';
            else newState = 'off';

            const oldState = _prevBrainState.get(label);

            // 首次加载只记录状态，不触发动画
            if (_brainStateInitialized) {
              // off→light：点亮动画
              if ((!oldState || oldState === 'off') && newState === 'light') {
                showLight(label);
              }
              // light→off 或 dim→off：熄灭动画
              // （dim 是 light 衰减的中间态，从 dim 到 off 用户看到的也是"熄灭"）
              else if ((oldState === 'light' || oldState === 'dim') && newState === 'off') {
                showExtinguish(label);
              }
              // light→dim、dim→light、off→dim：不播动画（用户要求绿→黄不需要动画）
            }

            // 更新状态记录
            _prevBrainState.set(label, newState);
          }

          // 首次加载完成，标记已初始化
          _brainStateInitialized = true;

          _brainRegions = newRegions;
          // F006 修复：清理 _pendingBrainChanges 中已不存在的脑区 label
          const validLabels = new Set(newRegions.map(r => r.label || r.name));
          for (const label of Object.keys(_pendingBrainChanges)) {
            if (!validLabels.has(label)) {
              delete _pendingBrainChanges[label];
            }
          }
          // 面板打开时刷新显示
          if (brainPanel.classList.contains('visible')) {
            renderBrainList();
          }
        }
      } catch (e) {
        console.error('加载脑区状态失败:', e);
      } finally {
        _fetchingBrainRegions = false;
        // 如果 fetch 期间有新的 SSE 事件到达，重跑一次确保最终状态被检测
        if (_brainRegionFetchPending) {
          _brainRegionFetchPending = false;
          setTimeout(() => fetchBrainRegions(), 0);
        }
      }
    }
    // ========== 脑区鬼火动画控制 ==========
    /**
     * 点亮一个脑区——创建鬼火元素追加到点亮区。
     * 动画结束后 remove 元素（与 showExtinguish 保持一致，防止长会话累积不可见元素）。
     * @param {string} label — 脑区名称
     */
    function showLight(label) {
      const zone = document.getElementById('sparkLightZone');
      if (!zone) return;
      const spark = document.createElement('div');
      spark.className = 'brain-spark spark-light';
      spark.innerHTML = '<div class="spark-core"></div><div class="spark-label">' + escapeHtml(label) + '</div>';
      zone.appendChild(spark);
      setTimeout(function() { spark.remove(); }, 2600);
    }

    /**
     * 熄灭一个脑区——创建鬼火元素追加到熄灭区。
     * 动画结束后 remove 元素（不留占位）。
     * @param {string} label — 脑区名称
     */
    function showExtinguish(label) {
      const zone = document.getElementById('sparkExtinguishZone');
      if (!zone) return;
      const spark = document.createElement('div');
      spark.className = 'brain-spark spark-extinguish';
      spark.innerHTML = '<div class="spark-core"></div><div class="spark-label">' + escapeHtml(label) + '</div>';
      zone.appendChild(spark);
      setTimeout(function() { spark.remove(); }, 2600);
    }

    /** 清空所有鬼火元素（聊天清空时调用） */
    function clearSparks() {
      const lz = document.getElementById('sparkLightZone');
      const ez = document.getElementById('sparkExtinguishZone');
      if (lz) lz.innerHTML = '';
      if (ez) ez.innerHTML = '';
    }

    async function submitBrainChanges() {
      const labels = Object.keys(_pendingBrainChanges);
      if (labels.length === 0) return;

      const regions = labels.map(label => ({
        label,
        activation: BRAIN_STATES[_pendingBrainChanges[label]].activation,
      }));

      // 通过 IPC 提交（file:// 协议下不能直接 fetch）
      // F2-002: main.js apiRequest 已有 30s 超时保护
      try {
        const result = await window.electronAPI.updateBrainRegions(regions);
        if (result && result.status === 'ok') {
          _pendingBrainChanges = {};
        } else {
          console.error('提交脑区状态失败:', result);
        }
      } catch (e) {
        console.error('提交脑区状态失败:', e);
      }
    }

    // 压缩 usage 渲染代际守卫：压缩完成瞬间 finally 先发保底 done(无 usage) 触发 loadStats，
    // 该 GET /api/stats 在服务端 reset_tokens 之前被处理、返回压缩前旧值——若其响应晚于
    // 最新压缩 usage 渲染到达，旧值会覆盖新值。用「本次 fetch 发起时间」vs「最近 usage 渲染
    // 时间戳」判定丢弃（fetchTs 必须为本请求局部变量——共享全局会在并发 loadStats 时
    // 被后发请求覆盖，导致先发响应误判新鲜）。
    let _compactUsageTs = 0;    // 最近一次压缩 usage 渲染时间戳（Date.now()）

    // 渲染上下文使用率圆环（loadStats 与 compact_status done 共用）
    // cacheHit：缓存命中率 0-1；null/undefined=未知（服务端未返回）→ 元素整体隐藏；0=真实零命中照常显示
    function renderContextUsage(usage, cacheHit) {
      const arc = document.getElementById('context-usage-arc');
      const text = document.getElementById('context-usage-text');
      if (!arc || !text) return;
      const hitEl = document.getElementById('context-cache-hit');
      if (hitEl) {
        // null/undefined=未知（服务端未返回）→ 元素整体不渲染不留空位；0=真实零命中 → 显示「缓存 0%」
        const known = typeof cacheHit === 'number' && isFinite(cacheHit);
        hitEl.textContent = known ? ' 缓存 ' + Math.round(cacheHit * 100) + '%' : '';
        hitEl.style.display = known ? '' : 'none';
      }
      const usageVal = usage || 0;
      const pct = Math.round(usageVal * 100);
      const circumference = 2 * Math.PI * 8; // 50.27
      arc.setAttribute('stroke-dashoffset', circumference * (1 - usageVal));
      // 颜色：<70% 绿色，70-80% 黄色，≥80% 红色
      let color;
      if (pct < 70) color = '#4CAF50';
      else if (pct < 80) color = '#FF9800';
      else color = '#F44336';
      // 压缩中不改 arc stroke 和 text color（由 compact_status 事件控制为红色）
      if (!window._compacting) {
        arc.setAttribute('stroke', color);
        text.textContent = pct + '%';
        text.style.color = color;
      } else {
        // 压缩中：百分比照常更新，但颜色保持红色
        text.textContent = pct + '%';
      }
    }

    // ========== 加载统计数据 ==========
    async function loadStats(agentName) {
      try {
        // 未显式指定时跟随当前 tab：子 Agent tab 激活刷新其使用率，主对话刷新主 Agent
        const target = agentName !== undefined ? agentName : (_activeTab === 'main' ? '' : _activeTab);
        const fetchTs = Date.now();  // 本请求发起时间（渲染代际守卫用，局部防并发覆盖）
        const result = await window.electronAPI.getStats(target || '');
        if (result) {
          fileCount.textContent = result.files || 0;
          personCount.textContent = result.persons || 0;
          noteCount.textContent = result.notes || 0;
          // 更新上下文使用率（压缩 usage 代际守卫：主 Agent 目标受守卫——本请求 fetch 发起时间
          // 早于最新压缩 usage 渲染 → 跳过，防旧值覆盖；子 Agent 目标直接渲染不受守卫）
          if (target !== '' || fetchTs >= _compactUsageTs) {
            renderContextUsage(result.context_usage, result.context_cache_hit);
          }
        }
        // 并行拉取脑区状态（F003: 有防并发保护，不阻塞 stats 渲染）
        fetchBrainRegions();
      } catch (e) {
        console.error('加载统计失败:', e);
      }
    }
    
    // ========== 接收小女孩状态 ==========
    window.electronAPI.onSpiritState((state) => {
      if (state === 'busy') {
        // 在统计数据末尾追加"处理中"，保留原有统计信息
        const statsDiv = statusBar.querySelector('.stats');
        let busyEl = document.getElementById('stats-busy');
        if (!busyEl) {
          busyEl = document.createElement('span');
          busyEl.id = 'stats-busy';
          busyEl.className = 'stat';
          busyEl.textContent = '⏳ 处理中...';
          statsDiv.appendChild(busyEl);
        }
      } else if (state === 'idle') {
        // 移除"处理中"指示器
        const busyEl = document.getElementById('stats-busy');
        if (busyEl) busyEl.remove();
        loadStats();
      }
    });

    // 监听提醒通知（scheduler 触发的定时任务，消息已通过数据库+SSE显示）
    window.electronAPI.onAlert(() => {
      console.log('[Chat] 收到提醒通知');
    });

    // 监听工具调用状态（实时显示 Agent 正在做什么）
    window.electronAPI.onToolStatus((data) => {
      updateStatusBubble(data);
      // 每个工具调用刷新 token 使用率（_last_prompt_tokens 在 LLM 响应后已实时更新）
      // 子 Agent 工具调用不触发 onToolStatus（_is_subagent 守卫），不会污染主窗口
      loadStats();
    });

    // === 压缩状态：圆环旋转 + tooltip + 文本红色 ===
    if (window.electronAPI && window.electronAPI.onCompactStatus) {
      window.electronAPI.onCompactStatus((data) => {
        const arc = document.getElementById('context-usage-arc');
        const animate = arc ? arc.querySelector('animateTransform') : null;
        const text = document.getElementById('context-usage-text');
        const wrapper = document.getElementById('context-usage');
        if (data.status === 'started') {
          window._compacting = true;  // 先设标志，防止 loadStats 覆盖
          if (animate) animate.beginElement();
          if (text) text.style.color = '#F44336';
          if (wrapper) wrapper.title = '正在压缩对话…';
        } else if (data.status === 'done') {
          if (animate) animate.endElement();
          if (wrapper) wrapper.title = '上下文使用率';
          window._compacting = false;  // 最后清标志，让渲染恢复颜色
          // 压缩完成后刷新使用率：后端推送 usage 直接渲染（标记代际，丢弃并发旧 fetch 响应）；
          // 未推送（主 Agent 超阈值路径）走 loadStats 全量估算
          if (typeof data.usage === 'number') {
            _compactUsageTs = Date.now();  // 标记最新压缩 usage 渲染代际
            renderContextUsage(data.usage);
          } else {
            loadStats('');
          }
        }
      });
    }

    // 监听入库进度SSE事件（由后端pipeline watcher推送）
    // ingest-started：显示进度条并开始轮询
    // ingest-completed：隐藏进度条
    let ingestPollTimer = null;
    const INGEST_POLL_INTERVAL = 3000;
    const INGEST_PROGRESS_API = 'http://127.0.0.1:9876/api/kg/pipeline_status';

    async function pollIngestProgress() {
      try {
        const resp = await fetch(INGEST_PROGRESS_API);
        const data = await resp.json();
        if (data.busy) {
          showProgress('处理中...', data.progress);
        } else {
          hideProgress();
          stopIngestPolling();
        }
      } catch (e) {
        console.debug('[Chat] ingest poll failed:', e.message);
      }
    }

    function startIngestPolling() {
      if (ingestPollTimer) return;
      pollIngestProgress();
      ingestPollTimer = setInterval(pollIngestProgress, INGEST_POLL_INTERVAL);
    }

    function stopIngestPolling() {
      if (ingestPollTimer) {
        clearInterval(ingestPollTimer);
        ingestPollTimer = null;
      }
    }

    window.electronAPI.onIngestStarted(() => {
      console.log('[Chat] ingest-started SSE event received');
      showProgress('处理中...', 0);
      startIngestPolling();
    });

    window.electronAPI.onIngestCompleted(() => {
      console.log('[Chat] ingest-completed SSE event received');
      hideProgress();
      stopIngestPolling();
      loadStats();
    });

    // 主 Agent ask_user 提问：消息式显示（assistant 消息），用户用主输入框回答——
    // 回答经 /api/chat/session 见缝插针分支直接注入 set_answer（不走补充队列，无卡片/DOM 输入框）
    if (window.electronAPI && window.electronAPI.onAskUser) {
      window.electronAPI.onAskUser((event) => {
        addMessage('assistant', (event.content || ''));
      });
    }

    // 脑区状态变更通知：收到 SSE 事件后拉取最新数据
    // fetchBrainRegions 内部有防并发守卫和面板可见性守卫
    if (window.electronAPI && window.electronAPI.onBrainRegionsChanged) {
      let _brainRegionChangeTimer = null;
      // 注意：_brainRegionFetchPending 在 Task 4 Step 1 中顶层声明（与 _fetchingBrainRegions 同级），
      // 不能在此 if 块内用 let 声明——fetchBrainRegions 的 finally 块在 if 块外部，无法访问块级作用域变量
      window.electronAPI.onBrainRegionsChanged(() => {
        // debounce 100ms：多个快速 SSE 事件合并为一次 fetch
        // 确保最后一次事件一定触发 fetch，不被防并发守卫丢弃
        if (_brainRegionChangeTimer) clearTimeout(_brainRegionChangeTimer);
        _brainRegionChangeTimer = setTimeout(() => {
          _brainRegionChangeTimer = null;
          if (_fetchingBrainRegions) {
            // 上一次 fetch 还在进行中，标记 pending，fetch 完成后会重跑
            _brainRegionFetchPending = true;
          } else {
            fetchBrainRegions();
          }
        }, 100);
      });
    }

    // 监听 LLM 调用错误（SSE 推送，⚠️ system 提示；不落库，刷新后自然消失）
    window.electronAPI.onLlmError((event) => {
      addMessage('system', '⚠️ ' + (event.error_msg || '模型调用失败'));
    });

    // 监听系统提示（E4-02 强制退出等——SSE 推送，⚠️ system 提示；不落库，刷新后自然消失）
    // 生产者（agent_loop L958/L1133/L1189）已自带 "⚠️ " 前缀——渲染层透传不追加，防 "⚠️ ⚠️" 双重
    window.electronAPI.onSystemNotice((event) => {
      addMessage('system', event.message || '⚠️ 系统提示');
    });

    // 监听 MCP 服务器加载失败（E4-08/E4-16——SSE 连接建立时拉取状态槽，每连接一次；简单提示，不落库）
    // E3 "首屏一次"节流模式同族：窗口会话内只显示一次（SSE 路径与轮询路径双源去重）
    let _mcpLoadFailuresShown = false;
    function _showMcpLoadFailures(failures) {
      if (_mcpLoadFailuresShown) return;
      if (!Array.isArray(failures) || failures.length === 0) return;
      _mcpLoadFailuresShown = true;
      const summary = failures.map(f => (f.server || '?') + '（' + (f.reason || '未知原因') + '）').join('、');
      addMessage('system', '⚠️ MCP 服务器加载失败：' + summary);
    }
    window.electronAPI.onMcpLoadFailures((event) => {
      _showMcpLoadFailures(event && event.failures);
    });

    // ========== 数据库$视图刷新 ==========
    let _refreshFromDBRunning = false;  // 防止并发调用
    let _refreshPending = false;
    async function refreshFromDB() {
      if (_refreshFromDBRunning) {
        _refreshPending = true;
        return;
      }
      _refreshFromDBRunning = true;
      try {
        // 收集DOM中已有的消息ID
        const existingIds = new Set();
        document.querySelectorAll('.message[data-id]').forEach(div => {
          existingIds.add(div.dataset.id);
        });

        // 从数据库获取最新消息
        const result = await window.electronAPI.getHistory(50);
        const msgs = result.messages || [];

        if (existingIds.size === 0) {
          // DOM中没有带data-id的消息（可能只有临时用户消息或为空）
          // 清空DOM，用数据库消息重建（类似loadHistory的初始化逻辑）
          messages.innerHTML = '';
          msgs.forEach(msg => {
            addMessageWithId(msg.role, msg.content, msg.id, [], msg.created_at);
          });
          if (msgs.length > 0) {
            oldestMessageId = msgs[0].id;
          }
          // V4: 状态机重置由SSE chat_idle事件控制，refreshFromDB不再重置状态
          messages.scrollTop = messages.scrollHeight;
          return;
        }

        // 正常去重逻辑：只添加比DOM中已有消息更新的消息
        // msgs 是按时间顺序排列（最旧在前），DOM 中已有的是中间某段
        // 找到第一条在DOM中已存在的消息位置，只处理它之后的消息
        let firstExistingIdx = -1;
        for (let i = 0; i < msgs.length; i++) {
          if (existingIds.has(msgs[i].id)) {
            firstExistingIdx = i;
            break;
          }
        }

        // 只添加已存在消息之后的消息（更新的消息）
        const startIdx = firstExistingIdx >= 0 ? firstExistingIdx : 0;

        let hasNew = false;
        for (let i = startIdx; i < msgs.length; i++) {
          const msg = msgs[i];
          if (!existingIds.has(msg.id)) {
            addMessageWithId(msg.role, msg.content, msg.id, [], msg.created_at);
            hasNew = true;
          }
        }

        if (hasNew) {
          // 只删除已被数据库版本替换的临时用户消息
          const dbUserTexts = new Set(
            msgs.filter(m => m.role === 'user').map(m => m.content)
          );
          document.querySelectorAll('.message.user:not([data-id])').forEach(div => {
            const text = div.querySelector('.message-text')?.textContent;
            if (dbUserTexts.has(text)) {
              div.remove();
            }
          });
          // 状态气泡始终保持在最底部
          const bubbleEl = document.getElementById('status-bubble');
          if (bubbleEl && bubbleEl.parentNode === messages) {
            messages.appendChild(bubbleEl);
          }
          messages.scrollTop = messages.scrollHeight;
          // 只在收到 assistant 消息时才隐藏 typing（用户消息入库不应关闭 typing）
          // 只检查新添加的消息（startIdx 之后），避免旧消息误触发
          // V4: 逐条推送模式下，中间轮次的assistant(tool_calls)不应重置状态机
          // 只有纯文本assistant（无tool_calls）出现时才表示任务完成
          // V4: 状态机重置由SSE chat_idle事件控制，refreshFromDB不再重置状态
          if (!oldestMessageId && msgs.length > 0) {
            oldestMessageId = msgs[0].id;
          }
        }
      } catch (e) {
        console.error('[Chat] 刷新消息失败:', e);
      } finally {
        _refreshFromDBRunning = false;
        if (_refreshPending) {
          _refreshPending = false;
          setTimeout(() => refreshFromDB(), 0);
        }
      }
    }

    // SSE通知：有新消息 → 从数据库刷新
    // V4: chat_busy/chat_idle 事件控制状态机，普通消息触发 refreshFromDB
    window.electronAPI.onNewMessage(async (data) => {
      // 阶段二：子 Agent 触发的消息（ask_main_agent 或完成通知），主 Agent 闲置时自动触发新一轮对话
      // db_monitor 链路 A 只在主 Agent 闲置（_chat_lock.locked()==false）时推 SSE
      // 所以前端收到时 isProcessing 必为 false（状态机持久化已确认）
      // 加兜底判断避免状态机延迟导致忙时触发
      if (data && data.role === 'subagent_msg' && data.source === 'subagent') {
        if (!isProcessing) {
          // content 格式 "[子名] 内容"——作为 message 参数传给 /api/chat/session
          // 后端 compat.py 写 user 消息到 db（作为最后一条 user 消息）+ 调 LLM
          // 不调 addMessage 本地渲染（避免重复——后端写 db 后会推 role=user SSE 让前端 refreshFromDB）
          // 直接调 sendMessageWithRetry 走 HTTP 路径（复用用户发消息的现有逻辑）
          const msgContent = data.content;
          sendMessageWithRetry(msgContent, '').catch(err => {
            console.error('[Stage2] 自动触发主 Agent 对话失败：', err);
          });
        } else {
          // 兜底：主 Agent 忙时（理论上不应发生，db_monitor 只在闲置时推 SSE）
          // 不触发，记录日志便于排查
          console.warn('[Stage2] 收到 subagent_msg SSE 但主 Agent 忙，消息可能已从队列 pop（边界场景）');
        }
        return;
      }
      if (data && data.role === 'chat_idle') {
        // Agent循环结束：重置状态机
        hideTyping();
        isProcessing = false;
        _miniBusySince = null;  // 迷你三态：本轮处理结束，回显最后一条 Agent 消息
        stopBtn.style.display = 'none';
        sendBtn.disabled = false;
        window.electronAPI.notifyBusy(false, 'chat');
        scheduleMiniUpdate();
      } else if (data && data.role === 'chat_busy') {
        // Agent循环开始：通知 spirit 进入忙碌状态
        isProcessing = true;
        _miniBusySince = Date.now();  // 迷你三态：SSE 驱动的处理轮开始（自动触发场景，无本地 showTyping）
        stopBtn.style.display = 'flex';
        window.electronAPI.notifyBusy(true, 'chat');
        scheduleMiniUpdate();
      } else {
        // 普通消息通知 → 从DB刷新渲染
        refreshFromDB();
      }
    });

    // 窗口恢复/获得焦点时主动查询 Agent 忙碌状态，同步停止按钮（兜底 isVisible 守卫移除后的场景）
    window.electronAPI.onSyncState(async () => {
      try {
        const status = await window.electronAPI.getChatStatus();
        // 窗口恢复轮询路径：MCP 加载失败状态槽（SSE 连接先于窗口建立时事件已随连接发出，
        // 窗口后开时靠轮询补拉——_showMcpLoadFailures 窗口会话级去重）
        if (status && Array.isArray(status.mcp_load_failures)) {
          _showMcpLoadFailures(status.mcp_load_failures);
        }
        if (status && status.busy) {
          stopBtn.style.display = 'flex';
          isProcessing = true;
          sendBtn.disabled = true;
          scheduleMiniUpdate();  // 迷你三态：兜底轮询改写了 isProcessing，同步迷你区（SSE 漏事件时不滞后）
        } else {
          stopBtn.style.display = 'none';
          isProcessing = false;
          sendBtn.disabled = false;
          // SSE 断连修复：后端报告空闲，但 spirit busyCount 可能因 chat_idle 丢失而卡 >0
          // 强制重置 spirit 引用计数，让小女孩回到 IDLE
          window.electronAPI.resetBusy();
          scheduleMiniUpdate();  // 迷你三态：兜底轮询改写了 isProcessing，同步迷你区（SSE 漏事件时不滞后）
        }
      } catch (e) {
        console.error('Failed to sync chat status:', e);
      }
    });

    // Escape 键：下拉框可见时优先关闭下拉框，否则停止当前 Agent 工作
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (slashDropdown.classList.contains('visible')) {
          e.preventDefault();
          hideSlashDropdown();
          return;
        }
        if (isProcessing && stopBtn.style.display === 'flex') {
          e.preventDefault();
          window.electronAPI.sendMessage('/stop');
        }
      }
    });

    // ========== 初始化 ==========
    let oldestMessageId = null;  // 用于加载更早的消息
    let isLoadingMore = false;   // 防止重复加载
    
    // 先加载历史消息
    loadHistory().then(() => {
      // 如果没有历史消息，显示欢迎语
      if (messages.children.length === 0) {
        addMessage('system', '妞妞已就绪！有什么可以帮你的？');
      }
      // 滚动到底部
      messages.scrollTop = messages.scrollHeight;
      loadStats();
      userInput.focus();
    });
    
    // ========== 拖放文件/图片处理 ==========
    // 绑定到整个 container：拖入窗口任意位置都生效
    const container = document.querySelector('.container');

    // 阻止默认拖放行为
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      container.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    // 拖入时添加视觉反馈
    container.addEventListener('dragenter', () => {
      container.classList.add('drag-over');
    });

    container.addEventListener('dragleave', (e) => {
      // 只有离开 container 区域时才移除高亮
      if (e.target === container || !container.contains(e.relatedTarget)) {
        container.classList.remove('drag-over');
      }
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      container.classList.remove('drag-over');

      // e.dataTransfer.files 在某些场景（拖入纯文本/URL）可能为 null，需防御
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;

      // Electron 33 废弃 File.path，必须用 webUtils.getPathForFile 经 preload 暴露的 getFilePath
      // 可选链防御：如果 preload 未加载（window.electronAPI 未定义），不会抛 TypeError 而是 map 出 undefined
      const paths = Array.from(files)
        .map(f => window.electronAPI?.getFilePath?.(f))
        .filter(Boolean);

      if (paths.length === 0) {
        // 有文件但拿不到路径——通常是 preload 未生效或 webUtils 异常，便于排查
        console.warn('[Chat] drop: 未获取到任何文件路径，可能 preload 未生效或 webUtils 异常');
        return;
      }

      insertTextToInput(paths.join(', '));
    });
    
    // 监听滚动，到顶部时加载更多
    messages.addEventListener('scroll', async () => {
      // 检查是否滚动到顶部
      if (messages.scrollTop < 50 && !isLoadingMore && oldestMessageId) {
        isLoadingMore = true;
        const oldScrollHeight = messages.scrollHeight;
        
        try {
          const result = await window.electronAPI.getHistory(20, oldestMessageId);
          const history = result.messages || result;  // 兼容新旧格式
          if (history && history.length > 0) {
            // 在顶部插入消息（history 已经是正序：最旧在前）
            // 保存插入参考节点：所有新消息插入到这个节点之前，保持正序
            const refNode = messages.firstChild;
            history.forEach(msg => {
              prependMessage(msg.role, msg.content, msg.id, refNode, msg.created_at);
            });
            // 更新最旧消息ID为刚加载的第一条（最旧的）
            oldestMessageId = history[0].id;
            // 保持滚动位置
            const newScrollHeight = messages.scrollHeight;
            messages.scrollTop = newScrollHeight - oldScrollHeight;
            console.log('[Chat] 加载了更多', history.length, '条历史消息，最旧ID:', oldestMessageId);
          } else {
            console.log('[Chat] 没有更多历史消息');
            oldestMessageId = null;  // 停止后续加载尝试
          }
        } catch (e) {
          console.error('[Chat] 加载更多失败:', e);
        }
        
        isLoadingMore = false;
      }
    });

    // 窗口获得焦点时，仅通知 spirit（不刷新消息，消息由 SSE 驱动）
    window.addEventListener('focus', async () => {
      window.electronAPI.notifyActivity();
    });

    // 加载历史消息
    async function loadHistory() {
      try {
        messages.innerHTML = '';
        oldestMessageId = null;

        const result = await window.electronAPI.getHistory(20);
        const history = result.messages || result;
        if (history && history.length > 0) {
          history.forEach(msg => {
            addMessageWithId(msg.role, msg.content, msg.id, [], msg.created_at);
          });
          oldestMessageId = history[0].id;
        }
      } catch (e) {
        console.error('[Chat] 加载历史失败:', e);
        addMessage('system', '妞妞已就绪！有什么可以帮你的？');
      }
    }
    // ========== 时间戳气泡定时刷新 ==========
    // 每 30 秒刷新已渲染消息的相对时间（刚刚 → X分钟前）
    setInterval(() => {
      document.querySelectorAll('.message[data-timestamp] .timestamp-bubble').forEach(bubble => {
        const msgDiv = bubble.parentElement;
        const ts = msgDiv.dataset.timestamp;
        if (ts) {
          const text = formatRelativeTime(ts);
          if (text) bubble.textContent = text;
        }
      });
    }, 30000);
    
    // 在顶部插入消息（用于加载更多历史）
    function prependMessage(role, content, id, refNode = null, createdAt = null) {
      // 去重：检查是否已存在相同ID的消息
      const existing = document.querySelector(`.message[data-id="${id}"]`);
      if (existing) return;

      // 复用 addMessage 的渲染逻辑（Markdown 图片由 marked.js 渲染）
      const div = addMessage(role, content, [], true, createdAt);  // skipAppend=true: 不做appendChild/scrollTop
      if (!div) return;
      div.dataset.id = id;
      messages.insertBefore(div, refNode || messages.firstChild);
    }

    // ===== 子 Agent Tab 管理 =====
    // 当前激活的 tab（'main' = 主对话，其余为子 Agent unique_name）
    let _activeTab = 'main';
    const tabBar = document.getElementById('tabBar');

    // 待关闭的子 Agent tab（用户正在查看时等切走后关闭）
    const _pendingCloseTabs = new Set();
    // @end 延迟关闭的 timer（uniqueName → timerId），用于 _closeSubagentTab 时清理
    const _endCloseTimers = new Map();
    // 子 Agent tab 下需隐藏的脑区面板元素
    const _BRAIN_ELEMENT_IDS = ['brainTriggerZone', 'brainOverlay', 'brainPanel', 'brainSparkContainer'];

    function _setBrainPanelVisible(visible) {
      _BRAIN_ELEMENT_IDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = visible ? '' : 'none';
      });
    }

    // @user 等待时输入栏黄色脉冲：仅当前激活 tab 处于 waiting 时启用
    function _syncInputAreaWaiting() {
      const inputArea = document.querySelector('.input-area');
      const activeTabEl = document.getElementById('tab-' + _activeTab);
      inputArea.classList.toggle('waiting', !!(activeTabEl && activeTabEl.classList.contains('waiting')));
    }

    // 发送补充信息后的等待态（§22）：placeholder 变更 + 发送按钮 disabled
    // 下一条事件到达时由 addSubagentMessageToTab 调 _setSubagentInputWaiting(false) 恢复
    let _subagentInputWaiting = false;
    let _subagentWaitingTab = null;

    function _setSubagentInputWaiting(waiting) {
      if (waiting) {
        // 清理上一个等待 tab 的 typing 气泡（防止跨 tab 等待冲突时孤儿气泡）
        if (_subagentInputWaiting && _subagentWaitingTab && _subagentWaitingTab !== _activeTab) {
          const oldBubble = document.getElementById('subagent-typing-' + _subagentWaitingTab);
          if (oldBubble) oldBubble.remove();
        }
        _subagentInputWaiting = true;
        _subagentWaitingTab = _activeTab;
        userInput.placeholder = '子 Agent 处理补充信息中...';
        sendBtn.disabled = true;
        // 子 Agent 容器内创建 typing 气泡（复用 .message.typing + .typing-dots 样式）
        const container = document.getElementById('messages-' + _activeTab);
        if (container) {
          const bubble = document.createElement('div');
          bubble.className = 'message typing';
          bubble.id = 'subagent-typing-' + _activeTab;
          bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
          container.appendChild(bubble);
          container.scrollTop = container.scrollHeight;
        }
      } else {
        // 先移除 typing 气泡（此时 _subagentWaitingTab 尚未清空）
        const bubbleTab = _subagentWaitingTab;
        if (bubbleTab) {
          const bubble = document.getElementById('subagent-typing-' + bubbleTab);
          if (bubble) bubble.remove();
        }
        _subagentInputWaiting = false;
        _subagentWaitingTab = null;
        _syncInputPlaceholder();
        sendBtn.disabled = false;
      }
    }

    // 输入栏 placeholder 跟随 tab 状态：主对话 / 子 Agent 默认 / @user 等待回答 / 发送后等待
    function _syncInputPlaceholder() {
      const activeTabEl = document.getElementById('tab-' + _activeTab);
      const tabWaiting = !!(activeTabEl && activeTabEl.classList.contains('waiting'));
      // 发送后等待态：仅当切到等待中的 tab 时显示等待文案+禁用，切到其他 tab 时恢复
      if (_subagentInputWaiting && _subagentWaitingTab === _activeTab) {
        userInput.placeholder = '子 Agent 处理补充信息中...';
        sendBtn.disabled = true;
      } else if (_subagentInputWaiting && _subagentWaitingTab !== _activeTab) {
        // 等待的是另一个 tab，当前 tab 正常可用
        if (_activeTab === 'main') userInput.placeholder = '说点什么...';
        else if (tabWaiting) userInput.placeholder = '子 Agent 正在等待你的回答...';
        else userInput.placeholder = '发送补充信息...';
        sendBtn.disabled = false;
      } else {
        if (_activeTab === 'main') userInput.placeholder = '说点什么...';
        else if (tabWaiting) userInput.placeholder = '子 Agent 正在等待你的回答...';
        else userInput.placeholder = '发送补充信息...';
        sendBtn.disabled = false;
      }
    }

    // 切换 tab：高亮切换 + 消息容器 display 切换 + 脑区面板显隐
    function switchTab(name) {
      const tabEl = document.getElementById('tab-' + name);
      if (!tabEl) return;
      const prevTab = _activeTab;
      _activeTab = name;

      // 用户切走一个 tab 时，如果它在待关闭列表里，延迟关闭
      if (prevTab !== name && _pendingCloseTabs.has(prevTab)) {
        setTimeout(() => {
          // 回调时再次检查用户是否又切回来了
          if (_activeTab !== prevTab) _closeSubagentTab(prevTab);
        }, 500);
      }

      // tab 高亮切换
      tabBar.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.id === 'tab-' + name);
      });

      // 消息容器 display:none/block 切换
      if (name === 'main') {
        messages.style.display = '';
        document.querySelectorAll('.messages-subagent').forEach(c => c.classList.remove('active'));
      } else {
        messages.style.display = 'none';
        document.querySelectorAll('.messages-subagent').forEach(c => {
          c.classList.toggle('active', c.id === 'messages-' + name);
        });
        // 消息区淡入动画（200ms）
        const container = document.getElementById('messages-' + name);
        if (container) {
          container.classList.remove('fading');
          void container.offsetWidth;  // 强制 reflow 以重启动画
          container.classList.add('fading');
          container.addEventListener('animationend', () => container.classList.remove('fading'), { once: true });
        }
      }

      // 脑区面板：子 Agent tab 隐藏，主对话恢复
      _setBrainPanelVisible(name === 'main');

      // 切到某 tab 即视为已读，消除红点
      setTabBadge(name, false);

      // 输入栏 waiting 状态跟随激活 tab
      _syncInputAreaWaiting();
      _syncInputPlaceholder();

      // 自动滚动 active tab 到 tab 栏可见区域
      tabEl.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });

      // 切换到子 Agent tab 时显示该子 Agent 的真实上下文使用率；切回主对话恢复主 Agent
      loadStats(name === 'main' ? '' : name);
    }

    // 创建子 Agent tab + 独立消息容器，并自动切换过去
    function createSubagentTab(uniqueName, displayName, isSync, skipLoading) {
      const existingTab = document.getElementById('tab-' + uniqueName);
      if (existingTab) {
        // 旧 tab 已结束（completed）或已出错（error）或待关闭（_pendingCloseTabs）→ 清空重用于新一轮
        const isReusable = existingTab.classList.contains('completed') || existingTab.classList.contains('error') || _pendingCloseTabs.has(uniqueName);
        if (!isReusable) {
          // 活跃残留分支（2026-09-03 续跑根因修复）：上一轮同名任务结束后 subagent_closed
          // 事件丢失或 3s 延迟关未触发时，旧 tab 停留在活跃态（无 completed/error、不在
          // _pendingCloseTabs）→ 旧代码在此静默 return → 续跑 subagent_started 到达时 no-op，
          // 新一轮事件虽流入旧容器却无任何"已重启"反馈，用户看到续跑没有标签页。
          // 异步派发路径已挡真重复 started（运行中同名 register ValueError → 不推 started），
          // 故此处安全：把残留 tab 重置为运行中而非放弃。同步/程序触发路径先广播 started 后
          // register——dup started 可达但影响仅短暂视觉（loading 至首事件），安全前提收窄。
          // 不切 tab、不清容器：残留容器保留上一轮内容可回看（旧内容之上自然追加新一轮事件）；
          // 即便万一误判真重复，也不清空正在显示的内容。
          existingTab.classList.remove('completed', 'error');  // 残留结束态清除（无也幂等）
          existingTab.classList.remove('waiting');  // 残留 waiting 态清除（无也幂等）
          existingTab.dataset.sync = isSync ? 'true' : 'false';  // 防跨类型同名残留 sync 标志陈旧
          if (!skipLoading) existingTab.classList.add('loading');
          // 容器无消息内容（空状态占位仍在）→ 刷新占位文案；有旧消息则不动容器
          const container = document.getElementById('messages-' + uniqueName);
          if (container) {
            const empty = container.querySelector('.tab-empty-state');
            if (empty && !container.querySelector('.message')) {
              empty.textContent = isSync ? `⏳ 子 Agent ${displayName} 工作中...` : `⏳ 子 Agent ${displayName} 正在启动...`;
            }
          }
          return;
        }
        // 取消 @end 延迟关闭 timer
        const timer = _endCloseTimers.get(uniqueName);
        if (timer) { clearTimeout(timer); _endCloseTimers.delete(uniqueName); }
        _pendingCloseTabs.delete(uniqueName);
        // 移除结束/等待/错误状态 + 同步标志，重设 loading
        existingTab.classList.remove('completed', 'waiting', 'error');
        existingTab.dataset.sync = isSync ? 'true' : 'false';
        if (!skipLoading) existingTab.classList.add('loading');
        // 清空消息容器，重建空状态占位
        const container = document.getElementById('messages-' + uniqueName);
        if (container) {
          container.innerHTML = '';
          const empty = document.createElement('div');
          empty.className = 'tab-empty-state';
          empty.textContent = isSync ? `⏳ 子 Agent ${displayName} 工作中...` : `⏳ 子 Agent ${displayName} 正在启动...`;
          container.appendChild(empty);
        }
        tabBar.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
        return;
      }

      // tab 元素（无 × 按钮，不可手动关闭）
      const tab = document.createElement('div');
      tab.className = 'tab new-tab' + (skipLoading ? '' : ' loading');  // loading 首条消息到达后移除（窗口恢复时跳过）
      tab.id = 'tab-' + uniqueName;
      tab.title = displayName;        // hover tooltip 显示全名
      tab.textContent = displayName;
      tab.addEventListener('click', () => switchTab(uniqueName));
      tab.dataset.sync = isSync ? 'true' : 'false';  // subagent_closed 时据此判断是否 hideTyping
      tab.addEventListener('animationend', () => tab.classList.remove('new-tab'), { once: true });

      // 未读红点 badge
      const badge = document.createElement('span');
      badge.className = 'badge';
      tab.appendChild(badge);

      tabBar.appendChild(tab);

      // 独立消息容器：作为 #messages 的兄弟元素插入（clearChat 只清 #messages，天然不受影响）
      const container = document.createElement('div');
      container.className = 'messages-subagent';
      container.id = 'messages-' + uniqueName;
      messages.parentNode.insertBefore(container, messages.nextSibling);

      // 空状态占位：首条事件到达后由 addSubagentMessageToTab 移除
      // 同步子 Agent 显示"工作中..."，异步子 Agent 显示"正在启动..."
      const empty = document.createElement('div');
      empty.className = 'tab-empty-state';
      empty.textContent = isSync ? `⏳ 子 Agent ${displayName} 工作中...` : `⏳ 子 Agent ${displayName} 正在启动...`;
      container.appendChild(empty);

      // 新 tab 创建后不自动切换，用户停留在主对话 tab
      // tab 栏滚动到可见区域
      tab.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    }

    // 向子 Agent tab 追加消息（独立渲染函数，不经过 addMessage，不影响主对话）
    // reply/question 为 LLM 输出：Markdown 渲染 + DOMPurify 净化（§9.1，与主 Agent assistant 消息一致）
    // 其余类型（system/thinking/tool_status/user）保持纯文本
    function addSubagentMessageToTab(uniqueName, cssClass, text) {
      const container = document.getElementById('messages-' + uniqueName);
      if (!container) return null;
      // 首条事件到达后移除空状态占位 + tab loading spinner
      const empty = container.querySelector('.tab-empty-state');
      if (empty) {
        empty.remove();
        const tabEl = document.getElementById('tab-' + uniqueName);
        if (tabEl) tabEl.classList.remove('loading');
      }

      // 追加前判断用户是否在底部附近（§4.3：用户上翻查看历史时不自动滚动）
      const nearBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;

      const div = document.createElement('div');
      div.className = 'message ' + cssClass;
      if ((cssClass === 'reply' || cssClass === 'question') && typeof marked !== 'undefined') {
        try {
          div.innerHTML = typeof DOMPurify !== 'undefined'
            ? DOMPurify.sanitize(marked.parse(text), {
                ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|file):|\/|[A-Za-z]:\\|[a-z+.-]+(?:[^a-z+.-:]))(?:[^"<>]|$)/i
              })
            : marked.parse(text);
        } catch (e) {
          console.error('子 Agent 消息 Markdown 渲染失败:', e);
          div.textContent = text;
        }
      } else {
        div.textContent = text;
      }
      container.appendChild(div);
      // thinking chain：内容超过 200px（max-height 限制）时显示展开按钮
      if (cssClass === 'thinking' && div.scrollHeight > div.clientHeight) {
        const expandBtn = document.createElement('button');
        expandBtn.className = 'thinking-expand-btn';
        expandBtn.textContent = '展开全部';
        expandBtn.addEventListener('click', () => {
          const expanded = div.classList.toggle('expanded');
          expandBtn.textContent = expanded ? '收起' : '展开全部';
        });
        container.appendChild(expandBtn);  // 兄弟元素，不在 overflow-y:auto 的 div 内
      }
      if (nearBottom) container.scrollTop = container.scrollHeight;

      // 下一条事件到达 → 解除发送后等待态（§22）
      if (cssClass !== 'user' && _subagentWaitingTab === uniqueName) {
        _setSubagentInputWaiting(false);
      }
      // 非激活 tab 收到 @user 提问 → 显示红点（其他消息类型不显示）
      if (_activeTab !== uniqueName && cssClass === 'question') setTabBadge(uniqueName, true);
      return div;
    }

    // ring buffer 补发满 100 条：容器顶部提示（§20，只显示一次）
    function showRingBufferHint(uniqueName) {
      const container = document.getElementById('messages-' + uniqueName);
      if (!container || container.querySelector('.ring-buffer-hint')) return;
      const hint = document.createElement('div');
      hint.className = 'message system ring-buffer-hint';
      hint.textContent = '仅显示最近 100 条事件，更早历史暂不可查';
      container.insertBefore(hint, container.firstChild);
    }

    // 子 Agent 完成（@end）：tab 半透明（CSS transition 300ms）
    function markTabCompleted(uniqueName) {
      const tab = document.getElementById('tab-' + uniqueName);
      if (tab) tab.classList.add('completed');
    }

    // 子 Agent 异常终止：tab 红色文字
    function markTabError(uniqueName) {
      const tab = document.getElementById('tab-' + uniqueName);
      if (tab) tab.classList.add('error');
    }

    // 子 Agent @user 提问等待：tab 闪烁 + 红点
    function markTabWaiting(uniqueName) {
      const tab = document.getElementById('tab-' + uniqueName);
      if (!tab) return;
      // 多个 tab 同时等待时，用 animation-delay 差异化闪烁节奏
      const waitingCount = tabBar.querySelectorAll('.tab.waiting').length;
      tab.style.animationDelay = (waitingCount * 0.15) + 's';
      tab.classList.add('waiting');
      setTabBadge(uniqueName, true);
      _syncInputAreaWaiting();
      _syncInputPlaceholder();  // 若当前激活此 tab：placeholder 变为"子 Agent 正在等待你的回答..."（§5.4）
    }

    // 用户已回答：取消闪烁 + 红点
    function clearTabWaiting(uniqueName) {
      const tab = document.getElementById('tab-' + uniqueName);
      if (!tab) return;
      tab.classList.remove('waiting');
      tab.style.animationDelay = '';
      setTabBadge(uniqueName, false);
      _syncInputAreaWaiting();
      _syncInputPlaceholder();  // 恢复正常 placeholder（§5.4）
    }

    // 未读红点显隐
    function setTabBadge(uniqueName, show) {
      const tab = document.getElementById('tab-' + uniqueName);
      const badge = tab && tab.querySelector('.badge');
      if (badge) badge.style.opacity = show ? '1' : '0';
    }

    // 关闭子 Agent tab：移除 tab 元素 + 消息容器 + 断开 SSE
    function _closeSubagentTab(uniqueName) {
      // 守卫：若 tab 已被复用为活跃新一轮（无 completed/error、不在待关闭列表），不关闭
      // 防 "用户停留 completed tab → 切走 → 500ms 内同 agent 任务复用 → 迟到的 switchTab 500ms 关闭误杀新 tab"
      const closeTab = document.getElementById('tab-' + uniqueName);
      if (closeTab && !closeTab.classList.contains('completed') && !closeTab.classList.contains('error') && !_pendingCloseTabs.has(uniqueName)) {
        return;  // 活跃 tab，禁止误杀
      }
      _pendingCloseTabs.delete(uniqueName);
      // 清理 @end 延迟关闭的 timer
      const timer = _endCloseTimers.get(uniqueName);
      if (timer) { clearTimeout(timer); _endCloseTimers.delete(uniqueName); }
      if (_subagentWaitingTab === uniqueName) _setSubagentInputWaiting(false);
      const tab = document.getElementById('tab-' + uniqueName);
      if (tab) tab.remove();
      const container = document.getElementById('messages-' + uniqueName);
      if (container) container.remove();
      // 如果关闭的是当前激活 tab，切回主对话
      if (_activeTab === uniqueName) {
        switchTab('main');
      }
      // 断开 SSE 连接
      if (window.electronAPI && window.electronAPI.disconnectSubagentSSE) {
        window.electronAPI.disconnectSubagentSSE(uniqueName);
      }
    }

    // ===== 子 Agent SSE 事件处理 =====

    // 子 Agent 启动：创建 tab + 建立 SSE 连接（SSE 连接由 main.js 收到事件后自动建立）
    if (window.electronAPI && window.electronAPI.onSubagentStarted) {
      window.electronAPI.onSubagentStarted((event) => {
        const uniqueName = event.unique_name;
        const displayName = event.agent_name || uniqueName;
        createSubagentTab(uniqueName, displayName, event.is_sync);
        // 同步子 Agent：主对话 tab 显示工作中状态（§11）
        if (event.is_sync) {
          showTyping('子 Agent 工作中...');
        }
      });
    }

    // 子 Agent 事件流
    if (window.electronAPI && window.electronAPI.onSubagentEvent) {
      window.electronAPI.onSubagentEvent(({ unique_name, event }) => {
        switch (event.type) {
          case 'tool_status':
            if (event.status === 'start') {
              addSubagentMessageToTab(unique_name, 'system', '🔧 ' + (event.tool_name || '工具'));
              // 子 Agent 每轮 LLM 请求已更新其真实使用率，当前 tab 是它时刷新圆环
              if (_activeTab === unique_name) loadStats(unique_name);
            } else {
              addSubagentMessageToTab(unique_name, 'system', '✅ ' + (event.tool_name || '工具') + (event.summary ? ' — ' + event.summary : ''));
            }
            break;
          case 'thinking_chain':
            addSubagentMessageToTab(unique_name, 'thinking', event.content);
            break;
          case 'reply':
            addSubagentMessageToTab(unique_name, 'reply', event.content);
            if (_activeTab === unique_name) loadStats(unique_name);
            break;
          case 'question':
            addSubagentMessageToTab(unique_name, 'question', event.content);
            markTabWaiting(unique_name);
            break;
          case 'subagent_suspended':
            addSubagentMessageToTab(unique_name, 'system', '子 Agent 等待主 Agent 回答中...');
            break;
          case 'subagent_error':
            addSubagentMessageToTab(unique_name, 'system', '子 Agent 异常终止' + (event.content ? '：' + event.content : ''));
            markTabError(unique_name);
            clearTabWaiting(unique_name);
            break;
          case 'subagent_closed':
            addSubagentMessageToTab(unique_name, 'system', event.content || '子 Agent 已结束');
            markTabCompleted(unique_name);
            clearTabWaiting(unique_name);
            // 同步子 Agent @end 时清理主对话"工作中"气泡（§11，仅同步子 Agent）
            const _tabEl = document.getElementById('tab-' + unique_name);
            if (_tabEl && _tabEl.dataset.sync === 'true') hideTyping();
            // @end 关闭逻辑：用户不在该 tab 时 3 秒后关闭；用户在该 tab 时等切走后关闭
            if (_activeTab === unique_name) {
              // 用户正在该 tab：标记待关闭，等用户切走后关闭
              _pendingCloseTabs.add(unique_name);
            } else {
              // 用户不在该 tab：3 秒后关闭（但如果用户又切回来了，改为等切走后关闭）
              const timer = setTimeout(() => {
                _endCloseTimers.delete(unique_name);
                if (_activeTab === unique_name) {
                  _pendingCloseTabs.add(unique_name);
                } else {
                  _closeSubagentTab(unique_name);
                }
              }, 3000);
              _endCloseTimers.set(unique_name, timer);
            }
            break;
          case 'reconnected':
            addSubagentMessageToTab(unique_name, 'system', '连接已恢复，正在补发历史事件...');
            break;
          case 'instruction':
            // 主 Agent 传给子 Agent 的指令/回答，渲染为子 Agent tab 消息
            addSubagentMessageToTab(unique_name, 'user', event.content);
            break;
          case 'user':
            // 用户自己的补充信息回声，已在本地渲染过，跳过
            break;
          default:
            // persist / system / tool_marker 是内部事件，不展示给用户
            break;
        }
        // P0: 收到非 question / 非 user 事件时停止 tab 闪烁（用户已回答，子 Agent 继续工作）
        // subagent_error / subagent_closed 已在各自 case 中调用，这里排除避免重复
        if (event.type !== 'question' && event.type !== 'user' &&
            event.type !== 'subagent_error' && event.type !== 'subagent_closed') {
          clearTabWaiting(unique_name);
        }
        // 非 user 事件到达：恢复发送后输入等待态（§22，仅当等待的正是这个 tab）
        // addSubagentMessageToTab 中已对非 user 事件处理，这里仅兜底未被渲染的事件类型
        if (event.type !== 'user' && _subagentWaitingTab === unique_name &&
            !['tool_status', 'thinking_chain', 'reply', 'question', 'user'].includes(event.type)) {
          _setSubagentInputWaiting(false);
        }
      });
    }

    // 窗口恢复：从 /api/subagents/running 重建子 Agent tabs + SSE 连接（§8）
    function restoreSubagentTabs() {
      if (!window.electronAPI) return;
      // TODO: 后续应通过 IPC (preload-chat.js getRunningSubagents) 获取端口，避免硬编码 9876
      // 当前与 INGEST_PROGRESS_API 保持一致，均使用硬编码端口
      fetch('http://127.0.0.1:9876/api/subagents/running')
        .then(r => r.json())
        .then(data => {
          const agents = Array.isArray(data) ? data : (data.subagents || []);
          agents.forEach(agent => {
            const uniqueName = agent.unique_name;
            if (!uniqueName) return;
            if (!document.getElementById('tab-' + uniqueName)) {
              createSubagentTab(uniqueName, agent.agent_type || uniqueName, agent.is_sync, true);  // skipLoading: 恢复的子 Agent 可能已完成，不会有新事件移除 loading
            }
            // 建立 SSE 连接（已连接的由 SubagentSSEManager 去重忽略）
            if (window.electronAPI.connectSubagentSSE) {
              window.electronAPI.connectSubagentSSE(uniqueName);
            }
          });
          // 恢复时不打断用户当前停留的标签页（tab+SSE 恢复仅补齐状态，不强制切回主对话 tab）
        })
        .catch(() => {});  // 后端未启动时静默失败
    }

    // 窗口获得焦点/显示时（sync-state）追加恢复调用
    // 独立注册新 listener（Electron IPC 支持多个 listener），不动现有 onSyncState 回调
    if (window.electronAPI && window.electronAPI.onSyncState) {
      window.electronAPI.onSyncState(() => {
        restoreSubagentTabs();
      });
    }

    // ===== 子 Agent Tab 管理结束 =====
  </script>
</body>
</html>
