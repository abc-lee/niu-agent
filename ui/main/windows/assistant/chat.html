<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>妞妞聊天</title>
  <!-- Markdown 渲染 -->
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <!-- HTML 净化 — 防止 XSS (marked 不自带 sanitize) -->
  <script src="../../node_modules/dompurify/dist/purify.js"></script>
  <script>
    // 配置 marked：保留换行，启用 GFM
    if (typeof marked !== 'undefined' && marked.setOptions) {
      marked.setOptions({ breaks: true, gfm: true });
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #faf8f0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      /* 字体由动态注入脚本覆盖；无配置时用浏览器系统默认 */
      /* 铅笔笔迹效果 */
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* 主容器 - 便签风格 */
    .container {
      width: 100%;
      height: 100%;
      background: #faf8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      /* 棉纸纹理 */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    }
    
    /* 调整大小手柄 */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
      z-index: 100;
      -webkit-app-region: no-drag;
    }
    .resize-handle::before {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(0,0,0,0.2);
      border-bottom: 2px solid rgba(0,0,0,0.2);
    }
    
    /* 标题栏 - 可拖动 */
    .header {
      padding: 12px 16px;
      background: #e7ca4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-bottom: 2px dashed rgba(0,0,0,0.1);
      -webkit-app-region: drag;
    }
    .header:active { cursor: grabbing; }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title .avatar {
      width: 28px;
      height: 42px;
      object-fit: contain;
    }
    .header-title span {
      font-size: 18px;
      font-weight: normal;
      color: #000;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.3px rgba(0,0,0,0.4);
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.25);
    }
    .close-btn {
      background: #f8a7c8;
      border: none;
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { 
      transform: scale(1.1);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    
    /* 消息区域 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: transparent;
    }
    .message {
      margin-bottom: 10px;
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      /* 保留换行符 */
      white-space: pre-wrap;
    }
    /* 时间戳气泡：hover 消息时显示 */
    .message[data-timestamp] {
      position: relative;
    }
    .timestamp-bubble {
      position: absolute;
      top: 4px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }
    .message:hover .timestamp-bubble {
      opacity: 1;
    }
    .message.user {
      background: #78b2be;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.1);
    }
    .message.assistant {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
    }
    /* subagent_msg：主↔子 Agent 对话侧边小卡片样式 */
    .message.subagent-msg {
      margin: 8px 16px;
      padding: 6px 10px;
      background: #f5f5f5;
      border-left: 3px solid #888;
      font-size: 0.85em;
      color: #555;
      border-radius: 4px;
    }
    .message.subagent-msg .subagent-direction {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 2px;
    }
    .message.subagent-msg .subagent-content {
      color: #333;
    }
    /* Markdown 渲染后的表格样式 */
    .message.assistant .message-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
    }
    .message.assistant .message-text th,
    .message.assistant .message-text td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .message.assistant .message-text th {
      background: #f5f5f5;
      font-weight: bold;
    }
    .message.assistant .message-text tr:nth-child(even) td {
      background: #fafafa;
    }
    .message.assistant .message-text code {
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 13px;
    }
    .message.assistant .message-text pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .message.assistant .message-text pre code {
      background: none;
      padding: 0;
    }
    .message.assistant .message-text ul,
    .message.assistant .message-text ol {
      padding-left: 20px;
      margin: 4px 0;
    }
    .message.assistant .message-text {
      white-space: normal;  /* markdown 渲染需要 normal，不能 pre-wrap */
    }
    .message.assistant .message-text blockquote {
      border-left: 3px solid #ccc;
      padding-left: 10px;
      color: #666;
      margin: 6px 0;
    }
    .message.system {
      background: #e9ecef;
      color: #000;
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      border-radius: 4px;
    }
    /* 定时任务消息：灰色背景，左对齐，带时钟图标 */
    .message.scheduled {
      background: #e9ecef;
      color: #555;
      font-size: 14px;
      border-radius: 4px;
      max-width: 85%;
    }
    .message.scheduled::before {
      content: '⏰ ';
      opacity: 0.7;
    }
    
    /* 正在输入动画 */
    .message.typing {
      background: white;
      color: #000;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      padding: 10px 14px;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #666;
      border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    /* 输入区域 */
    .input-area {
      padding: 12px;
      background: white;
      border-top: 2px dashed rgba(0,0,0,0.08);
      display: flex;
      gap: 8px;
    }
    .input-area textarea {
      flex: 1;
      padding: 10px 14px;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      font-family: inherit;
      font-size: 16px;
      background: rgba(255,255,255,0.8);
      color: #000;
      outline: none;
      /* 铅笔笔迹效果 */
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.35);
      resize: none;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-area textarea:focus { border-color: #78b2be; }
    .input-area { position: relative; }
    /* ========== 斜杠命令下拉框 ========== */
    .slash-dropdown {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 12px;
      right: 12px;
      background: #faf8f0;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      font-family: inherit;
      font-size: 14px;
    }
    .slash-dropdown.visible { display: block; }
    .slash-dropdown-item {
      padding: 8px 14px;
      cursor: pointer;
      color: #000;
      border-bottom: 1px dashed rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .slash-dropdown-item:last-child { border-bottom: none; }
    .slash-dropdown-item.selected {
      background: rgba(120, 178, 190, 0.2);
    }
    .slash-dropdown-item:hover {
      background: rgba(120, 178, 190, 0.15);
    }
    .slash-dropdown-item .cmd-name {
      font-weight: bold;
      white-space: nowrap;
    }
    .slash-dropdown-item .cmd-desc {
      color: #999;
      font-size: 12px;
      text-align: right;
    }
    .input-area button {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .input-area button:hover { 
      transform: translateY(-1px);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .stop-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-btn:hover {
      background: #c0392b;
    }
    
    /* 状态栏 */
    .status-bar {
      padding: 8px 16px;
      background: #faf8f0;
      border-top: 2px dashed rgba(0,0,0,0.05);
      font-size: 14px;
      color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .stats {
      display: flex;
      gap: 16px;
    }
    .status-bar .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .context-usage {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: default;
    }
    .context-usage svg {
      flex-shrink: 0;
    }
    .context-usage span {
      font-size: 11px;
      font-weight: 600;
      min-width: 28px;
    }
    .status-bar .graph-btn {
      background: #a3f0c2;
      color: #000;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      -webkit-text-stroke: 0.2px rgba(0,0,0,0.3);
    }
    .status-bar .status-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .status-bar .version-label {
      color: #999;
      font-size: 11px;
      padding: 4px 8px;
      font-family: inherit;
    }
    .status-bar .graph-btn:hover {
      background: #8de0a8;
    }
    
    /* 进度条 - 简洁不占地方 */
    .progress-bar {
      display: none;
      padding: 4px 12px;
      background: white;
      border-top: 1px dashed rgba(0,0,0,0.08);
      font-size: 13px;
      color: #000;
    }
    .progress-bar.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar .progress-track {
      flex: 1;
      height: 4px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .progress-fill {
      height: 100%;
      background: #78b2be;
      transition: width 0.3s ease;
    }
    .progress-bar .progress-text {
      min-width: 40px;
      text-align: right;
    }
    
    /* ========== 图片显示 ========== */
    .chat-image {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      cursor: pointer;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .chat-image:hover {
      transform: scale(1.02);
    }
    /* 本地文件链接样式 */
    .local-file-link {
      color: #1890ff;
      text-decoration: underline;
      cursor: pointer;
    }
    .local-file-link:hover {
      color: #40a9ff;
    }
    .local-file-link::before {
      content: '📎 ';
    }

    /* ========== 拖放上传 ========== */
    .container.drag-over {
      background-color: rgba(120, 178, 190, 0.1);
      outline: 2px dashed #78b2be;
    }
    /* ========== 状态气泡（工具调用实时显示） ========== */
    .status-bubble {
      background: white;
      color: #666;
      font-style: italic;
      padding: 10px 14px;
      border-bottom-left-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.08);
      animation: status-pulse 1.5s ease-in-out infinite;
      max-width: 80%;
      word-break: break-word;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    /* ===== 脑区状态侧滑面板 ===== */
    /* F001 修复：确保面板和触发区相对于 .messages 定位，而非 .container */
    .messages {
      position: relative;
    }
    .brain-trigger-zone {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 5;
      /* F2-001 修复：默认不可交互，由 JS 初始化时定位到 .messages 区域 */
      pointer-events: none;
    }
    .brain-overlay {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 175px;
      background: rgba(120, 80, 20, 0);
      transition: background 0.3s;
      z-index: 8;
      pointer-events: none;
    }
    .brain-overlay.visible {
      background: rgba(120, 80, 20, 0.15);
      pointer-events: auto;
    }
    .brain-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 175px;
      background: #fff8e1;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 200;
      box-shadow: -3px 0 10px rgba(180, 150, 50, 0.2);
      border-left: 2px dashed rgba(180, 150, 50, 0.3);
      font-size: 11px;
      color: #000;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseB'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseB)' opacity='0.06'/%3E%3C/svg%3E");
    }
    .brain-panel.visible {
      transform: translateX(0);
    }
    .brain-title {
      padding: 10px 12px 6px;
      border-bottom: 1px dashed rgba(180, 150, 50, 0.3);
      font-weight: bold;
      font-size: 11px;
      color: #8B6914;
      position: sticky;
      top: 0;
      background: #fff8e1;
      z-index: 1;
    }
    .brain-group-label {
      padding: 6px 12px 3px;
      font-size: 9px;
      color: #999;
      letter-spacing: 0.5px;
    }
    .brain-item {
      padding: 5px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .brain-item:hover {
      background: rgba(231, 202, 74, 0.15);
    }
    .brain-item .dot {
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1;
    }
    .brain-item .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brain-item.off {
      opacity: 0.45;
    }
    .brain-empty {
      padding: 20px 12px;
      text-align: center;
      color: #999;
      font-size: 11px;
    }
    /* ========== 脑区鬼火动画（点亮/熄灭） ========== */
    .brain-spark-container {
      position: absolute;
      /* top 由 JS positionBrainElements() 动态设置 */
      right: 12px;
      z-index: 250;  /* 高于 brain-panel z-index:200，防止面板打开时遮挡动画 */
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .spark-light-zone {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .spark-extinguish-zone {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .brain-spark {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      background: rgba(10, 30, 40, 0.75);
      border: 1px solid rgba(64, 224, 208, 0.35);
      border-radius: 16px;
      box-shadow: 0 0 6px 1px rgba(64, 224, 208, 0.2), 1px 1px 4px rgba(0,0,0,0.15);
      transform: translateZ(0);
    }
    .brain-spark .spark-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0fffe, #40e0d0 40%, #1a9b8a);
      box-shadow: 0 0 4px 1px rgba(64, 224, 208, 0.5);
      transform: translateZ(0);
    }
    .brain-spark .spark-label {
      font-size: 12px;
      font-weight: 600;
      color: #7ff0e0;
      text-shadow: 0 0 4px rgba(64, 224, 208, 0.3);
    }
    /* 点亮动画：从右侧弹出（过冲回弹）→ 停留 → 上飘淡出 */
    .spark-light {
      animation: spark-light-rise 2.5s linear forwards;
    }
    .spark-light::before {
      content: '';
      position: absolute;
      top: 50%; left: 7px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(64, 224, 208, 0.25), transparent 70%);
      transform: translateZ(0);
      animation: spark-light-halo 2.5s linear forwards;
    }
    @keyframes spark-light-rise {
      0%   { opacity: 0; transform: translateZ(0) translateX(60px) scale(0.7); }
      8%   { opacity: 0.5; transform: translateZ(0) translateX(30px) scale(0.85); }
      16%  { opacity: 1; transform: translateZ(0) translateX(-4px) scale(1.05); }
      24%  { transform: translateZ(0) translateX(0) scale(1); }
      68%  { opacity: 1; transform: translateZ(0) translateX(0) scale(1); }
      80%  { opacity: 0.5; transform: translateZ(0) translateY(-3px) scale(0.97); }
      100% { opacity: 0; transform: translateZ(0) translateY(-10px) scale(0.9); }
    }
    @keyframes spark-light-halo {
      0%   { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(0.5); }
      15%  { opacity: 0.5; transform: translateZ(0) translate(0, -50%) scale(1.5); }
      40%  { opacity: 0.2; transform: translateZ(0) translate(0, -50%) scale(2.5); }
      100% { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(3.5); }
    }
    /* 熄灭动画：从右侧弹出（过冲回弹）→ 下坠消散 */
    .spark-extinguish {
      animation: spark-extinguish-fall 2.5s linear forwards;
    }
    .spark-extinguish::before {
      content: '';
      position: absolute;
      top: 50%; left: 7px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(64, 224, 208, 0.25), transparent 70%);
      transform: translateZ(0);
      animation: spark-extinguish-halo 2.5s linear forwards;
    }
    @keyframes spark-extinguish-fall {
      0%   { opacity: 0; transform: translateZ(0) translateX(60px) scale(0.7); }
      8%   { opacity: 0.5; transform: translateZ(0) translateX(30px) scale(0.85); }
      16%  { opacity: 1; transform: translateZ(0) translateX(-4px) scale(1.05); }
      24%  { transform: translateZ(0) translateX(0) scale(1); }
      30%  { opacity: 0.8; transform: translateZ(0) translateY(5px) scale(0.98); }
      50%  { opacity: 0.35; transform: translateZ(0) translateY(22px) scale(0.92); }
      70%  { opacity: 0.15; transform: translateZ(0) translateY(36px) scale(0.87); }
      100% { opacity: 0; transform: translateZ(0) translateY(60px) scale(0.8); }
    }
    @keyframes spark-extinguish-halo {
      0%   { opacity: 0.5; transform: translateZ(0) translate(0, -50%) scale(1); }
      30%  { opacity: 0.2; transform: translateZ(0) translate(0, -50%) scale(0.5); }
      100% { opacity: 0; transform: translateZ(0) translate(0, -50%) scale(0); }
    }

    /* ===== 子 Agent Tab 样式 ===== */
    /* Tab 栏：位于 .header 和 .messages 之间，横向滚动处理溢出 */
    .tab-bar {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      overflow-x: auto;
      padding: 4px 8px 0 8px;
      border-bottom: 1px dashed rgba(180, 150, 50, 0.3);
      background: rgba(255, 255, 255, 0.35);
      scrollbar-width: thin;
    }
    /* 单个 tab：3D 悬浮 + 名称截断 max-width:120px + ellipsis */
    .tab {
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      color: #999;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
      user-select: none;
      background: rgba(245, 240, 230, 0.6);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      margin-right: 2px;
    }
    .tab:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      color: #666;
    }
    /* 活跃 tab：白底 + 底部 2px 青色边框 + 抬高阴影（3D 悬浮） */
    .tab.active {
      background: #fff;
      border-bottom: 2px solid #40a0a0;
      color: #333;
      font-weight: 500;
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.1);
      z-index: 1;
    }
    /* 子 Agent 已完成：半透明 */
    .tab.completed {
      opacity: 0.5;
    }
    /* 子 Agent 异常终止：红色文字 */
    .tab.error {
      color: #e53935;
    }
    /* 未读红点 badge：右上角 6px 圆形，opacity+transition 实现淡入淡出 */
    .tab .badge {
      opacity: 0;
      transition: opacity 200ms ease;
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e53935;
    }
    /* @user 提问等待：闪烁/脉动动画 + 红点 */
    .tab.waiting {
      animation: tab-pulse 1s infinite;
    }
    .tab.waiting .badge {
      opacity: 1;
    }
    @keyframes tab-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }
    /* SSE 建立中：标题后 loading spinner */
    .tab.loading::after {
      content: '⏳';
      margin-left: 4px;
    }
    /* 新 tab 创建：从右滑入 */
    @keyframes tab-slide-in {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .tab.new-tab {
      animation: tab-slide-in 200ms ease;
    }
    /* 子 Agent 消息容器：与主 #messages 同级，默认隐藏 */
    .messages-subagent {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: none;
      background: transparent;
      position: relative;
    }
    .messages-subagent.active {
      display: block;
    }
    /* Tab 切换：消息区淡入 */
    @keyframes tab-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .messages-subagent.fading {
      animation: tab-fade-in 200ms ease;
    }
    /* thinking chain 折叠块：12px 灰字，左侧 2px 灰边框，max-height 200px + 渐变遮罩 */
    .message.thinking {
      font-size: 12px;
      color: #888;
      border-left: 2px solid #ccc;
      padding-left: 8px;
      margin: 4px 0;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      position: relative;
    }
    .message.thinking.expanded {
      max-height: none;
    }
    /* 展开按钮：作为 thinking div 的兄弟元素，不受 overflow-y:auto 裁剪 */
    .thinking-expand-btn {
      display: block;
      width: 100%;
      padding: 4px 0;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #40a0a0;
      text-align: center;
      background: linear-gradient(transparent, #faf8f0 70%);
      margin-top: -4px;
    }
    /* 展开后按钮去掉渐变遮罩 */
    .message.thinking.expanded + .thinking-expand-btn {
      background: none;
    }
    /* @user 提问高亮卡片：黄色 */
    .message.question {
      background: rgba(255, 193, 7, 0.15);
      border: 1px solid rgba(255, 193, 7, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 4px 0;
    }
    /* 子 Agent tab 空状态：居中占位文案 */
    .tab-empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      font-size: 13px;
      padding: 40px;
      text-align: center;
    }
    /* @user 等待时输入栏：黄色 2px 边框脉冲 */
    .input-area.waiting {
      border: 2px solid rgba(255, 193, 7, 0.6);
      animation: input-pulse 1s infinite;
    }
    @keyframes input-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4); }
      50%      { box-shadow: 0 0 8px 2px rgba(255, 193, 7, 0.4); }
    }
    /* ===== 子 Agent Tab 样式结束 ===== */
  </style>
    <!-- 字体配置动态注入：无配置时不注入（用浏览器系统默认字体），有配置时注入 @font-face + 覆盖 font-family -->
    <script>
      (function() {
        if (window.electronAPI && window.electronAPI.FONT_FACE_CSS) {
          var style = document.createElement('style');
          style.textContent = window.electronAPI.FONT_FACE_CSS;
          document.head.appendChild(style);
        }
        if (window.electronAPI && window.electronAPI.FONT_FAMILY) {
          var style2 = document.createElement('style');
          style2.textContent = 'html, body { font-family: ' + window.electronAPI.FONT_FAMILY + '; }';
          document.head.appendChild(style2);
        }
      })();
    </script>
</head>
<body>
  <div class="container">
    <div class="header" id="header">
      <div class="header-title">
        <img src="icons/icon-32.png" class="avatar" />
        <span>妞妞</span>
      </div>
      <button class="close-btn" id="close-btn">×</button>
    </div>

    <!-- 子 Agent 标签栏（新增：位于 header 和 messages 之间，tab 无 × 按钮不可手动关闭） -->
    <div class="tab-bar" id="tabBar">
      <div class="tab active" id="tab-main" onclick="switchTab('main')" title="主对话">主对话</div>
    </div>

    <div class="messages" id="messages"></div>
    
    <!-- 脑区状态侧滑面板（F002: 放在 .messages 外部避免 innerHTML 清空销毁） -->
    <div class="brain-trigger-zone" id="brainTriggerZone"></div>
    <div class="brain-overlay" id="brainOverlay"></div>
    <div class="brain-panel" id="brainPanel">
      <div class="brain-title">脑区状态</div>
      <div id="brainList"></div>
    </div>

    <!-- 脑区鬼火动画容器（在 .messages 外部，避免 innerHTML 清空和滚动影响） -->
    <div class="brain-spark-container" id="brainSparkContainer">
      <div class="spark-light-zone" id="sparkLightZone"></div>
      <div class="spark-extinguish-zone" id="sparkExtinguishZone"></div>
    </div>
    
    <!-- 简洁进度条 -->
    <div class="progress-bar" id="progress-bar">
      <span id="progress-text">处理中...</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-text" id="progress-percent">0%</span>
    </div>
    
    <div class="input-area">
      <textarea id="user-input" placeholder="说点什么..." rows="1"></textarea>
      <button id="send-btn">发送</button>
      <button class="stop-btn" id="stop-btn" style="display:none;" title="停止生成 (/stop)">■</button>
      <div class="slash-dropdown" id="slash-dropdown">
        <div class="slash-dropdown-item" data-cmd="/clear">
          <span class="cmd-name">/clear</span>
          <span class="cmd-desc">先记录当前会话中有价值的信息，再清空会话</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/new">
          <span class="cmd-name">/new</span>
          <span class="cmd-desc">新会话</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/stop">
          <span class="cmd-name">/stop</span>
          <span class="cmd-desc">停止任务（也可按 ESC）</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/compact">
          <span class="cmd-name">/compact</span>
          <span class="cmd-desc">强制压缩上下文（提炼+梦境+日志+压缩）</span>
        </div>
        <div class="slash-dropdown-item" data-cmd="/sleep">
          <span class="cmd-name">/sleep</span>
          <span class="cmd-desc">让精灵进入睡眠，自动整理对话</span>
        </div>
      </div>
    </div>
    
    <div class="status-bar" id="status-bar">
      <div class="stats">
        <span class="stat context-usage" id="context-usage" title="上下文使用率">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="none" stroke="#333" stroke-width="2.5"/>
            <circle cx="10" cy="10" r="8" fill="none" stroke="#4CAF50" stroke-width="2.5"
              stroke-dasharray="50.27" stroke-dashoffset="50.27" stroke-linecap="round"
              transform="rotate(-90 10 10)" id="context-usage-arc">
              <animateTransform attributeName="transform" type="rotate"
                    from="-90 10 10" to="270 10 10"
                    dur="2s" repeatCount="indefinite"
                    begin="indefinite"/>
            </circle>
          </svg>
          <span id="context-usage-text">0%</span>
        </span>
        <span class="stat">📁 <span id="file-count">0</span></span>
        <span class="stat">👤 <span id="person-count">0</span></span>
        <span class="stat">📝 <span id="note-count">0</span></span>
      </div>
      <div class="status-actions">
        <span class="version-label">v0.1.8</span>
        <button class="graph-btn" id="graph-btn">图谱 →</button>
      </div>
    </div>
    <div class="resize-handle" id="resize-handle"></div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    let _clearTidyInFlight = false;  // /clear 整理+清空进行中，gate chat_idle 的 UI 重置（R3-2）
    let _compactingInFlight = false;  // /compact 压缩进行中，gate chat_idle 的 UI 重置（同 _clearTidyInFlight 模式）
    window._compacting = false;  // 压缩中标志，由 compact_status 事件切换
    const closeBtn = document.getElementById('close-btn');
    const header = document.getElementById('header');
    const statusBar = document.getElementById('status-bar');
    const resizeHandle = document.getElementById('resize-handle');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const fileCount = document.getElementById('file-count');
    const personCount = document.getElementById('person-count');
    const noteCount = document.getElementById('note-count');
    const graphBtn = document.getElementById('graph-btn');
    // ========== 斜杠命令下拉框 ==========
    const slashDropdown = document.getElementById('slash-dropdown');
    const slashItems = slashDropdown.querySelectorAll('.slash-dropdown-item');
    let slashSelectedIndex = -1;  // 当前高亮项（-1 = 无）
    let slashJustSelected = false;  // 哨兵：刚选中填入，防止 input 事件重新弹出

    function showSlashDropdown() {
      const value = userInput.value;
      // 仅行首 / 时显示
      if (!value.startsWith('/')) {
        hideSlashDropdown();
        return;
      }
      // 刚选中填入的命令，不重新弹出
      if (slashJustSelected) {
        slashJustSelected = false;
        hideSlashDropdown();
        return;
      }
      // 过滤匹配项
      const query = value.split(/\s/)[0]; // 取第一个词（如 /c）
      let matchCount = 0;
      let firstMatchIndex = -1;
      slashItems.forEach((item, i) => {
        const cmd = item.dataset.cmd;
        if (cmd.startsWith(query)) {
          item.style.display = 'flex';
          matchCount++;
          if (firstMatchIndex === -1) firstMatchIndex = i;
        } else {
          item.style.display = 'none';
        }
      });
      if (matchCount === 0) {
        hideSlashDropdown();
        return;
      }
      // 重置高亮到第一个匹配项
      slashSelectedIndex = firstMatchIndex;
      updateSlashSelection();
      slashDropdown.classList.add('visible');
    }

    function hideSlashDropdown() {
      slashDropdown.classList.remove('visible');
      slashSelectedIndex = -1;
    }

    function updateSlashSelection() {
      slashItems.forEach((item, i) => {
        if (i === slashSelectedIndex) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
      // 滚动选中项到可见区域
      const selected = slashItems[slashSelectedIndex];
      if (selected && selected.style.display !== 'none') {
        selected.scrollIntoView({ block: 'nearest' });
      }
    }
    // 鼠标点击选择命令
    slashItems.forEach(item => {
      item.addEventListener('click', () => {
        const cmd = item.dataset.cmd;
        userInput.value = cmd;
        userInput.setSelectionRange(cmd.length, cmd.length);
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        slashJustSelected = true;
        hideSlashDropdown();
        userInput.focus();
      });

      // 鼠标悬停时更新高亮
      item.addEventListener('mouseenter', () => {
        const visibleItems = Array.from(slashItems).filter(
          it => it.style.display !== 'none'
        );
        const idx = visibleItems.indexOf(item);
        if (idx >= 0) {
          slashSelectedIndex = Array.from(slashItems).indexOf(item);
          updateSlashSelection();
        }
      });
    });

    // 点击外部关闭下拉框
    document.addEventListener('click', (e) => {
      if (slashDropdown.classList.contains('visible') &&
          !slashDropdown.contains(e.target) &&
          e.target !== userInput) {
        hideSlashDropdown();
      }
    });
    let isProcessing = false;

    // ========== 拖拽窗口 ==========
    // 拦截消息区域中的链接点击，用系统默认浏览器打开
    messages.addEventListener('click', (e) => {
      const link = e.target.closest('a[href]');
      if (link) {
        const href = link.getAttribute('href');
        if (!href) return;
        const lowerHref = href.toLowerCase();
        if (lowerHref.startsWith('#')) return; // 锚点链接，浏览器自行处理
        // 仅允许 http/https 协议，阻止 javascript:/data:/vbscript: 等危险协议
        if (!lowerHref.startsWith('http://') && !lowerHref.startsWith('https://')) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        window.electronAPI.openExternal(href);
      }
    });

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    
    header.addEventListener('mousedown', (e) => {
      if (e.target === closeBtn) return;
      isDragging = true;
      dragOffset.x = e.screenX - window.screenX;
      dragOffset.y = e.screenY - window.screenY;
      e.preventDefault();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        window.electronAPI.setPosition(e.screenX - dragOffset.x, e.screenY - dragOffset.y);
      }
    });
    
    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // ========== 调整窗口大小 ==========
    let isResizing = false;
    let resizeStart = { x: 0, y: 0, width: 0, height: 0 };
    
    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStart.x = e.screenX;
      resizeStart.y = e.screenY;
      resizeStart.width = window.outerWidth;
      resizeStart.height = window.outerHeight;
      e.preventDefault();
      e.stopPropagation();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dx = e.screenX - resizeStart.x;
      const dy = e.screenY - resizeStart.y;
      const newWidth = Math.max(300, resizeStart.width + dx);
      const newHeight = Math.max(400, resizeStart.height + dy);
      window.electronAPI.resizeWindow(newWidth, newHeight);
    });
    
    document.addEventListener('mouseup', () => {
      isResizing = false;
    });
    
    // ========== 关闭窗口 ==========
    closeBtn.addEventListener('click', () => {
      window.electronAPI.close();
    });
    
    // ========== 图谱按钮 ==========
    graphBtn.addEventListener('click', () => {
      window.electronAPI.openGraph();
    });
    
    // ========== 发送消息 ==========
    sendBtn.addEventListener('click', sendMessage);

    // === 双击停止按钮逻辑 ===
    // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
    // 单击：只停主 Agent + 检查子 Agent 状态（Task 13 补 checkRunningSubagents）
    let stopClickTimer = null;
    let stopClickFired = false;  // 哨兵：双击已触发，400ms 内后续点击忽略
    const STOP_DOUBLE_CLICK_WINDOW = 400; // ms

    stopBtn.addEventListener('click', () => {
      if (stopClickFired) {
        // 双击刚触发，400ms 内的后续点击忽略
        return;
      }
      if (stopClickTimer) {
        // 第二次点击（双击）
        clearTimeout(stopClickTimer);
        stopClickTimer = null;
        stopClickFired = true;
        setTimeout(() => { stopClickFired = false; }, STOP_DOUBLE_CLICK_WINDOW);
        // 双击：触发批量 /stop 所有子 Agent + 停主 Agent
        fetch('/api/stop_all', { method: 'POST' }).catch(e => console.error('stop_all 请求失败', e));
        window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
      } else {
        // 第一次点击（单击）
        stopClickTimer = setTimeout(() => {
          stopClickTimer = null;
          // 子 Agent tab：单击停当前子 Agent（§12；双击仍走上面的批量停止语义，不受影响）
          if (_activeTab !== 'main') {
            if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
              window.electronAPI.sendSubagentMessage(_activeTab, '/stop');
            }
            return;
          }
          // 单击超时：只停主 Agent
          window.electronAPI.sendMessage('/stop').catch(e => console.error('停止主 Agent 失败:', e));
          // 提示用户还有子 Agent 在跑（如果有）—— Task 13 实现
          checkRunningSubagents();
        }, STOP_DOUBLE_CLICK_WINDOW);
      }
    });

    async function checkRunningSubagents() {
      try {
        const resp = await fetch('/api/subagents/running');
        const data = await resp.json();
        if (data.count > 0) {
          const names = data.subagents.map(s => s.unique_name).join(', ');
          alert(`已停主 Agent。${data.count} 个子 Agent 仍在运行：${names}\n双击停止按钮可全部终止。`);
        }
      } catch (e) {
        console.error('查询子 Agent 状态失败', e);
      }
    }

    // 自动调整 textarea 高度
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      showSlashDropdown();
    });

    userInput.addEventListener('keydown', (e) => {
      // 通知 spirit 用户正在活动（重置空闲计时器）
      window.electronAPI.notifyActivity();

      // 下拉框可见时优先处理导航
      if (slashDropdown.classList.contains('visible')) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          // 找下一个可见项
          for (let i = slashSelectedIndex + 1; i < slashItems.length; i++) {
            if (slashItems[i].style.display !== 'none') {
              slashSelectedIndex = i;
              updateSlashSelection();
              break;
            }
          }
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          // 找上一个可见项
          for (let i = slashSelectedIndex - 1; i >= 0; i--) {
            if (slashItems[i].style.display !== 'none') {
              slashSelectedIndex = i;
              updateSlashSelection();
              break;
            }
          }
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey && slashSelectedIndex >= 0) {
          e.preventDefault();
          // 选中项：填入输入框，关闭下拉框
          const cmd = slashItems[slashSelectedIndex].dataset.cmd;
          userInput.value = cmd;
          userInput.setSelectionRange(cmd.length, cmd.length);
          // 触发 input 事件调整高度
          userInput.style.height = 'auto';
          userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
          slashJustSelected = true;
          hideSlashDropdown();
          userInput.focus();
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();  // 阻止冒泡到 document 的 ESC 监听器，避免同时触发 /stop
          hideSlashDropdown();
          return;
        }
        if (e.key === 'Tab' && slashSelectedIndex >= 0) {
          e.preventDefault();
          // Tab 也能选中
          const cmd = slashItems[slashSelectedIndex].dataset.cmd;
          userInput.value = cmd;
          userInput.setSelectionRange(cmd.length, cmd.length);
          userInput.style.height = 'auto';
          userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
          slashJustSelected = true;
          hideSlashDropdown();
          userInput.focus();
          return;
        }
      }

      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      // Shift+Enter 允许换行（默认行为）
    });

    // 重试发送消息（自动重连）
    async function sendMessageWithRetry(text, source, maxRetries = 10, delay = 2000) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const result = await window.electronAPI.sendMessage(text, source);
          
          // 检查返回的错误是否是连接错误
          if (result && result.error) {
            const isConnectionError = result.error.includes('ECONNREFUSED') ||
              result.error.includes('connect') ||
              result.error.includes('ENOTFOUND');
              // 注意：不重试 ECONNRESET（服务器已收到请求，重试会导致重复消息）
            
            if (isConnectionError && i < maxRetries - 1) {
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
          }
          
          return result;
        } catch (err) {
          const errMsg = err.message || String(err);
          const isConnectionError = errMsg.includes('ECONNREFUSED') ||
            errMsg.includes('connect') ||
            errMsg.includes('ENOTFOUND');
          
          if (isConnectionError && i < maxRetries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
          } else {
            throw err;
          }
        }
      }
      return null;
    }

    // 把文本插入到输入框末尾，自动补换行让路径独占一行：
    // - 已有内容为空或末尾是换行/空格 → 直接追加路径
    // - 已有内容末尾不是换行/空格 → 补换行再追加路径
    // - 路径末尾自动补换行，光标停在新行行首，用户补充文字在新行输入
    // 这样主 Agent 能识别"行首是绝对路径"，避免路径含空格时与用户补充文字混淆
    // 最后聚焦+触发 input 事件让 textarea 自适应高度
    function insertTextToInput(text) {
      const current = userInput.value;
      if (current && !current.endsWith('\n') && !current.endsWith(' ')) {
        userInput.value = current + '\n' + text + '\n';
      } else {
        userInput.value = current + text + '\n';
      }
      userInput.focus();
      // 光标定位到末尾（新行行首）
      userInput.setSelectionRange(userInput.value.length, userInput.value.length);
      userInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    async function sendMessage() {
      slashJustSelected = false;  // 重置哨兵：选中后回车执行，防止下次输入 / 时不弹出
      const text = userInput.value.trim();
      if (!text) { userInput.style.height = 'auto'; return; }
      sendBtn.disabled = true;

      // ===== 子 Agent tab 分支（§5.6）：必须在 addMessage('user') / showTyping() 之前 early return =====
      if (_activeTab !== 'main') {
        userInput.value = '';
        userInput.style.height = 'auto';
        // /clear、/new、/compact、/sleep 只对主对话有效（§5.5）
        if (text === '/clear' || text === '/new' || text === '/compact' || text === '/sleep') {
          addSubagentMessageToTab(_activeTab, 'system', '请切回主对话使用此命令');
          sendBtn.disabled = false;
          return;
        }
        // /stop：终止当前子 Agent（不渲染为用户消息，与主对话 /stop 行为一致）
        if (text === '/stop') {
          if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
            window.electronAPI.sendSubagentMessage(_activeTab, '/stop');
          }
          sendBtn.disabled = false;
          return;
        }
        // 普通消息：作为补充信息（supplement）发给子 Agent（§5.3）
        const container = document.getElementById('messages-' + _activeTab);
        if (container) {
          addSubagentMessageToTab(_activeTab, 'user', text);
          // 发送到子 Agent API（后端就位后生效）
          if (window.electronAPI && window.electronAPI.sendSubagentMessage) {
            window.electronAPI.sendSubagentMessage(_activeTab, text);
          }
          // 发送后等待态（§22）：placeholder 变更 + 发送按钮 disabled，下一条事件到达时恢复
          _setSubagentInputWaiting(true);
        } else {
          sendBtn.disabled = false;
        }
        return;  // early return：不走主对话逻辑
      }

      // /stop 指令 - 停止当前 Agent 工作（允许在 isProcessing=true 时执行）
      if (text === '/stop') {
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = false;
        try {
          await window.electronAPI.sendMessage('/stop');
        } catch (e) {
          console.error('停止失败:', e);
          addSystemMessage('停止失败: ' + (e.message || e));
        }
        return;
      }

      // /clear 指令 - 先整理（小憩+日志）后清空（后端跑完 entity/dream/journal 才清空，阻塞）
      if (text === '/clear') {
        userInput.value = '';
        userInput.style.height = 'auto';
        if (isProcessing) {
          // busy：先 /stop 停主 Agent（全局 stop 标志，让持锁者在 finally 释放 _chat_lock），不做等 chat_idle
          // 注意：主 Agent 卡在子 agent tool 时 /stop 不传播到运行中子 agent，后端 acquire(120s) 可能超时 → 优雅失败需重试
          try {
            await window.electronAPI.sendMessage('/stop');
          } catch (e) {
            console.error('停止失败:', e);
            addSystemMessage('停止失败: ' + (e.message || e));
          }
        }
        // R3-2：整理/清空进行中标志，gate chat_idle 的 UI 重置（见 Step 3）
        _clearTidyInFlight = true;
        sendBtn.disabled = true;
        userInput.disabled = true;
        addSystemMessage('正在整理对话并清空会话，请稍候…');
        try {
          await clearChat(true);
        } finally {
          _clearTidyInFlight = false;
          sendBtn.disabled = false;
          userInput.disabled = false;
          stopBtn.style.display = isProcessing ? 'flex' : 'none';  // 镜像 /new：整理完成且空闲时隐藏 stop 按钮
          userInput.focus();
        }
        return;
      }

      // /new 指令 - 清空聊天记录
      if (text === '/new') {
        userInput.value = '';
        userInput.style.height = 'auto';
        stopBtn.style.display = 'none';
        sendBtn.disabled = false;
        await clearChat();
        return;
      }

      // /sleep 指令 - 让精灵进入睡眠（触发睡眠整理流程）
      if (text === '/sleep') {
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = false;
        // isProcessing 检查（P2-1 主防线）：Agent 忙碌时精灵处于 BUSY 状态，
        // 此时进入睡眠会导致 Agent 完成后 chat_idle 把精灵从 SLEEP 强制唤醒回 IDLE
        // 的状态冲突（整理还在后端跑但精灵已显示 IDLE）。忙碌时提示用户，不发 IPC。
        // spirit.html 侧的 BUSY 守卫是兜底（防御直接 IPC 调用）。
        if (isProcessing) {
          addSystemMessage('⚠️ 精灵忙碌中，请先 /stop 停止当前任务再让它睡觉');
          return;
        }
        addSystemMessage('💤 精灵已进入睡眠，开始整理…');
        window.electronAPI.enterSleep();
        return;
      }

      // /compact 指令 - 强制压缩上下文（entity→dream→journal→context-manager 模式三，阻塞式）
      if (text === '/compact') {
        userInput.value = '';
        userInput.style.height = 'auto';
        if (isProcessing) {
          // busy：先 /stop 停主 Agent（同 /clear 模式）
          try {
            await window.electronAPI.sendMessage('/stop');
          } catch (e) {
            console.error('停止失败:', e);
            addSystemMessage('停止失败: ' + (e.message || e));
          }
        }
        _compactingInFlight = true;
        sendBtn.disabled = true;
        userInput.disabled = true;
        addSystemMessage('正在强制压缩上下文，请稍候…');
        try {
          await compactContext();
        } finally {
          _compactingInFlight = false;
          sendBtn.disabled = false;
          userInput.disabled = false;
          stopBtn.style.display = isProcessing ? 'flex' : 'none';
          userInput.focus();
        }
        return;
      }

      // 铁律1：用户触发的 → 先刷新页面（即时反馈）
      const userMsg = addMessage('user', text);
      if (!userMsg) { return; }  // addMessage 返回 null（如 tool 消息被过滤），跳过后续

      userInput.value = '';
      userInput.style.height = 'auto';
      showTyping();
      window.electronAPI.notifyBusy(true, 'chat');

      try {
        // 提交用户手动修改的脑区状态（在发送消息前）
        await submitBrainChanges();
        const result = await sendMessageWithRetry(text);
      } finally {
        // chat 窗口 UI 状态（hideTyping/stopBtn/isProcessing）由 SSE chat_idle 驱动
        // 见缝插针场景下 HTTP 立即返回但 Agent 仍在跑，此处不能重置 chat UI 状态
        // 否则会把停止按钮误隐藏、Escape 失效、/clear 误走空闲分支
        //
        // 但 notifyBusy(false, 'chat') 必须在此处调用——它配对的是
        // chat.html:922 sendMessage 入口的 notifyBusy(true, 'chat')，属于
        // spirit 窗口 busyCount 引用计数层（非 chat UI 状态层）。
        // 见缝插针 N 次回车 = N 次 sendMessage +1，必须 N 次 finally -1 配对，
        // 否则 spirit busyCount 永远 +N 不归零，小女孩卡 busy.gif。
        // spirit 是引用计数模型（spirit.html:190 busyCount），-1 受 >0 守卫保护，
        // 重复调用不会减到负数，安全。
        window.electronAPI.notifyBusy(false, 'chat');
        sendBtn.disabled = false;
        loadStats();
        userInput.focus();
      }
    }
    
    // 清空聊天记录
    async function clearChat(forceTidy) {
