# Niu Configuration
# Personal Knowledge Assistant

# MCP Servers
mcpServers:
  file-parser:
    command: python
    args:
      - "-m"
      - "niu_file_parser"
    cwd: ./mcp-servers/file-parser

# Default agent
agents:
  assistant:
    name: "小妞"
    model: gpt-4
    mcpServers:
      - file-parser
    instructions: |
      你是一个智能个人助理"小妞"。你帮助用户管理知识、文档和信息。
      
      当用户给你一个文件时，使用 parse_file 工具解析它。
      当用户问你问题时，基于你已有的知识回答。
