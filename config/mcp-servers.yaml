# Niu MCP Servers Configuration
# These servers provide tools for the Niu assistant

# File Parser - Parse various document formats (PDF, Word, PPT, Excel, MD, HTML)
file-parser:
  command: ${PYTHON_PATH}
  args:
    - "-m"
    - "niu_file_parser"
  workdir: mcp-servers/file-parser/src
  preload: true
  tools:
    parse_file: {visibility: hidden}
    list_supported_formats: {visibility: hidden}

# Knowledge Graph - LightRAG-based brain graph (replaces KuzuDB kg-server)
# NOTE: kg-server tools are now provided by LightRAG adapter/pipeline.
# The kg-server MCP module is no longer loaded at startup (removed from mcp_loader.py).
# KG queries go through /api/kg/* endpoints which use LightRAGAdapter.
# KG ingestion goes through LightRAGPipeline (ainsert/ainsert_custom_kg).
kg-server:
  command: ${PYTHON_PATH}
  args:
    - "-m"
    - "niu_kg_server"
  workdir: mcp-servers/kg-server/src
  preload: false  # No longer preloaded — LightRAG handles KG internally
  tools:
    explore_node: {visibility: hidden}
    get_related_entities: {visibility: hidden}
    query_graph: {visibility: hidden}
    find_path: {visibility: hidden}
    hub_entities: {visibility: hidden}
    get_related_concepts: {visibility: hidden}
    search_documents: {visibility: hidden}
    get_document: {visibility: hidden}
    list_documents: {visibility: hidden}
    graph_stats: {visibility: hidden}
    create_document: {visibility: hidden}
    create_entity: {visibility: hidden}
    create_concept: {visibility: hidden}
    link_document_entity: {visibility: hidden}
    link_document_concept: {visibility: hidden}
    link_entities: {visibility: hidden}
    surprising_connections: {visibility: hidden}
    graph_changelog: {visibility: hidden}
    graph_snapshot: {visibility: hidden}
    list_entities: {visibility: hidden}
    list_concepts: {visibility: hidden}
    update_entity_status: {visibility: hidden}
    delete_entity: {visibility: hidden}

# LightRAG Unified Server - Replaces vector-store + kg-server with 15 unified tools (5 query + 4 insert + 6 management)
lightrag-server:
  command: ${PYTHON_PATH}
  args:
    - "-m"
    - "niu_lightrag_server"
  workdir: mcp-servers/lightrag-server/src
  preload: true
  tools:
    lightrag_query: {visibility: hidden}
    lightrag_query_data: {visibility: hidden}
    lightrag_search_entities: {visibility: hidden}
    lightrag_get_graph: {visibility: hidden}
    lightrag_insert: {visibility: hidden}
    lightrag_insert_custom_kg: {visibility: hidden}
    lightrag_insert_entity: {visibility: hidden}
    lightrag_insert_relation: {visibility: hidden}
    lightrag_delete_entity: {visibility: hidden}
    lightrag_get_document: {visibility: hidden}
    lightrag_delete_document: {visibility: hidden}
    lightrag_document_status: {visibility: hidden}
    lightrag_list_entities: {visibility: hidden}
    lightrag_merge_entities: {visibility: hidden}
    lightrag_timeline_query: {visibility: hidden}

# Vector Store - Semantic search using embeddings (DISABLED — replaced by lightrag-server)
vector-store:
  command: ${PYTHON_PATH}
  args:
    - "-m"
    - "niu_vector_store"
  workdir: mcp-servers/vector-store/src
  preload: false
  tools:
    add_document: {visibility: hidden}
    search_documents: {visibility: hidden}
    get_document: {visibility: hidden}
    delete_document: {visibility: hidden}
    list_documents: {visibility: hidden}
    update_metadata: {visibility: hidden}

