server: memory-server
directory: memory
description: "记忆系统 — 长期记忆存取与检索、话题暂存、例行数据轻提醒"

tools:
  - name: user_memory_remember
    category: write
    short: "添加便签或长期记忆(task最多1条,memory最多9条)"
    long: "添加便签或长期记忆(task最多1条,memory最多9条)"
    parameters:
      - name: content
        position: 1
        type: string
        required: true
      - name: type
        type: string
        enum: [task, memory]
        default: memory

  - name: user_memory_forget
    category: admin
    short: "删除便签或记忆(1-10)"
    long: "按序号(1-10)或关键词删除"
    parameters:
      - name: index
        type: integer
      - name: keyword
        type: string

  - name: user_memory_list
    category: read
    short: "查看所有记忆"
    long: "查看当前所有用户长期记忆"
    parameters: []

  - name: conversation_park
    category: write
    short: "暂存告一段落的话题(回头再处理)"
    long: "用户明确说「这事先告一段落/回头再说/先放着」时调用，把该话题存入暂存列表。summary=一句话说清是什么事；detail=3-5句关键上下文(讨论什么/进展到哪/卡点/下一步)。不要主动替用户决定暂存；闲聊随口「回头再聊」不要调用。"
    parameters:
      - name: summary
        position: 1
        type: string
        required: true
      - name: detail
        position: 2
        type: string
        required: true

  - name: conversation_recall
    category: write
    short: "召回暂存的话题(召回即从列表移除)"
    long: "用户提起之前暂存的话题时调用，参数为提醒行里的序号(①=最新)。无法确定指哪一项时按 summary 语义匹配，仍不确定先向用户列候选确认，禁止猜序号。返回 summary+detail+锚点；锚点有效时可用 get_messages/read_history_block 回放原文。召错项时立即用返回的 detail 重新 park。"
    parameters:
      - name: index
        position: 1
        type: integer
        required: true

  - name: daily_set
    category: write
    short: "写入/更新例行数据(轻提醒区,带过期时间)"
    long: "写入一条例行数据到 memory.json daily 区域。key=数据源名(小写字母/数字/下划线,≤30字符)；text=提醒文本(≤100字符,自动单行化;大内容请写 ~/.niu/tmp/ 临时文件并把路径写进 text 作指针,注意 tmp 24h 清理,expires_at 勿超 24h)；expires_at=ISO过期时间(如 2026-09-09T07:00:00)。写入时自动清理全区域过期条目。同 key 重复调用=更新。上限 20 个 key。"
    parameters:
      - name: key
        position: 1
        type: string
        required: true
      - name: text
        position: 2
        type: string
        required: true
      - name: expires_at
        position: 3
        type: string
        required: true

  - name: daily_delete
    category: write
    short: "删除例行数据(按 key)"
    long: "删除 daily 区域指定 key 的条目。key 不存在时幂等返回 deleted=false。"
    parameters:
      - name: key
        position: 1
        type: string
        required: true
