server: memory-server
directory: memory
description: "记忆系统 — 长期记忆存取与检索"

tools:
  - name: user_memory_remember
    category: write
    short: "添加便签或长期记忆(task最多1条,memory最多9条)"
    long: "添加便签或长期记忆(task最多1条,memory最多9条)"
    parameters:
      - name: content
        position: 1
        type: string
        required: true
      - name: type
        type: string
        enum: [task, memory]
        default: memory

  - name: user_memory_forget
    category: admin
    short: "删除便签或记忆(1-10)"
    long: "按序号(1-10)或关键词删除"
    parameters:
      - name: index
        type: integer
      - name: keyword
        type: string

  - name: user_memory_list
    category: read
    short: "查看所有记忆"
    long: "查看当前所有用户长期记忆"
    parameters: []
