server: ha-server
directory: ha
description: "智能家居控制 — 查询设备状态、控制设备、订阅状态变化通知、管理集成"

tools:
  - name: ha_setup
    category: write
    short: "配置 HA 连接"
    long: "配置 Home Assistant 连接。首次使用时传入 ha_url 和 ha_token。无参数时返回当前连接状态和订阅列表"
    parameters:
      - name: ha_url
        type: string
        description: "HA 地址，如 http://localhost:8123"
      - name: ha_token
        type: string
        sensitive: true
        description: "Long-Lived Access Token"

  - name: ha_status
    category: read
    short: "查询设备状态"
    long: "查询智能家居设备、场景、自动化的当前状态。返回按区域分类的设备列表，含可用操作及关键属性（温度、湿度等）"
    parameters:
      - name: area
        flag: area
        type: string
        description: "按区域过滤，如 书房"
      - name: domain
        flag: domain
        type: string
        description: "按设备类型过滤，如 light、climate"

  - name: ha_control
    category: write
    short: "控制设备"
    long: "控制智能家居设备。entity_id 从 ha_status 获取。优先用 service 指定 HA 服务（如 vacuum.start、fan.set_preset_mode），service_data 传服务参数；兼容旧 action 模式（turn_on/turn_off/toggle/set_brightness/set_temperature），value 传亮度 0-100 或目标温度"
    parameters:
      - name: entity_id
        position: 1
        type: string
        required: true
        description: "实体 ID，如 light.xxx、vacuum.xxx"
      - name: action
        position: 2
        type: string
        description: "兼容动作名，如 turn_on/turn_off/toggle/set_brightness/set_temperature。优先使用 service 参数"
      - name: service
        type: string
        description: "HA 服务名（domain.service），如 vacuum.start、fan.set_preset_mode、climate.set_hvac_mode。ha_status 返回的 services 列表中可查"
      - name: value
        type: number
        description: "亮度 0-100 或目标温度（仅 action 兼容模式）"
      - name: service_data
        type: object
        cli_format: json
        description: "服务额外参数，如 {\"fan_speed\": \"gentle\"}、{\"hvac_mode\": \"cool\"}。与 service 配合使用"

  - name: ha_subscribe
    category: write
    short: "订阅状态通知"
    long: "订阅设备状态变化通知。支持 state_change/above/below 三种条件。触发时通过 [智能家居] 前缀推送。operation=list 查看，operation=unsubscribe 取消"
    parameters:
      - name: entity_id
        position: 1
        type: string
        description: "监听的实体 ID"
      - name: condition
        position: 2
        type: string
        enum: [state_change, above, below]
        description: "条件类型"
      - name: value
        type: number
        description: "above/below 时的阈值"
      - name: from_state
        flag: from-state
        type: string
        description: "state_change 起始状态过滤"
      - name: to_state
        flag: to-state
        type: string
        description: "state_change 目标状态过滤"
      - name: description
        type: string
        description: "触发时的描述文本"
      - name: trigger_id
        flag: trigger-id
        type: string
        description: "触发器标识，取消订阅时必填"
      - name: operation
        type: string
        enum: [unsubscribe, list]
        description: "操作类型，不传表示新增"

  - name: ha_integrate
    category: write
    short: "管理集成"
    long: "管理 HA 集成（添加/删除设备品牌）。发起配置流只需 handler，返回表单后用 flow_id+data 推进。operation=delete 删除集成"
    parameters:
      - name: handler
        position: 1
        type: string
        description: "集成域名，如 xiaomi_miot"
      - name: flow_id
        flag: flow-id
        type: string
        description: "配置流 ID，推进步骤时必填"
      - name: data
        type: object
        cli_format: json
        description: "表单数据键值对"
      - name: operation
        type: string
        enum: [delete]
        description: "操作类型，delete 表示删除集成"
      - name: entry_id
        flag: entry-id
        type: string
        description: "集成条目 ID，删除时必填"
