server: ha-server
directory: ha
description: "智能家居 — 立即执行用 ha_control；定时一次用 scheduler；条件触发持续生效用 ha_automation；多设备瞬间切换用 ha_scene；有序列有延时用 ha_script"

tools:
  - name: ha_setup
    category: write
    short: "配置 HA 连接"
    long: "配置 Home Assistant 连接。首次使用时传入 ha_url 和 ha_token。无参数时返回当前连接状态和订阅列表"
    parameters:
      - name: ha_url
        type: string
        description: "HA 地址，如 http://localhost:8123"
      - name: ha_token
        type: string
        sensitive: true
        description: "Long-Lived Access Token"

  - name: ha_status
    category: read
    short: "查询设备状态（默认精简，entity_id查全量）"
    long: "查询智能家居设备、场景、自动化的当前状态。默认返回所有设备的精简列表（name/area/entity_id/type/state/actions）。传入 entity_id 返回该设备完整信息（含 services 服务参数定义和 properties 状态属性）。调用带参数服务前先用 entity_id 查询获取参数详情。"
    parameters:
      - name: area
        flag: area
        type: string
        description: "按区域过滤，如 书房"
      - name: domain
        flag: domain
        type: string
        description: "按设备类型过滤，如 light、climate"
      - name: entity_id
        flag: entity_id
        type: string
        description: "查询单个设备的完整信息（含服务参数定义）。传入时只返回该设备"

  - name: ha_control
    category: write
    short: "控制设备"
    long: "控制智能家居设备。entity_id 从 ha_status 获取。优先用 service 指定 HA 服务（如 vacuum.start、fan.set_preset_mode），service_data 传服务参数；兼容旧 action 模式（turn_on/turn_off/toggle/set_brightness/set_temperature），value 传亮度 0-100 或目标温度"
    parameters:
      - name: entity_id
        position: 1
        type: string
        required: true
        description: "实体 ID，如 light.xxx、vacuum.xxx"
      - name: action
        position: 2
        type: string
        description: "兼容动作名，如 turn_on/turn_off/toggle/set_brightness/set_temperature。优先使用 service 参数"
      - name: service
        type: string
        description: "HA 服务名（domain.service），如 vacuum.start、fan.set_preset_mode、climate.set_hvac_mode。ha_status(entity_id=...) 返回的 services 列表中可查（精简模式不返回 services，需先用 entity_id 查询）"
      - name: value
        type: number
        description: "亮度 0-100 或目标温度（仅 action 兼容模式）"
      - name: service_data
        type: object
        cli_format: json
        description: "服务额外参数，如 {\"fan_speed\": \"gentle\"}、{\"hvac_mode\": \"cool\"}。与 service 配合使用"

  - name: ha_subscribe
    category: write
    short: "订阅状态通知"
    long: "订阅设备状态变化通知。支持 state_change/above/below 三种条件。触发时通过 [智能家居] 前缀推送。operation=list 查看，operation=unsubscribe 取消"
    parameters:
      - name: entity_id
        position: 1
        type: string
        description: "监听的实体 ID"
      - name: condition
        position: 2
        type: string
        enum: [state_change, above, below]
        description: "条件类型"
      - name: value
        type: number
        description: "above/below 时的阈值"
      - name: from_state
        flag: from-state
        type: string
        description: "state_change 起始状态过滤"
      - name: to_state
        flag: to-state
        type: string
        description: "state_change 目标状态过滤"
      - name: description
        type: string
        description: "触发时的描述文本"
      - name: trigger_id
        flag: trigger-id
        type: string
        description: "触发器标识，取消订阅时必填"
      - name: operation
        type: string
        enum: [unsubscribe, list]
        description: "操作类型，不传表示新增"

  - name: ha_integrate
    category: write
    short: "管理集成"
    long: "管理 HA 集成（添加/删除设备品牌）。发起配置流只需 handler，返回表单后用 flow_id+data 推进。operation=delete 删除集成"
    parameters:
      - name: handler
        position: 1
        type: string
        description: "集成域名，如 xiaomi_miot"
      - name: flow_id
        flag: flow-id
        type: string
        description: "配置流 ID，推进步骤时必填"
      - name: data
        type: object
        cli_format: json
        description: "表单数据键值对"
      - name: operation
        type: string
        enum: [delete]
        description: "操作类型，delete 表示删除集成"
      - name: entry_id
        flag: entry-id
        type: string
        description: "集成条目 ID，删除时必填"

  - name: ha_automation
    category: write
    short: "管理自动化"
    long: "管理自动化：创建/查看/修改/删除/启用/禁用/手动触发。自动化是条件触发持续生效的规则。立即执行一次用 ha_control，定时一次用 scheduler。trigger platform: state/numeric_state/time/time_pattern/sun/zone/event/template/mqtt/calendar。condition type: state/numeric_state/time/sun/zone/template/and/or/not。action type: 服务调用(用action键)/delay/wait_for_trigger/choose/if/repeat/parallel/scene/stop。mode: single|restart|queued|parallel"
    parameters:
      - name: action
        position: 1
        type: string
        required: true
        enum: [list, get, create, update, delete, enable, disable, trigger]
        description: "操作类型"
      - name: name
        type: string
        description: "自动化名称"
      - name: config
        type: object
        cli_format: json
        description: "自动化配置 JSON"
      - name: confirm
        type: boolean
        flag: confirm
        description: "删除确认，传 true"
      - name: detail
        type: boolean
        flag: detail
        description: "list 时返回完整配置"

  - name: ha_scene
    category: write
    short: "管理场景"
    long: "管理场景：创建/查看/修改/删除/激活/快照。场景是多设备瞬间切换到预设状态。有序列有延时用 ha_script，条件触发用 ha_automation。entities 参数名使用 ha_status(entity_id=...) 返回的 services 字段中的服务参数名（如 brightness_pct，精简模式不返回 services，需先用 entity_id 查询），程序自动转换为 HA 内部格式"
    parameters:
      - name: action
        position: 1
        type: string
        required: true
        enum: [list, get, create, update, delete, activate, snapshot]
        description: "操作类型"
      - name: name
        type: string
        description: "场景名称"
      - name: config
        type: object
        cli_format: json
        description: "场景配置 JSON"
      - name: confirm
        type: boolean
        flag: confirm
        description: "删除确认，传 true"
      - name: detail
        type: boolean
        flag: detail
        description: "list 时返回完整配置"
      - name: entity_ids
        type: array
        cli_format: json
        items:
          type: string
        flag: entity-ids
        description: "snapshot 操作要快照的设备 ID 列表"

  - name: ha_script
    category: write
    short: "管理脚本"
    long: "管理脚本：创建/查看/修改/删除/运行。脚本是有序列、有延时的多步骤操作。瞬间切换用 ha_scene，条件触发用 ha_automation。sequence 动作: 服务调用(action键)/delay/wait_for_trigger/choose/if/repeat/parallel/condition。mode: single|restart|queued|parallel"
    parameters:
      - name: action
        position: 1
        type: string
        required: true
        enum: [list, get, create, update, delete, run]
        description: "操作类型"
      - name: name
        type: string
        description: "脚本名称"
      - name: config
        type: object
        cli_format: json
        description: "脚本配置 JSON"
      - name: confirm
        type: boolean
        flag: confirm
        description: "删除确认，传 true"
      - name: detail
        type: boolean
        flag: detail
        description: "list 时返回完整配置"
