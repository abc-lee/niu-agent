[project]
name = "niu-memory-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "loguru>=0.7.0", "sentence-transformers>=2.2.0"]

[project.scripts]
niu-memory-server = "niu_memory_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
