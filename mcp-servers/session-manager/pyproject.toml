[project]
name = "niu-session-manager"
version = "0.1.0"
description = "Session message management MCP server for context compression"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
niu-session-manager = "niu_session_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niu_session_manager"]
