[project]
name = "niu-file-parser"
version = "0.1.0"
description = "File parser MCP server for Niu - parses PDF, Word, Markdown, etc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
niu-file-parser = "niu_file_parser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
