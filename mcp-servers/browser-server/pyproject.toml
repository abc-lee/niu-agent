[project]
name = "niu-browser-server"
version = "0.1.0"
description = "Browser automation MCP server for Niu using Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "loguru>=0.7.0",
    "playwright>=1.40.0",
]

[project.scripts]
niu-browser-server = "niu_browser_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niu_browser_server"]
