[project]
name = "niu-photo-server"
version = "0.1.0"
description = "File & Photo management MCP server for Niu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    # 人脸识别依赖
    "insightface>=0.7.3",
    "onnxruntime>=1.15.0",  # CPU 版本（默认，所有用户可用）
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# GPU 加速（可选，用户自行安装）
gpu = [
    "onnxruntime-gpu>=1.15.0",  # CUDA GPU 版本
]
directml = [
    "onnxruntime-directml>=1.15.0",  # Windows DirectML（无需 CUDA）
]

[project.scripts]
niu-photo-server = "niu_photo_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niu_photo_server"]
