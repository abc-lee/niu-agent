[project]
name = "niu-vector-store"
version = "0.1.0"
description = "Vector store MCP server for Niu - semantic search with embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
niu-vector-store = "niu_vector_store:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niu_vector_store"]
