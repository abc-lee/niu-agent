[project]
name = "niu-embedding-service"
version = "0.1.0"
description = "Shared embedding service for Niu Assistant"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=2.2.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
niu-embedding-service = "niu_embedding_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
