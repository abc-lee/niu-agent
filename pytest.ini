[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
timeout = 30
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    p0: P0 critical tests
    p1: P1 optimization tests
    p2: P2 enhancement tests
    slow: slow running tests
    integration: integration tests
