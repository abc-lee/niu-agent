[package]
name = "niu-launcher"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "local-time"] }
time = { version = "0.3", features = ["macros"] }
dunce = "1"
dirs = "6"
ctrlc = "3"

iced = { version = "0.13", features = ["canvas"] }
rfd = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
# Splash 关闭后把启动器降级为后台应用（TransformProcessType），避免活动监视器标"未响应"。
# 版本与 feature 与 niu-natives 保持一致。
objc2-application-services = { version = "=0.3.2", features = ["Processes"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
